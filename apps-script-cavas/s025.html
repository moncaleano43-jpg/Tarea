<script>

/* ============================================================
   v35 — Registro dinámico de marcas, capa histórica real (Excel),
   gemelo histórico, anomalías, índice explicable, proyecciones con
   procedencia, comparador universal, explorador histórico y Cifra
   multicapa. Todo local; nunca se inventan datos.
   ============================================================ */
(function(){
  if(!window.App||!App.V31||!App.D||!App.Alta) return;
  const {esc,fmtS,f,parseDT,HOUR}=App.U, C=App.C, V=App.V31, LS=V.LS, tit=V.tit;
  const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
  const key=m=>String(m||"").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
  const nrm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9ñ\s.\-/]/g," ").replace(/\s+/g," ").trim();
  const pend=()=>App.D.pend(Date.now());
  const mean=a=>{ a=a.filter(x=>x!=null&&isFinite(x)); return a.length?a.reduce((s,x)=>s+x,0)/a.length:null; };
  const pctl=(a,p)=>{ a=a.filter(x=>x!=null&&isFinite(x)).sort((x,y)=>x-y); if(!a.length) return null; const i=(a.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i); return a[lo]+(a[hi]-a[lo])*(i-lo); };
  const med=a=>pctl(a,.5);
  const hh=h=>h==null?"—":(h>=48?(h/24).toFixed(1).replace(".0","")+" d":Math.round(h)+" h");
  const n1=(v,d=1)=>v==null||!isFinite(v)?"—":f(v,d);
  const SIN="No hay suficientes datos para calcularlo con respaldo.";

  /* ---------- 1. Registro dinámico de marcas ---------- */
  const BASE=["AGUILA","ESTANDAR","LIGHT","AZTECA","PILSEN","CLUB COLOMBIA"].slice();
  const REG0=(App.MARCAS||BASE).slice();
  const regCfg=()=>((App.S.config||{}).marcasReg||{}).lista||[];
  const Marcas={
    todas(){ const reg=regCfg(), mp=new Map(); REG0.forEach(n=>mp.set(key(n),{id:key(n),nombre:key(n),activa:true,base:true}));
      reg.forEach(r=>{ const k=r.id||key(r.nombre); const o=mp.get(k); if(o) o.activa=r.activa!==false; else mp.set(k,{id:k,nombre:key(r.nombre||k),activa:r.activa!==false,base:false,creada:r.creada}); });
      return [...mp.values()].map(m=>Object.assign(m,{alta:App.Alta.de(m.nombre),dias:Marcas.dias(m.nombre)})); },
    activas(){ return Marcas.todas().filter(m=>m.activa); },
    dias(m){ const d=((App.S.config||{}).marcas||{}).dias||{}; return d[m]!=null?+d[m]:(key(m)==="LIGHT"?4.5:5); },
    conocidas(){ const s=new Set(Marcas.todas().map(m=>m.id)); HIST().forEach(h=>s.add(key(h.marca))); return [...s]; },
    sync(){ try{ const a=Marcas.activas().map(m=>m.nombre), cur=App.MARCAS.join("|"); if(a.join("|")!==cur){ App.MARCAS.splice(0,App.MARCAS.length,...a); } }catch(e){} },
    async guardar(m,{alta,dias,activa,nuevo}){ const reg=regCfg().filter(r=>(r.id||key(r.nombre))!==m.id), cfgA=Object.assign({},(App.S.config||{}).alta||{}), cfgM=Object.assign({},(App.S.config||{}).marcas||{});
      cfgM.dias=Object.assign({},cfgM.dias||{}); if(alta!==undefined) cfgA[m.id]=alta; if(dias!==undefined&&dias!==null) cfgM.dias[m.id]=dias;
      reg.push({id:m.id,nombre:m.nombre,activa:activa!==false,creada:m.creada||Date.now()});
      const ok=(await App.Store.set("config","marcasReg",{lista:reg}))&&(await App.Store.set("config","alta",cfgA))&&(await App.Store.set("config","marcas",cfgM)); Marcas.sync(); return ok; }
  };
  App.Marcas=Marcas; Marcas.sync();
  setInterval(Marcas.sync,1500); document.addEventListener("click",()=>setTimeout(Marcas.sync,0),true);

  /* ---------- 2. Datos históricos (Excel real) ---------- */
  let _H=null, _spec=null;
  function cargar(){ if(_H) return; _H=[]; _spec={}; try{ const raw=JSON.parse(document.getElementById("hx-data").textContent); _spec=raw.spec||{};
      _H=raw.ferm.map(r=>{ const pts=[]; if(r.eo!=null) pts.push({h:0,e:r.eo}); (r.m||[]).forEach(p=>{ if(p[0]>0&&p[1]!=null) pts.push({h:p[0],e:p[1],ph:p[2]}); }); pts.sort((a,b)=>a.h-b.h);
        return Object.assign({},r,{hist:true,marca:key(r.marca),pts,finT:r.fin?new Date(r.fin).getTime():null}); }).filter(r=>r.pts.length>=2); }catch(e){ console.warn("hx",e); } }
  const HIST=()=>{ cargar(); return _H; };
  const SPEC=m=>{ cargar(); return _spec[key(m)]||null; };
  function activo(x){ const {t,r}=x, pts=[]; if(r.eo!=null) pts.push({h:0,e:+r.eo}); (r.pts||[]).forEach(p=>{ if(+p.h>0) pts.push({h:+p.h,e:+p.e}); }); pts.sort((a,b)=>a.h-b.h);
    return {hist:false,lote:t.lote,tq:t.tq,marca:key(t.marca),eo:r.eo,finT:r.fin?+parseDT(r.fin):null,pts,x,lev:{n:(t.levadura||{}).nombre,gen:(t.levadura||{}).generacion}}; }
  const ACT=()=>pend().map(activo);
  function interp(p,h){ if(!p.length||h<p[0].h||h>p[p.length-1].h) return null; for(let i=1;i<p.length;i++){ if(h<=p[i].h){ const a=p[i-1],b=p[i]; return b.h===a.h?b.e:a.e+(b.e-a.e)*(h-a.h)/(b.h-a.h); } } return p[p.length-1].e; }
  function cruce(p,A){ if(!p.length||A==null) return null; if(p[0].e<=A) return 0; for(let i=1;i<p.length;i++){ if(p[i].e<=A){ const a=p[i-1],b=p[i]; return a.h+(a.e-A)/(a.e-b.e||1e-9)*(b.h-a.h); } } return null; }
  const GRID=[]; for(let h=0;h<=216;h+=6) GRID.push(h);
  const _band={};
  function banda(marca){ const k=key(marca); if(_band[k]) return _band[k]; const L=HIST().filter(h=>h.marca===k&&h.pts.length>=4);
    const g=GRID.map(h=>{ const v=L.map(c=>interp(c.pts,h)).filter(x=>x!=null); return v.length>=8?{h,n:v.length,p10:pctl(v,.1),p50:pctl(v,.5),p90:pctl(v,.9)}:null; }).filter(Boolean);
    return _band[k]={marca:k,n:L.length,g,ok:L.length>=8&&g.length>=4}; }
  function bandaEn(B,h){ if(!B||!B.ok) return null; const g=B.g; if(h<g[0].h||h>g[g.length-1].h) return null; for(let i=1;i<g.length;i++){ if(h<=g[i].h){ const a=g[i-1],b=g[i],t=(h-a.h)/(b.h-a.h||1); return {p10:a.p10+(b.p10-a.p10)*t,p50:a.p50+(b.p50-a.p50)*t,p90:a.p90+(b.p90-a.p90)*t,n:Math.min(a.n,b.n)}; } } return null; }

  /* gemelo histórico */
  function gemelos(a,k=3){ const P=a.pts.filter(p=>p.h>0); if(P.length<2) return {ok:false,motivo:"Se necesitan al menos 2 muestras medidas."};
    const C0=HIST().filter(h=>h.marca===a.marca&&h.lote!==a.lote&&h.pts.length>=4); if(C0.length<5) return {ok:false,motivo:`Solo hay ${C0.length} fermentaciones históricas de ${tit(a.marca)}; se necesitan al menos 5.`};
    const res=[]; C0.forEach(c=>{ const d=P.map(p=>{ const e=interp(c.pts,p.h); return e==null?null:Math.abs(e-p.e); }).filter(x=>x!=null); if(d.length<Math.max(2,Math.floor(P.length*.6))) return;
      const dist=mean(d)+(a.eo!=null&&c.eo!=null?.3*Math.abs(a.eo-c.eo):0); res.push({c,dist,n:d.length}); });
    res.sort((x,y)=>x.dist-y.dist); if(res.length<3) return {ok:false,motivo:"Ninguna fermentación histórica cubre suficientes puntos comparables."};
    const top=res.slice(0,k).map(r=>Object.assign(r,{nivel:r.dist<.25?"muy parecida":r.dist<.5?"parecida":"algo distinta",misma:a.lev&&a.lev.gen!=null&&r.c.lev&&r.c.lev.gen!=null&&+a.lev.gen===+r.c.lev.gen}));
    return {ok:true,top,todos:res,n:res.length}; }
  /* proyección a la alta desde el histórico (tiempo restante alineado por extracto) */
  function proyHist(a,Aov){ const A=Aov!=null?Aov:App.Alta.de(a.marca); if(A==null) return {ok:false,motivo:"La marca no tiene extracto de alta definido (Configuración → Marcas)."};
    const last=a.pts[a.pts.length-1]; if(!last||a.pts.length<2) return {ok:false,motivo:"Se necesitan al menos 2 muestras."}; if(last.e<=A) return {ok:false,alcanzada:true,motivo:"El extracto ya está en o por debajo de la alta."};
    const g=gemelos(a,12); if(!g.ok) return {ok:false,motivo:g.motivo}; const rem=[];
    g.todos.filter(r=>r.dist<1.2).slice(0,15).forEach(r=>{ const hA=cruce(r.c.pts,A), hE=cruce(r.c.pts,last.e); if(hA!=null&&hE!=null&&hA>=hE) rem.push(hA-hE); });
    if(rem.length<5) return {ok:false,motivo:`Solo ${rem.length} fermentaciones parecidas llegaron a ${A} °P; se necesitan al menos 5.`};
    const base=a.finT+last.h*HOUR, q=p=>base+pctl(rem,p)*HOUR; return {ok:true,A,n:rem.length,t:q(.5),lo:q(.25),hi:q(.75),horas:pctl(rem,.5),base,fuente:`${rem.length} fermentaciones históricas de ${tit(a.marca)} con curva parecida (misma marca, tiempo que tardaron en pasar de ${n1(last.e,2)} a ${A} °P)`}; }
  /* fiabilidad: prueba retrospectiva con fermentaciones pasadas (misma marca, misma etapa de la curva) */
  const _fb={}, TOL=6;
  function fiab(a,metodo,Aov){ const A=Aov!=null?Aov:App.Alta.de(a.marca), last=a.pts[a.pts.length-1]; if(A==null) return {ok:false,motivo:"La marca no tiene extracto de alta definido."}; if(!last||a.pts.length<3) return {ok:false,motivo:"Se necesitan al menos 3 muestras para estimar la fiabilidad."};
    const cut=Math.round(last.h/12)*12, k=[a.marca,cut,A,metodo||"h"].join("|"); if(_fb[k]) return _fb[k];
    const L=HIST().filter(h=>h.marca===a.marca&&h.pts.length>=5&&h.finT), step=Math.max(1,Math.floor(L.length/80)), errs=[]; let cov=0;
    for(let i=0;i<L.length;i+=step){ const c=L[i], tr=c.pts.filter(p=>p.h<=cut+1e-9), act=cruce(c.pts,A); if(tr.length<3||act==null||act<=0||tr[tr.length-1].e<=A) continue; let hp,lo,hi;
      if(metodo==="m"){ const x={t:{marca:c.marca,lote:c.lote},r:{eo:c.eo,pts:tr.filter(p=>p.h>0),fin:new Date(c.finT),el:c.el,atenuacion:null}}; let p; try{ p=App.Alta.proy(x); }catch(e){ continue; } if(!p||p.estado!=="proyectada") continue; hp=(p.t-c.finT)/HOUR; lo=(p.lo-c.finT)/HOUR; hi=(p.hi-c.finT)/HOUR; }
      else{ const py=proyHist({hist:true,lote:c.lote,marca:c.marca,eo:c.eo,pts:tr,finT:c.finT,lev:c.lev},A); if(!py.ok) continue; hp=(py.t-c.finT)/HOUR; lo=(py.lo-c.finT)/HOUR; hi=(py.hi-c.finT)/HOUR; }
      errs.push(hp-act); if(act>=Math.min(lo,hi)&&act<=Math.max(lo,hi)) cov++; }
    const n=errs.length; if(n<10) return _fb[k]={ok:false,motivo:`Solo ${n} pruebas retrospectivas posibles con ${tit(a.marca)} en esta etapa (se necesitan 10).`,n};
    const ae=errs.map(Math.abs), ok=ae.filter(x=>x<=TOL).length, pct=Math.round(100*ok/n);
    return _fb[k]={ok:true,n,pct,mae:pctl(ae,.5),p80:pctl(ae,.8),cob:Math.round(100*cov/n),tol:TOL,sesgo:mean(errs),nivel:pct>=75?"alta":pct>=55?"media":"baja",texto:`En ${n} pruebas con fermentaciones pasadas de ${tit(a.marca)} (a esta misma etapa de la curva), la hora real de alta cayó dentro de ±${TOL} h de la estimada el ${pct} % de las veces; el error típico fue de ±${hh(pctl(ae,.5))}.`}; }
  /* posibles factores asociados (histórico de la marca; no prueban causa) */
  function corr(xs,ys){ const p=xs.map((x,i)=>[x,ys[i]]).filter(q=>q[0]!=null&&q[1]!=null&&isFinite(q[0])&&isFinite(q[1])), n=p.length; if(n<30) return null; const mx=mean(p.map(q=>q[0])), my=mean(p.map(q=>q[1])); let sxy=0,sxx=0,syy=0; p.forEach(([x,y])=>{ sxy+=(x-mx)*(y-my); sxx+=(x-mx)**2; syy+=(y-my)**2; }); return sxx&&syy?{r:sxy/Math.sqrt(sxx*syy),n}:null; }
  function factores(a){ const L=HIST().filter(h=>h.marca===a.marca&&h.h75!=null); if(L.length<30) return {ok:false,motivo:`Solo hay ${L.length} fermentaciones históricas de ${tit(a.marca)} con horas al 75 %; se necesitan 30 para buscar factores.`};
    const lv=(a.x&&a.x.t&&a.x.t.levadura)||{}, F=[["Generación de la levadura",h=>h.lev&&h.lev.gen,a.lev&&a.lev.gen,""],["Viabilidad de la levadura",h=>h.lev&&h.lev.viab!=null?h.lev.viab*100:null,lv.viab!=null?lv.viab*100:null," %"],["Consistencia de la levadura",h=>h.lev&&h.lev.cons,lv.cons!=null?lv.cons:null,""],["E.O del mosto",h=>h.eo,a.eo," °P"]], out=[], ys=L.map(h=>h.h75);
    F.forEach(([nom,get,v,u])=>{ if(v==null) return; const xs=L.map(get), c=corr(xs,ys); if(!c||Math.abs(c.r)<.2) return; const d=xs.filter(x=>x!=null), rank=d.filter(x=>x<=v).length/d.length*100; if(rank>=75||rank<=25){ const alto=rank>=75, retrasa=(c.r>0)===alto; out.push({nom,v,u,rank:Math.round(rank),r:c.r,n:c.n,med:pctl(d,.5),efecto:retrasa?"tiende a retrasar la fermentación":"tiende a adelantar la fermentación",retrasa,peso:Math.abs(c.r)*Math.abs(rank-50)}); } });
    out.sort((x,y)=>y.peso-x.peso); return {ok:true,list:out,n:L.length}; }
  /* anomalías */
  function anomalias(a){ const B=banda(a.marca), out=[]; if(!B.ok) return {ok:false,motivo:`Solo hay ${B.n} fermentaciones históricas de ${tit(a.marca)} con curva; se necesitan al menos 8.`,list:[]};
    a.pts.filter(p=>p.h>=12).forEach(p=>{ const b=bandaEn(B,p.h); if(!b) return; if(p.e>b.p90+.1) out.push({h:p.h,e:p.e,tipo:"lento",dif:p.e-b.p50,b}); else if(p.e<b.p10-.1) out.push({h:p.h,e:p.e,tipo:"rapido",dif:p.e-b.p50,b}); });
    const last=a.pts[a.pts.length-1], hSin=a.finT?(Date.now()-(a.finT+last.h*HOUR))/HOUR:null; return {ok:true,list:out,hSin,B}; }
  /* índice de normalidad explicable */
  function indice(a){ const B=banda(a.marca), P=a.pts.filter(p=>p.h>0); if(!B.ok||P.length<3) return {ok:false,motivo:!B.ok?`Solo hay ${B.n} fermentaciones históricas de ${tit(a.marca)} con curva; se necesitan al menos 8.`:"Se necesitan al menos 3 muestras medidas."};
    const an=anomalias(a), dev=mean(P.filter(p=>p.h>=12).map(p=>{ const b=bandaEn(B,p.h); return b?Math.abs(p.e-b.p50):null; })), fac=[]; let s=100;
    if(dev!=null){ const pn=Math.min(40,dev*25); s-=pn; fac.push({t:"Distancia a la curva típica",p:-Math.round(pn),x:`Las muestras se alejan en promedio ${n1(dev,2)} °P de la mediana histórica de ${tit(a.marca)}.`}); }
    const fu=an.list.length; if(fu){ const pn=Math.min(30,fu*10); s-=pn; fac.push({t:"Muestras fuera de lo habitual",p:-pn,x:`${fu} ${fu===1?"muestra queda":"muestras quedan"} fuera de la banda P10–P90 del histórico.`}); }
    const sp=SPEC(a.marca); if(sp&&sp.eo&&a.eo!=null&&(a.eo>sp.eo.sup||a.eo<sp.eo.inf)){ s-=10; fac.push({t:"E.O fuera de especificación",p:-10,x:`E.O ${n1(a.eo,2)} °P; la especificación va de ${sp.eo.inf} a ${sp.eo.sup}.`}); }
    if(an.hSin!=null&&an.hSin>24){ s-=10; fac.push({t:"Hace tiempo sin muestra",p:-10,x:`La última muestra tiene ${hh(an.hSin)}.`}); }
    if(!fac.length) fac.push({t:"Sin desviaciones",p:0,x:"Todas las muestras están dentro de la banda histórica."});
    s=Math.max(0,Math.round(s)); return {ok:true,v:s,nivel:s>=85?"Dentro de lo habitual":s>=65?"Dentro de lo habitual, con matices":"Fuera de lo habitual",tono:s>=85?"ok":s>=65?"warn":"crit",fac,n:B.n,conf:P.length>=5&&B.n>=20?"alta":P.length>=4?"media":"baja"}; }
  /* estadísticas por marca (solo datos reales) */
  const _st={};
  function stats(marca){ const k=key(marca); if(_st[k]) return _st[k]; const L=HIST().filter(h=>h.marca===k), A=App.Alta.de(k), cr=A!=null?L.map(h=>cruce(h.pts,A)).filter(x=>x!=null&&x>0):[];
    return _st[k]={marca:k,n:L.length,eo:mean(L.map(h=>h.eo)),e72:med(L.map(h=>h.e72)),h15:med(L.map(h=>h.h15)),h75:med(L.map(h=>h.h75)),rata:med(L.map(h=>h.rata)),vol:med(L.map(h=>h.vol)),
      A,tA:cr.length>=5?{n:cr.length,p25:pctl(cr,.25),p50:pctl(cr,.5),p75:pctl(cr,.75)}:null,alc:mean(L.map(h=>h.fq&&h.fq.alc)),rdf:mean(L.map(h=>h.fq&&h.fq.rdf)),viab:mean(L.map(h=>h.lev&&h.lev.viab)),
      desde:L.length?Math.min(...L.map(h=>h.finT||Infinity)):null,hasta:L.length?Math.max(...L.map(h=>h.finT||0)):null}; }
  /* familias de levadura */
  const famDe=n=>{ const p=n&&App.Calc.parseLev?App.Calc.parseLev(n):null; return p&&p.fam?String(p.fam).toUpperCase():null; };
  function statsFam(fam){ const L=HIST().filter(h=>h.lev&&famDe(h.lev.n)===fam); return {fam,n:L.length,e72:med(L.map(h=>h.e72)),h15:med(L.map(h=>h.h15)),h75:med(L.map(h=>h.h75)),rata:med(L.map(h=>h.rata)),viab:mean(L.map(h=>h.lev&&h.lev.viab)),cons:mean(L.map(h=>h.lev&&h.lev.cons)),marcas:[...new Set(L.map(h=>h.marca))],ahora:ACT().filter(a=>famDe(a.lev.n)===fam).length}; }
  const famsHist=()=>[...new Set(HIST().map(h=>h.lev&&famDe(h.lev.n)).filter(Boolean))].sort();
  /* insights del sistema */
  function insights(){ const out=[], A=ACT();
    A.forEach(a=>{ const an=anomalias(a); if(an.ok&&an.list.length){ const u=an.list[an.list.length-1], rec=an.list.filter(x=>x.h>=a.pts[a.pts.length-1].h-24).length; if(rec) out.push({sev:2,ic:"!",t:`FV ${a.tq} va ${u.tipo==="lento"?"más lento":"más rápido"} de lo habitual`,x:`A las ${hh(u.h)} tiene ${n1(u.e,2)} °P y el histórico de ${tit(a.marca)} marca ${n1(u.b.p10,2)}–${n1(u.b.p90,2)} °P (P10–P90).`,go:"analista/monitor"}); }
      const py=proyHist(a); if(py.ok&&py.t>Date.now()&&py.t<Date.now()+14*HOUR) out.push({sev:1,ic:"◷",t:`FV ${a.tq} podría llegar a la alta pronto`,x:`Según ${py.n} fermentaciones parecidas, lo más probable es ${fmtS(py.lo)}–${fmtS(py.hi)}.`,go:"tanque/"+a.lote});
      if(an.ok&&an.hSin>24) out.push({sev:1,ic:"✎",t:`FV ${a.tq} lleva ${hh(an.hSin)} sin muestra`,x:"Una muestra nueva afina la proyección y el índice de normalidad.",go:"tanque/"+a.lote}); });
    Marcas.activas().forEach(m=>{ const L=HIST().filter(h=>h.marca===m.id&&h.finT&&h.rata!=null).sort((a,b)=>b.finT-a.finT); if(L.length>=20){ const r=med(L.slice(0,10).map(h=>h.rata)), p=med(L.slice(10).map(h=>h.rata)); if(r!=null&&p!=null&&Math.abs(r-p)/p>.08) out.push({sev:0,ic:"↗",t:`${tit(m.nombre)}: la rata de fermentación ${r>p?"subió":"bajó"}`,x:`Mediana de las últimas 10 fermentaciones: ${n1(r,1)} vs ${n1(p,1)} del resto (${L.length-10}).`,go:"historico/"+encodeURIComponent(m.id)}); } });
    return out.sort((a,b)=>b.sev-a.sev); }
  App.Hist2={factores,fiab,hist:HIST,activos:ACT,banda,gemelos,proyHist,anomalias,indice,stats,statsFam,insights,spec:SPEC,cruce,interp,key};

  /* ---------- 3. Gráfico con propósito ---------- */
  function chartSvg(o){ const W=o.w||640, H=o.h||260, L=40, R=14, T=14, B=26, S=o.series||[], bands=o.band; let xm=o.xmax||0, ys=[];

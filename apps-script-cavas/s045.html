<script>
(function(){
 const {esc,clone,parseDT,fmtS,toast}=App.U,n=App.FVRegistration.num,H=3600000;
 const fmt=x=>x==null?'—':new Intl.NumberFormat('es-CO',{maximumFractionDigits:2}).format(x),date=x=>x?fmtS(new Date(x)):'Pendiente';
 function maturityPanel(r){const m=App.PlatformRules.maturity(r),ready=m.due&&Date.now()>=m.due;return `<section class="fv-detail-section" id="turn-maturity"><div class="sec-h"><h2>Tiempo de maduración</h2><span class="turn-pill ${ready?'green':'yellow'}">${m.minimum==null?'Sin regla de marca':ready?'Mínimo cumplido':'En maduración'}</span></div><div class="fv-metrics"><div class="fv-metric"><span>Tiempo en SV</span><b>${fmt(m.elapsed)} h</b><small>${fmt(m.elapsed/24)} días desde fin de llenado</small></div><div class="fv-metric"><span>Mínimo de ${esc(r.brand)}</span><b>${fmt(m.minimum)} h</b><small>${date(m.due)}</small></div><div class="fv-metric"><span>Tiempo objetivo</span><b>${fmt(m.target)} h</b><small>${date(m.goal)}</small></div></div><p class="fv-helper">La filtración antes del mínimo requiere registrar un motivo en la liquidación.</p></section>`;}
 const sv=App.V.sv;App.V.sv=Object.assign({},sv,{render(action,tq){let html=sv.render(action,tq);if(action!=='detalle')return html;const r=App.Cavas.records().find(x=>x.tq===+tq&&x.operation==='M');if(!r)return html;const key='svFollow_'+encodeURIComponent(App.TankPurges.identity(r)),s=App.S.config[key]||{},rows=[...(r.maturation?.maturationSamples||[]),...(s.samples||[])].sort((a,b)=>+parseDT(b.t)-+parseDT(a.t));const panel=`<section class="fv-detail-section" id="sv-follow"><div class="sec-h"><div><h2>Seguimiento de maduración</h2><p class="fv-helper">Temperatura y presión registradas durante cada turno.</p></div>${App.Store.canWrite?'<button class="btn pri" id="svAddFollow">＋ Registrar seguimiento</button>':''}</div>${rows.length?`<table class="fv-progress-table"><thead><tr><th>Fecha y hora</th><th>Temperatura °C</th><th>Presión</th><th>Comentario</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${date(x.t)}</td><td>${fmt(x.temperature)}</td><td>${fmt(x.pressure)}</td><td>${esc(x.comment||'')}</td></tr>`).join('')}</tbody></table>`:'<p>Registra la primera medición del turno.</p>'}</section>`;html=html.replace(/<section class="fv-detail-section"><h2>Seguimiento de maduración<\/h2>[\s\S]*?<\/section>/,panel);return html.replace('</header>','</header>'+maturityPanel(r));},mount(action,tq){sv.mount?.(action,tq);document.getElementById('svAddFollow')?.addEventListener('click',async()=>{const r=App.Cavas.records().find(x=>x.tq===+tq),key='svFollow_'+encodeURIComponent(App.TankPurges.identity(r)),s=clone(App.S.config[key]||{samples:[]});const d=await App.UI.form({title:'Seguimiento · SV '+tq,fields:[{k:'t',l:'Fecha y hora',t:'dt',req:true},{k:'temperature',l:'Temperatura (°C)',t:'n'},{k:'pressure',l:'Presión',t:'n'},{k:'comment',l:'Comentario',t:'t'}],values:{t:App.U.toIn(new Date())},validate:v=>v.temperature==null&&v.pressure==null?'Registra temperatura o presión.':v.pressure!=null&&v.pressure<0?'La presión no puede ser negativa.':null});if(!d)return;s.samples=s.samples||[];s.samples.push(d);if(await App.Store.set('config',key,s))App.render(true);});}});
 // El histórico pertenece al detalle de FV; las rutas anteriores conservan acceso al tanque actual.
 const fv=App.V.fv;App.V.fv=Object.assign({},fv,{render(action,tq){let h=fv.render(action,tq);if(action!=='detalle')return h;const r=App.Cavas.records().find(x=>x.tq===+tq&&x.operation==='F');if(r&&App.V35?.bloqueTanque){const block=App.V35.bloqueTanque(r.consecutive);if(block)h+=`<details class="fv-detail-section"><summary>Actual vs histórico · comparación del FV</summary>${block}</details>`;}return h;}});
 const oldTank=App.V.tanque;App.V.tanque=Object.assign({},oldTank,{render(lote,...args){const r=App.Cavas.records().find(x=>x.operation==='F'&&x.consecutive===lote);return r?App.V.fv.render('detalle',r.tq):oldTank.render(lote,...args);},mount(lote,...args){const r=App.Cavas.records().find(x=>x.operation==='F'&&x.consecutive===lote);return r?App.V.fv.mount('detalle',r.tq):oldTank.mount?.(lote,...args);}});
 // Base fuente separada por proceso, con fichas y exportación completa.
 const types=[['fermentations','B.D FERMENTACIÓN','Fermentación'],['maturations','B.D MADURACIÓN','Maduración'],['yeasts','B.D LEVADURA','Levadura']];let dbType='fermentations',dbMode='cards',query='',page=0,lastDbRoute=null,dbFull=false;
 const source=()=>App.ExcelCavas.data()[dbType]||[],filtered=()=>source().filter(x=>!query||Object.values(x.cells||x).join(' ').toLowerCase().includes(query.toLowerCase()));
 function headers(type){const name=types.find(x=>x[0]===type)[1],schema=App.ExcelCavas.data().schemas[name]||[];const last=Math.max(0,...schema.map(x=>x.length),...App.ExcelCavas.data()[type].map(x=>Math.max(0,...Object.keys(x.cells).map(Number))+1));return Array.from({length:last},(_,i)=>[...new Set(schema.map(row=>row[i]).filter(v=>v!=null&&String(v).trim()))].join(' · ')||'Columna '+(i+1));}
 function exportDB(all){const chosen=all?types:types.filter(x=>x[0]===dbType),sheets=chosen.map(([key,name])=>{const hs=headers(key);return {nombre:name,titulo:name,sub:'Datos fuente del Excel · campos y valores conservados',cols:hs.map(h=>({h,t:'s'})),rows:App.ExcelCavas.data()[key].map(r=>hs.map((_,i)=>r.cells[i]??null))};});const inventory=App.ExcelCavas.inventory(),captures=[];for(const r of inventory.records||[])if(r.manualUpdatedAt)captures.push([r.operation,r.consecutive,r.tq,r.manualUpdatedAt,JSON.stringify(r)]);for(const ev of inventory.operationEvents||[])captures.push(['Operación',ev.kind||'',ev.tq||'',ev.t||ev.end||'',JSON.stringify(ev)]);for(const [key,value]of Object.entries(App.S.config||{}))if(/^(tankLab_|tankPurge_|tankTurn_|svFollow_)/.test(key))captures.push(['Captura',key,'','',JSON.stringify(value)]);sheets.push({nombre:'Capturas plataforma',titulo:'Registros complementarios',sub:'Cambios y movimientos registrados en este navegador',cols:['Tipo','Identificador','Tanque','Actualización','Datos completos'].map(h=>({h,t:'s'})),rows:captures});App.V35.excel(all?'Bases_Control_Cavas.xlsx':types.find(x=>x[0]===dbType)[1]+'.xlsx',sheets);}
 function dbRows(){const rows=filtered(),hs=headers(dbType),chunk=rows.slice(page*24,page*24+24),main=dbType==='fermentations'?[1,2,3,52,55,61,65,67,68,689]:dbType==='maturations'?[1,2,3,51,53,57,364,416,447,452]:[1,2,3,4,5,7,8,18,21,27,28],display=dbFull?hs.map((_,i)=>i):main;return `<div class="sec-h"><span>${rows.length} registros · página ${page+1} de ${Math.max(1,Math.ceil(rows.length/24))}</span><div><button class="btn sm" id="dbPrev" ${page?'':'disabled'}>Anterior</button><button class="btn sm" id="dbNext" ${(page+1)*24>=rows.length?'disabled':''}>Siguiente</button></div></div>${dbMode==='cards'?`<div class="db-card-grid">${chunk.map((r,i)=>`<button class="db-record" data-db-record="${page*24+i}"><small>${esc(r.marca||'')} · ${esc(r.source?.sheet||types.find(x=>x[0]===dbType)[1])}</small><h3>${esc(r.lote||r.nombre||r.cells[1]||'Registro')}</h3><span>Tanque ${esc(r.tq??'—')}</span><p>${date(r.fin||r.finRemocion||r.retiro)} · ${fmt(r.vol)} Hl</p><b>Ver ficha →</b></button>`).join('')}</div>`:`<div class="fv-table-scroll"><table class="fv-progress-table"><thead><tr>${display.map(i=>`<th>${esc(hs[i])}</th>`).join('')}</tr></thead><tbody>${chunk.map(r=>`<tr>${display.map(i=>`<td>${esc(App.OperationSources?App.OperationSources.cellText(r.cells[i],hs[i]):r.cells[i]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}`;}
 const dbMount=()=>{document.querySelectorAll('[data-db-type]').forEach(b=>b.onclick=()=>{dbType=b.dataset.dbType;page=0;App.render(true);});document.querySelectorAll('[data-db-mode]').forEach(b=>b.onclick=()=>{dbMode=b.dataset.dbMode;App.render(true);});document.getElementById('dbSearch').onchange=e=>{query=e.target.value;page=0;App.render(true);};document.getElementById('dbPrev').onclick=()=>{page--;App.render(true);};document.getElementById('dbNext').onclick=()=>{page++;App.render(true);};document.getElementById('dbFields')?.addEventListener('click',()=>{dbFull=!dbFull;dbMode='table';App.render(true);});document.getElementById('dbDownload').onclick=()=>exportDB(false);document.getElementById('dbAll').onclick=()=>exportDB(true);document.querySelectorAll('[data-db-record]').forEach(b=>b.onclick=()=>{const r=filtered()[+b.dataset.dbRecord],hs=headers(dbType);App.UI.info('Ficha · '+(r.lote||r.nombre||'Registro'),`<dl class="db-facts">${hs.map((h,i)=>r.cells[i]==null?'':`<div><dt>${esc(h)}</dt><dd>${esc(App.OperationSources?App.OperationSources.cellText(r.cells[i],h):r.cells[i])}</dd></div>`).join('')}</dl>`,{wide:true});});};
 App.V.bd={render(type){if(type!==lastDbRoute&&types.some(x=>x[0]===type)){dbType=type;page=0;}lastDbRoute=type;return `<div><header class="page-h"><div><h1>Base de datos</h1><p>Tu historial, ordenado para encontrar respuestas.</p></div><button class="btn" id="dbAll">Descargar las tres bases</button></header><div class="db-overview">${types.map(([k,name,label])=>`<article><span>${label}</span><b>${App.ExcelCavas.data()[k].length}</b><small>registros fuente · ${name}</small></article>`).join('')}</div><nav class="db-tabs">${types.map(([k,_,label])=>`<button class="btn ${k===dbType?'pri':''}" data-db-type="${k}">${label}</button>`).join('')}</nav><section class="fv-detail-section"><div class="sec-h"><input id="dbSearch" placeholder="Buscar en esta base" value="${esc(query)}"><div><button class="btn" data-db-mode="cards">Fichas</button><button class="btn" data-db-mode="table">Tabla</button><button class="btn" id="dbFields">${dbFull?'Campos principales':'Todos los campos del Excel'}</button><button class="btn" id="dbDownload">Descargar Excel</button></div></div>${dbRows()}</section></div>`;},mount:dbMount};
 function alerts(){return App.Cavas.records().filter(r=>r.operation).flatMap(r=>App.TankOperations.tasks(r).filter(t=>['red','yellow'].includes(t.color)).map(t=>Object.assign({},t,{r}))).sort((a,b)=>a.rank-b.rank);}
 function alertCards(limit=999){return alerts().slice(0,limit).map(t=>`<a class="overview-alert ${t.color}" href="#/${t.r.operation==='F'?'fv':'sv'}/detalle/${t.r.tq}"><span class="turn-pill ${t.color}">${t.r.operation==='F'?'FV':'SV'} ${t.r.tq}</span><div><b>${esc(t.label)}</b><small>${esc(t.r.consecutive)} · ${esc(t.help)}</small></div><span>→</span></a>`).join('')||'<p>No hay tareas vencidas en los tanques.</p>';}
 App.V.inicio={render(){const rs=App.Cavas.records(),count=op=>rs.filter(r=>r.operation===op).length;return `<header class="page-h"><div><h1>Inicio</h1><p>Lo que necesita atención durante tu turno.</p></div><a class="btn pri" href="#/tanques">Abrir tanques</a></header><div class="fv-metrics">${[['Fermentación',count('F')],['Maduración',count('M')],['Disponibles',count(null)],['Tareas por atender',alerts().length]].map(([l,v])=>`<div class="fv-metric"><span>${l}</span><b>${v}</b></div>`).join('')}</div><section class="fv-detail-section"><div class="sec-h"><h2>Prioridades del turno</h2><a class="btn" href="#/alertas">Ver todas</a></div>${alertCards(8)}</section><section class="fv-detail-section"><h2>Acciones frecuentes</h2><div class="row"><a class="btn" href="#/fv/registro">Registrar FV</a><a class="btn" href="#/levaduras">Colectores y cosechas</a><a class="btn" href="#/tanques/maduradores">Maduración y filtración</a><a class="btn" href="#/bd">Bases de datos</a></div></section>`;},mount(){}};
 App.V.alertas={render(){return `<header class="page-h"><div><h1>Alertas</h1><p>Tareas agrupadas por urgencia y tanque.</p></div></header><section class="fv-detail-section">${alertCards()}</section><section class="fv-detail-section"><h2>Resiembra en colectores</h2>${[1,2,3,4,5,6].flatMap(App.CollectorFlow.occupied).filter(x=>['red','yellow'].includes(App.CollectorFlow.timing(x.c).color)).map(x=>`<a class="overview-alert" href="#/levaduras"><b>${esc(x.pos.toUpperCase())} · ${esc(x.c.nombre)}</b><span>${App.CollectorFlow.timing(x.c).label}</span></a>`).join('')||'<p>Sin alertas de resiembra con límite registrado.</p>'}</section>`;},mount(){}};
 App.V.pantalla={render(){return `<header class="page-h"><div><h1>Pantalla de planta</h1><p>Estado operativo de los 32 tanques.</p></div><button class="btn" id="plantFullscreen">Pantalla completa</button></header><div class="plant-tanks">${App.Cavas.records().map(r=>`<a class="plant-tank" href="#/${r.operation==='F'?'fv/detalle/':r.operation==='M'?'sv/detalle/':'tanques/todos'}${r.operation?r.tq:''}"><span>UTQ ${r.tq}</span><h2>${esc(r.consecutive||'Libre')}</h2><small>${esc(r.brand||'Disponible FV / SV')}</small>${App.TankOperations.card(r)}</a>`).join('')}</div>`;},mount(){document.getElementById('plantFullscreen').onclick=()=>document.documentElement.requestFullscreen?.();}};
 function topbar(){for(const [id,route,label]of [['v31Bell','alertas','Alertas'],['v31Tv','pantalla','Pantalla de planta']]){const b=document.getElementById(id);if(b&&!b.dataset.platformLinked){const c=b.cloneNode(true);b.replaceWith(c);c.dataset.platformLinked='true';c.title=label;c.onclick=e=>{e.preventDefault();e.stopPropagation();document.getElementById('v31Pop')?.remove();App.go(route);};}}const box=document.querySelector('.topbar .gsearch .box'),input=box?.querySelector('input');if(box&&input){box.classList.add('minimal-search');box.title='Buscar';box.onclick=()=>input.focus();input.setAttribute('aria-label','Buscar en Control de Cavas');}}
 document.addEventListener('click',()=>setTimeout(topbar,0));setTimeout(topbar,300);setInterval(topbar,60000);App.PlatformFinish={alerts,exportDB,maturityPanel,events:()=>alerts().map(t=>({key:t.r.consecutive+':'+t.section+':'+t.label,at:+parseDT(t.r.fill),title:(t.r.operation==='F'?'FV ':'SV ')+t.r.tq+' · '+t.label,sub:t.help,sev:t.color==='red'?'crit':'warn',go:(t.r.operation==='F'?'fv':'sv')+'/detalle/'+t.r.tq,o:t.rank}))};
})();

</script>

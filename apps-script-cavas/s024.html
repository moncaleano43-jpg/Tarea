<script>

/* ============================================================
   v34 — Cifra "cerebro": responde con tarjetas fáciles de leer,
   cubre casi cualquier pregunta sobre tanques, colectores, levadura,
   historial y análisis, y envía lo largo a páginas de detalle.
   ============================================================ */
(function(){
  if(!window.App||!App.V31||!App.BotDirecto||!App.Alta||!App.BDM) return;
  const {esc,fmtS,f,parseDT,HOUR}=App.U, C=App.C, V=App.V31, AL=App.Alta, BDM=App.BDM, LS=V.LS;
  const prevDirecto=App.BotDirecto;
  const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
  const rel=(t,n)=>C.rel(t,n||Date.now());
  const tit=V.tit, hl=V.hl, pct=V.pct;
  const plural=(n,s,p)=>n===1?s:p;
  const lst=a=>a.length<=1?a.join(""):a.slice(0,-1).join(", ")+" y "+a[a.length-1];
  const parse=n=>{ try{ return BDM.parseNombre(n)||{}; }catch(e){ return {}; } };
  const MARCA_PAL={estandar:"ESTANDAR",light:"LIGHT",azteca:"AZTECA",aguila:"AGUILA",pilsen:"PILSEN","club colombia":"CLUB COLOMBIA",club:"CLUB COLOMBIA"};
  const RE_MARCA=/\b(estandar|light|azteca|aguila|pilsen|club colombia|club)\b/g;
  const TONE={rojo:"crit",naranja:"warn",verde:"ok",amarillo:"warn",gris:"idle",sin:"idle"};
  const ST_TXT={rojo:"Retiro vencido",naranja:"Retiro próximo",verde:"Lista para retirar",amarillo:"T0 se aproxima",gris:"En proceso",sin:"Sin T0 todavía"};
  const ST_FILTRO={rojo:"pendiente",naranja:"proximo",verde:"lista",amarillo:"t0",gris:"proceso",sin:"proceso"};

  /* ---------- 1. Lenguaje: tolerancia a errores ---------- */
  const KEEP="cuanto cuanta cuantas descarto siembro registro agrego libero retiro cambio exporto importo historica historico historicas historicos siembras sembrada sembrado descartar sembrar liberar registrar agregar utilizo utilizar utilizaron utilizaste retirar cosechar cosecho cosechas".split(" ");
  const VOC=("vencidos vencidas vencido atrasados retiro retiros retirar cosecha cosechas tanque tanques fermentador fermentadores levadura levaduras familia familias generacion generaciones colector colectores extracto atenuacion viabilidad consistencia volumen historial resumen proyeccion disponible disponibles descartada descartadas descartado utilizada utilizadas muestra muestras sembrar siembra siembras posicion posiciones prioridad cuantos cuantas cuales promedio comparar cantidad ultimo ultima ultimos proximo proxima ritmo velocidad estado marca lote alta manana ayer semana mayor menor mejor peor lento rapido ocupados libres vacios tiempo limite espacio capacidad").split(" ");
  function dist(a,b){ const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 9; let p=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
  function canon(q){ return q.split(" ").map(t=>{ if(t.length<7||/\d/.test(t)||VOC.includes(t)||KEEP.includes(t)) return t; let best=t,bd=9; for(const v of VOC){ if(v[0]!==t[0]||v.slice(0,2)!==t.slice(0,2)) continue; const d=dist(t,v); if(d<bd){ bd=d; best=v; } } return bd<=(t.length>=10?2:1)?best:t; }).join(" "); }
  const fix=t=>String(t||"").replace(/\bfam[a-z]{1,3}lia\b|\bfamlia\b|\bfamila\b/gi,"familia").replace(/\b(?:g|j)ener[a-z]{2,5}n(es)?\b/gi,m=>/es$/i.test(m)?"generaciones":"generacion").replace(/\bhl\b/gi,"hl");
  const Q=t=>canon(V.norm(fix(t)));
  const has=(q,re)=>re.test(q);
  const nums=s=>(s.match(/\d{1,2}/g)||[]).map(Number);

  /* ---------- 2. Entidades ---------- */
  function ents(q,env,mem){ const e={fvs:[],cols:[],pos:[],levs:[],fam:null,gens:[],marcas:[],lotes:[]}; let m;
    const reFv=/\b(?:fv|tanques?|tq|fermentador(?:es)?)\s*((?:0?\d{1,2}\s*(?:,|y|e|con|vs|contra|o)?\s*)+)/g;
    while((m=reFv.exec(q))) nums(m[1]).forEach(n=>{ if(n>=1&&n<=32&&!e.fvs.includes(n)) e.fvs.push(n); });
    const compact=q.match(/\bfv(\d{1,2})\b/g); if(compact) compact.forEach(x=>{ const n=+x.slice(2); if(n>=1&&n<=32&&!e.fvs.includes(n)) e.fvs.push(n); });
    if(!e.fvs.length){ const b=q.match(/\b(?:el|del|al|los|las|ese|este)\s+(\d{1,2})(?:\s*(?:,|y|con|vs|contra)\s*(\d{1,2}))?\b(?!\s*(?:h\b|hl|%|d\b|dias|horas|gen|p\b))/); if(b) [b[1],b[2]].filter(Boolean).forEach(n=>{ if(+n>=1&&+n<=32) e.fvs.push(+n); }); }
    const reLote=/\bf(\d{3})\b/g; while((m=reLote.exec(q))) e.lotes.push("F"+m[1]);
    const reCol=/\bcolector(?:es)?\s*((?:[1-6]\s*(?:,|y|e|vs|contra)?\s*)+)/g; while((m=reCol.exec(q))) nums(m[1]).forEach(n=>{ if(n>=1&&n<=6&&!e.cols.includes(n)) e.cols.push(n); });
    const rePos=/\bc\s?([1-6])\s*-?\s*p\s?([12])\b/g; while((m=rePos.exec(q))){ e.pos.push([+m[1],+m[2]]); if(!e.cols.includes(+m[1])) e.cols.push(+m[1]); }
    const reC=/\bc\s?([1-6])\b/g; while((m=reC.exec(q))) if(!e.cols.includes(+m[1])) e.cols.push(+m[1]);
    const reL=/\b([a-z]{1,2}\d{1,2}f\d{1,3})\b/g; while((m=reL.exec(q))) e.levs.push(m[1].toUpperCase());
    const mf=q.match(/\b(?:familias?|linea)\s+(?:de\s+)?(?:la\s+)?([a-z])\b(?!\w)/); if(mf) e.fam=mf[1].toUpperCase();
    const reG=/\b(?:gen|generacion(?:es)?)\s*((?:\d{1,2}\s*(?:,|y|e|a)?\s*)+)/g; while((m=reG.exec(q))) nums(m[1]).forEach(n=>{ if(!e.gens.includes(n)) e.gens.push(n); });
    RE_MARCA.lastIndex=0; while((m=RE_MARCA.exec(q))){ const k=MARCA_PAL[m[1]]; if(k&&!e.marcas.includes(k)) e.marcas.push(k); }
    return e; }

  /* ---------- 3. Datos ---------- */
  function datos(){ const now=Date.now(), P=App.D.pend(now).map(x=>{ const L=x.t.levadura||{}, pn=parse(L.nombre);
      return Object.assign({},x,{tq:+x.t.tq,lote:x.t.lote,marca:x.t.marca,lev:L.nombre,gen:L.generacion!=null?+L.generacion:null,fam:pn.fam,mk:pn.marca||x.t.marca,pr:AL.proy(x),nx:C.siguiente(x.r,x.st,now),L}); });
    const POS=[]; [1,2,3,4,5,6].forEach(n=>[1,2].forEach(s=>{ const c=App.S.colectores[`c${n}-${s}`]; const id=`C${n}-P${s}`; if(!c){ POS.push({n,s,id,libre:true,tone:"idle"}); return; } const tc=App.T.tiempoColector(c,now)||{}, pn=parse(c.nombre);
      POS.push({n,s,id,c,nombre:c.nombre,gen:c.generacion!=null?+c.generacion:null,fam:pn.fam,mk:pn.marca||c.marca,vol:c.vol,viab:c.viab,cons:c.cons,ph:c.ph,tc,mr:tc.mr?+tc.mr:null,k:tc.k,tone:{rojo:"crit",naranja:"warn",verde:"ok"}[tc.k]||"idle"}); }));
    const REG=(BDM.registros()||[]).filter(r=>r.nombre&&r.estadoRegistro!=="anulado");
    return {now,P,POS,OC:POS.filter(p=>!p.libre),REG,lotes:new Set(P.map(x=>x.lote))}; }
  const byTq=(D,n)=>D.P.find(x=>x.tq===+n);
  const estadoTxt=st=>({utilizada:"ya utilizada",inventario:"disponible en colector",vaciada:"vaciada sin resiembra",descartada:"descartada",incompleto:"registro incompleto",sincol:"sin colector"}[st]||st);
  const padre=(D,r)=>D.REG.find(p=>p.id!==r.id&&(p.siembras||[]).some(s=>s.lote===r.lote));

  /* ---------- 4. Piezas visuales ---------- */
  const fvc=(o,extra)=>`<a class="fvc ${TONE[o.st.k]||"idle"}" href="#/tanque/${esc(o.lote)}">FV ${o.tq}${extra?` <small>${extra}</small>`:""}</a>`;
  const fvPlain=n=>`<span class="fvc idle">FV ${n}</span>`;
  const posc=p=>`<a class="fvc ${p.tone}" href="#/colectores/${p.n}">${p.id}${p.nombre?` <small>${esc(p.nombre)}</small>`:""}</a>`;
  const pill=(t,tone)=>`<span class="pl ${tone||""}">${esc(t)}</span>`;
  const row=(l,h)=>`<div class="ans-r"><em>${esc(l)}</em><span>${h}</span></div>`;
  const kp=(arr)=>`<div class="ans-k">${arr.map(([v,l,t])=>`<div class="${t||""}"><b>${v}</b><span>${esc(l)}</span></div>`).join("")}</div>`;
  function ans(o){ return `<div class="ans">${o.h?`<div class="ans-h">${o.h}</div>`:""}${o.s?`<div class="ans-s">${o.s}</div>`:""}${o.k?kp(o.k):""}${(o.rows||[]).filter(Boolean).join("")}${o.note?`<div class="ans-n">${o.note}</div>`:""}${o.ver?`<a class="ans-ver" href="${o.ver[0]}"${o.ver[2]?` data-an="${o.ver[2]}"`:""}>${esc(o.ver[1])} ›</a>`:""}${o.btn?`<div class="ans-b">${o.btn.map(([l,a])=>`<button type="button" class="ans-btn" data-v34="${esc(a)}">${esc(l)}</button>`).join("")}</div>`:""}</div>`; }
  const out=(o,opts,mem)=>({h:ans(o),opts:(opts||[]).map(q=>typeof q==="string"?{label:q,q}:q),mem,directo:true});
  const chips=a=>a.length?`<span class="cps">${a.join("")}</span>`:"";
  const conMas=(a,max,link)=>a.slice(0,max).join("")+(a.length>max?`<span class="more">y ${a.length-max} más${link?` · <a href="${link}">ver todos</a>`:""}</span>`:"");

  /* ---------- 5. Respuestas sobre UN tanque (FV) ---------- */
  function fvFicha(D,o){ const {r}=o, L=o.L, now=D.now, p=o.pr;
    return out({h:`FV ${o.tq} · ${esc(tit(o.marca))}`,s:`Lote ${esc(o.lote)} · ${pill(ST_TXT[o.st.k]||o.st.txt,TONE[o.st.k])}`,
      k:[[r.ext!=null?f(r.ext,2):"—","Extracto °P"],[r.atenuacion!=null?Math.round(r.atenuacion*100)+"%":"—","Atenuación"],[p.estado==="alcanzada"?"En alta":p.estado==="proyectada"?fmtS(p.t).slice(0,5):"—","Alta"]],
      rows:[ r.t0?row("T0",`${fmtS(r.t0)} <small>${rel(r.t0,now)}</small>`):row("T0","todavía sin calcular"), r.venc&&["rojo","naranja","verde"].includes(o.st.k)?row("Máximo",`${fmtS(r.venc)} <small>${rel(r.venc,now)}</small>`):null,
        L.nombre?row("Levadura",`${esc(L.nombre)} · Gen ${esc(L.generacion)}${r.nombreCosecha?` → saldrá <b>${esc(r.nombreCosecha)}</b>`:""}`):null, row("Qué hacer",consejo(o,now)) ],
      ver:["#/tanque/"+encodeURIComponent(o.lote),"Abrir el tanque"]},["Cuándo llega a alta el FV "+o.tq,"De dónde viene su levadura"],{fv:o.tq}); }
  function consejo(o,now){ const k=o.st.k; if(k==="rojo") return "Retírala cuanto antes y deja el motivo de la demora."; if(k==="naranja") return `Retírala antes del máximo (${fmtS(o.r.venc)}).`; if(k==="verde") return "Ya puedes retirarla; lo ideal es hacia T0 + 12 h."; if(k==="amarillo") return "Prepárate: el T0 está cerca."; return o.r.ext==null?"Toma una muestra de extracto para afinar el T0.":"Sigue tomando muestras; el T0 se afina con cada una."; }
  function tema(q){ const T=[["alta",/\balta\b|dar de alta|extracto de alta/],["porque",/por que|porque|razon|motivo|a que se debe/],["puedo",/\b(puedo|se puede|podemos|toca|debo|hay que|ya)\b.*\b(retir|cosech|sacar)/],["vence",/venc|limite|plazo|maximo|hasta cuando|ultimo momento/],["t0",/\bt0\b|t cero|cuando.*(retir|cosech|sacar)|hora de retiro|ventana|a que hora|mejor momento|momento ideal/],
      ["atenuacion",/atenu/],["extracto",/extracto|grados|plato|densidad|\bp\b/],["ritmo",/ritmo|velocidad|rapido|lento|\bcae\b|caida|baja por dia|ha bajado|cuanto baja|va bajando/],["muestras",/\bmuestras?\b/],["linaje",/viene|origen|linaje|ancestro|padre|genealog/],
      ["levadura",/levadura|\bleva\b|cepa|sembr|que tiene|con que/],["marca",/marca|cerveza|que se fermenta|\blote\b|consecutivo/],["familia",/familia|linea/],["gen",/generacion|\bgen\b/],["llenado",/llen(o|ado)|fin de llenado|hace cuanto/],["porque",/por que|porque|razon|motivo|a que se debe/],["hacer",/que (hago|debo|hay que|toca|sigue)|recomiend|consejo|que pasa si/],["estado",/estado|como (va|esta|anda|vamos)|situacion/]];
    for(const [k,re] of T) if(re.test(q)) return k; return null; }
  function fvTema(D,o,q,t){ const {r}=o, now=D.now, nom=`FV ${o.tq}`, p=o.pr;
    switch(t){
      case "alta":{ if(p.estado==="sin-meta") return out({h:`${nom} es ${esc(tit(o.marca))} y no tiene extracto de alta definido.`,btn:[["Definirlo en Ajustes","open:#/config"]]},[],{fv:o.tq});
        if(p.estado==="alcanzada") return out({h:`${nom} <b>ya llegó a la alta</b>`,s:`Objetivo ${f(p.A,1)} °P · alcanzada ${rel(p.t,now)} (${fmtS(p.t)})`,k:[[f(p.last.e,2),"Extracto actual °P"],[f(p.A,1),"Alta °P","ok"]],ver:["#/analisis","Ver la curva proyectada",""]},["Cuáles ya llegaron a alta"],{fv:o.tq});
        if(p.estado==="proyectada") return out({h:`${nom} llegará a la alta el <b>${fmtS(p.t)}</b>`,s:`${rel(p.t,now)} · objetivo ${f(p.A,1)} °P`,k:[[f(p.last.e,2),"Extracto hoy °P"],[f(p.falta,2),"Faltan °P"],[f(p.dias,1),"Ritmo °P/día"]],rows:[row("Rango",`${fmtS(p.lo)} – ${fmtS(p.hi)}`),row("Confianza",{alta:"alta",media:"media",baja:"baja"}[p.conf]+(p.metodo==="marca"?" · por días de referencia":"")),p.vencida?`<div class="ans-n warn">La última muestra es vieja (${f(p.hSin,0)} h): toma una nueva para confirmar.</div>`:null],ver:["#/analisis","Ver la curva y el simulador",""]},[],{fv:o.tq});
        return out({h:`Todavía no puedo proyectar la alta de ${nom}`,s:p.estado==="sin-datos"?"Faltan muestras de extracto.":"El extracto no muestra caída."},[],{fv:o.tq}); }
      case "puedo":{ const ok=["rojo","naranja","verde"].includes(o.st.k); return out({h:ok?`<b>Sí</b>, ${nom} se puede retirar`:`<b>Todavía no</b> para ${nom}`,s:ok?(o.st.k==="rojo"?"Ya pasó el máximo: hazlo cuanto antes.":`Ventana abierta hasta ${fmtS(r.venc)} (${rel(r.venc,now)}).`):(r.t0?`Su T0 es ${fmtS(r.t0)} (${rel(r.t0,now)}).`:"Aún no tiene T0 calculado."),btn:ok&&App.Store.canWrite?[["Retirar levadura","retiro:"+o.lote]]:null},[],{fv:o.tq}); }
      case "vence":{ if(!r.venc) return out({h:`${nom} todavía no tiene T0`,s:"Faltan muestras de extracto o el extracto límite."},[],{fv:o.tq}); const v=+parseDT(r.venc);
        return out({h:`El retiro de ${nom} ${v>now?"vence":"venció"} el <b>${fmtS(v)}</b>`,s:rel(v,now),rows:[row("T0",fmtS(r.t0)),row("Ideal",fmtS(+parseDT(r.t0)+12*HOUR))]},[],{fv:o.tq}); }
      case "t0":{ if(!r.t0) return out({h:`${nom} todavía no tiene T0`,s:"Faltan muestras de extracto o el extracto límite."},[],{fv:o.tq}); const t0=+parseDT(r.t0);
        return out({h:`El T0 de ${nom} ${t0>now?"será":"fue"} el <b>${fmtS(t0)}</b>`,s:rel(t0,now)+(r.proy?" · proyectado":""),rows:[row("Ideal (+12 h)",fmtS(t0+12*HOUR)),row("Máximo (+24 h)",fmtS(t0+24*HOUR)),row("Estado",pill(ST_TXT[o.st.k],TONE[o.st.k]))]},[],{fv:o.tq}); }
      case "atenuacion": case "extracto":{ if(r.ext==null) return out({h:`${nom} aún no tiene muestras de extracto`,btn:App.Store.canWrite?[["Agregar muestra","muestra:"+o.lote]]:null},[],{fv:o.tq});
        return out({h:`${nom}: extracto <b>${f(r.ext,2)} °P</b> · atenuación <b>${Math.round((r.atenuacion||0)*100)} %</b>`,s:`Última muestra ${rel(r.extFecha,now)}`,k:[[f(r.ext,2),"Extracto °P"],[Math.round((r.atenuacion||0)*100)+"%","Atenuación"],[r.falta75>0?f(r.falta75,2):"0","Faltan al 75 % °P"]],rows:[o.pr.A!=null?row("Alta",`${f(o.pr.A,1)} °P · ${o.pr.estado==="alcanzada"?"ya alcanzada":o.pr.estado==="proyectada"?"llegará "+fmtS(o.pr.t):"sin proyección"}`):null],ver:["#/tanque/"+encodeURIComponent(o.lote),"Ver la curva completa"]},[],{fv:o.tq}); }
      case "ritmo":{ const p2=o.pr; if(has(q,/(bajado|cuanto baj|ha caido)/)&&o.t.eo!=null&&r.ext!=null) return out({h:`${nom} ha bajado <b>${f(o.t.eo-r.ext,2)} °P</b> desde el llenado`,s:`De ${f(o.t.eo,2)} a ${f(r.ext,2)} °P · atenuación ${Math.round((r.atenuacion||0)*100)} %`,rows:[p2.dias?row("Ritmo actual",`${f(p2.dias,2)} °P por día`):null]},[],{fv:o.tq}); return out({h:p2.dias?`${nom} baja <b>${f(p2.dias,2)} °P por día</b>`:`No hay ritmo calculado para ${nom}`,s:p2.dias?`Calculado con ${p2.n} ${plural(p2.n,"punto","puntos")} de la curva`:"Faltan muestras.",rows:[r.velDia?row("Velocidad (T0)",`${f(r.velDia,2)} °P/día`):null]},[],{fv:o.tq}); }
      case "muestras":{ const m=(o.t.muestras||[]); return out({h:`${nom} tiene <b>${m.length}</b> ${plural(m.length,"muestra","muestras")} de extracto`,rows:m.slice(-5).reverse().map(x=>row(fmtS(parseDT(x.t)),`${f(x.ext,2)} °P`)),btn:App.Store.canWrite?[["Agregar muestra","muestra:"+o.lote]]:null,ver:["#/tanque/"+encodeURIComponent(o.lote),"Ver todas las muestras"]},[],{fv:o.tq}); }
      case "levadura": case "gen": case "linaje":{ if(!o.lev) return out({h:`${nom} no tiene levadura registrada`},[],{fv:o.tq}); const reg=D.REG.find(x=>x.id===o.L.levId), pa=reg&&padre(D,reg);
        return out({h:`${nom} tiene <b>${esc(o.lev)}</b>`,s:`Generación ${o.gen}${reg?` · familia ${esc(o.fam||"")}`:""}`,rows:[r.nombreCosecha?row("Al cosecharla",`saldrá <b>${esc(r.nombreCosecha)}</b> (Gen ${o.gen+1})`):null,reg?row("Cosechada del",`FV ${esc(reg.tq)}${reg.t0?" · "+fmtS(parseDT(reg.t0)):""}`):null,pa?row("Viene de",`<b>${esc(pa.nombre)}</b> (Gen ${pa.generacion})`):null,o.L.viab!=null?row("Calidad",`viabilidad ${pct(o.L.viab)} · consistencia ${pct(o.L.cons)}`):null],ver:reg?["#/detalle/levadura/"+encodeURIComponent(o.lev),"Ver su historia completa"]:null},[],{fv:o.tq,lev:o.lev}); }
      case "familia":{ if(!o.lev) return out({h:`${nom} no tiene levadura registrada`},[],{fv:o.tq}); return out({h:`La levadura de ${nom} es de la <b>familia ${esc(o.fam||"?")}</b>`,s:`${esc(o.lev)} · ${esc(tit(o.mk))} · Gen ${o.gen}`,ver:o.fam?["#/detalle/familia/"+o.fam+"/"+encodeURIComponent(o.mk),"Ver la familia completa"]:null},[o.fam?{label:`Qué pasó con la familia ${o.fam}`,q:`familia ${o.fam} ${String(o.mk).toLowerCase()}`}:null].filter(Boolean),{fv:o.tq,lev:o.lev}); }
      case "marca":{ return out({h:`${nom} es <b>${esc(tit(o.marca))}</b>`,s:`Lote ${esc(o.lote)}${o.lev?" · levadura "+esc(o.lev):""}`},[],{fv:o.tq}); }

    const ch=[r]; let c=r; for(let i=0;i<9;i++){ const p=padre(D,c); if(!p||ch.includes(p)) break; ch.push(p); c=p; } const sie=(r.siembras||[]), enC=D.OC.filter(p=>p.nombre===nombre), pn=parse(nombre), hijos=D.REG.filter(h=>sie.some(s=>s.lote===h.lote)&&h.id!==r.id);
    return `<div class="v34-pg">${back}<div class="page-h"><div><h1>${esc(nombre)}</h1><p>${esc(tit(r.marca))} · familia ${esc(pn.fam||"")} · generación ${r.generacion} · ${stPill(r.st)}</p></div></div>
      <div class="v32-kp"><div><b>${pct(r.viab)}</b><span>Viabilidad</span></div><div><b>${pct(r.cons)}</b><span>Consistencia</span></div><div><b>${r.ph!=null?f(r.ph,2):"—"}</b><span>pH</span></div><div><b>${sie.length}</b><span>Siembras</span></div></div>
      <div class="v32-two"><div class="v31-card"><div class="v31-ch"><h2>Linaje</h2><p>De la más reciente a la más antigua.</p></div><div class="ans-line">${ch.map(x=>`<div><i></i><span><a href="#/detalle/levadura/${encodeURIComponent(x.nombre)}"><b>${esc(x.nombre)}</b></a> <small>Gen ${x.generacion} · FV ${esc(x.tq)}${x.t0?" · "+fmtS(parseDT(x.t0)):""}</small></span></div>`).join("")}</div></div>
      <div class="v31-card"><div class="v31-ch"><h2>Dónde se sembró</h2></div>${sie.length?sie.map(s=>{ const act=D.lotes.has(s.lote); return `<div class="v32-ev ${act?"in":"out"}"><i></i><span><b>FV ${esc(s.tq)} · lote ${esc(s.lote)}</b><small>${fmtS(parseDT(s.fecha))}</small></span>${act?pill("en proceso","ok"):pill("terminada","idle")}</div>`; }).join(""):'<p class="v31-none">Sin siembras registradas.</p>'}</div></div>
      <div class="v31-card"><div class="v31-ch"><h2>Cosecha y ubicación</h2></div>
        <dl class="v32-dl"><div><dt>Cosechada del</dt><dd>FV ${esc(r.tq)}</dd></div><div><dt>Lote</dt><dd>${esc(r.lote)}</dd></div><div><dt>T0</dt><dd>${r.t0?fmtS(parseDT(r.t0)):"—"}</dd></div><div><dt>En colector</dt><dd>${enC.length?enC.map(p=>p.id).join(", "):"—"}</dd></div><div><dt>Siguientes cosechas</dt><dd>${hijos.length?hijos.map(h=>esc(h.nombre)).join(", "):"—"}</dd></div><div><dt>Estado</dt><dd>${estadoTxt(r.st)}</dd></div></dl></div></div>`; }
  function dEstados(){ const D=datos(), c={}; D.REG.forEach(r=>c[r.st]=(c[r.st]||0)+1); const nom={utilizada:"Ya utilizadas",inventario:"Disponibles en colector",vaciada:"Vaciadas sin resiembra",descartada:"Descartadas",incompleto:"Incompletas"}, tot=D.REG.length; const marcas=[...new Set(D.REG.map(r=>r.marca))].filter(Boolean);
    return `<div class="v34-pg">${back}<div class="page-h"><div><h1>Panorama de la levadura</h1><p>Qué ha pasado con cada cosecha de la base de datos.</p></div></div>
      <div class="v32-kp">${["utilizada","inventario","vaciada","descartada"].map(k=>`<div><b>${c[k]||0}</b><span>${nom[k]}</span></div>`).join("")}</div>
      <div class="v31-card"><div class="v31-ch"><h2>Por marca</h2></div><table class="v32-tb"><thead><tr><th>Marca</th><th>Cosechas</th><th>Utilizadas</th><th>Descartadas</th><th>Viabilidad media</th></tr></thead><tbody>${marcas.map(m=>{ const rs=D.REG.filter(r=>r.marca===m); return `<tr><td><b>${esc(tit(m))}</b></td><td>${rs.length}</td><td>${rs.filter(r=>r.st==="utilizada").length}</td><td>${rs.filter(r=>r.st==="descartada").length}</td><td>${pct(V.mean(rs.map(r=>r.viab)))}</td></tr>`; }).join("")}</tbody></table></div>
      <div class="v31-card"><div class="v31-ch"><h2>Ahora</h2></div><dl class="v32-dl"><div><dt>En fermentación</dt><dd>${D.P.length} tanques</dd></div><div><dt>En colectores</dt><dd>${D.OC.length} posiciones</dd></div><div><dt>Total en la base</dt><dd>${tot} cosechas</dd></div></dl><a class="ans-ver" href="#/bd">Abrir el Explorador de levaduras ›</a></div></div>`; }
  App.V.detalle={ render(tipo,a,b){ try{ if(tipo==="familia") return dFamilia(a,b); if(tipo==="generaciones") return dGeneraciones(); if(tipo==="levadura") return dLevadura(a); if(tipo==="estados") return dEstados(); }catch(e){ console.error("detalle",e); } return `<div class="v34-pg">${back}<div class="page-h"><div><h1>Detalle</h1><p>No hay detalle para esto.</p></div></div></div>`; } };

  App.Cerebro={responder:(t,env)=>cerebro(t,env),datos};
})();

</script>

<script>
/* Operación del turno: borradores, trasiego, filtración, bitácora y prioridades por lote. */
(function(){
 const {esc,clone,parseDT,fmtS,toast}=App.U,H=3600000,num=App.FVRegistration.num;
 const fmt=v=>v==null?'—':new Intl.NumberFormat('es-CO',{maximumFractionDigits:2}).format(v);
 const date=v=>v&&Number.isFinite(+new Date(v))?fmtS(new Date(v)):'Pendiente';
 const id=r=>App.TankPurges.identity(r),key=r=>'tankTurn_'+encodeURIComponent(id(r));
 const state=r=>App.S.config[key(r)]||{notes:[],checks:{}};
 const record=tq=>App.Cavas.records().find(r=>r.tq===+tq);
 const analysis=r=>r.operation==='F'?App.FVDetail.analyze(App.FVDetail.model(r),r):null;
 function harvest(r,a=analysis(r),now=Date.now()){
  const actual=state(r).checks.harvest?.t||r.fermentation?.retiro?.fecha||r.collection;
  if(actual)return {color:'done',label:'Cosecha registrada',help:date(actual),rank:9};
  if(!a?.t0)return {color:'neutral',label:'Cosecha: esperando T0',help:'Completa extracto original, límite y muestras.',rank:8};
  const elapsed=(now-a.t0)/H;
  if(elapsed<0)return {color:'neutral',label:'Antes de T0',help:'Comienza '+date(a.t0),rank:8};
  if(elapsed<12)return {color:'green',label:'Cosecha · ventana verde',help:'Disponible desde T0. Recomendado: '+date(a.t0+12*H),rank:3};
  if(elapsed<=24)return {color:'yellow',label:'Cosecha · ventana amarilla',help:'Retirar antes de '+date(a.t0+24*H),rank:2};
  return {color:'red',label:'Cosecha fuera de tiempo',help:'Superó T0 +24 h · '+fmt(elapsed-24)+' h de atraso',rank:0};
 }
 function tasks(r,a){if(!r.operation)return [];const s=state(r),now=Date.now(),rows=[];
  for(const note of s.notes||[])if(note.alert!=='info'&&!note.resolved)rows.push({color:note.alert==='urgent'?'red':'yellow',label:note.category,help:note.text,rank:note.alert==='urgent'?0:2,section:'log'});
  for(const p of App.TankPurges.schedules(r).filter(p=>p.required&&!p.done))rows.push({color:p.time&&p.time<=now?'yellow':'neutral',label:p.label,help:p.time?date(p.time):'Horario pendiente',rank:p.time&&p.time<=now?1:7,section:'purges'});
  if(r.operation==='F'){
   a=a||analysis(r);const h=harvest(r,a);rows.push(Object.assign(h,{section:'harvest'}));
   const due=(r.fvRegistration?.fillEnd||r.fill)?+parseDT(r.fvRegistration?.fillEnd||r.fill)+3*H:NaN;
   for(const [k,l]of [['plant','Conexión a la planta'],['cells','Conteo celular · 3 h']])if(!s.checks[k])rows.push({color:due<=now?'yellow':'neutral',label:l,help:date(due),rank:due<=now?1:7,section:'checks'});
   const c=a.cold;if(!c.real&&c.due)rows.push({color:c.due<=now?'yellow':'neutral',label:c.due<=now?'Hora de dar frío':'Frío programado',help:date(c.due),rank:c.due<=now?2:7,section:'cold'});
  }else {const maturity=App.PlatformRules?.maturity(r);if(maturity?.due)rows.push({color:Date.now()>=maturity.due?'green':'neutral',label:Date.now()>=maturity.due?'Mínimo de maduración cumplido':'En maduración',help:fmt(maturity.elapsed)+' h · mínimo '+fmt(maturity.minimum)+' h',rank:7,section:'maturity'});if(!App.TankPurges.state(r).records.some(p=>p.type==='filter'))rows.push({color:'neutral',label:'Purga antes de filtro',help:'Confirmar antes de comenzar filtración.',rank:6,section:'purges'});}
  return rows.sort((a,b)=>a.rank-b.rank);
 }
 function card(r){r=App.ExcelCavas.enrich(r);if(!r.operation)return '<div class="turn-card neutral"><b>Tanque libre</b><small>Disponible para fermentación o maduración.</small></div>';const rows=tasks(r),top=rows[0];return `<div class="turn-card ${top?.color||'neutral'}"><small>PRIORIDAD DEL TURNO</small><b>${esc(top?.label||'Seguimiento al día')}</b><span>${esc(top?.help||'Continúa el control del proceso.')}</span>${rows.length>1?'<small>'+rows.filter(t=>t.rank<6).length+' tareas requieren revisión · abre el tanque</small>':''}</div>`;}
 function priority(r,a){const rows=tasks(r,a);return `<section class="turn-priority fv-detail-section"><div class="sec-h"><div><span class="turn-eyebrow">TU TURNO · ${esc(r.consecutive)}</span><h2>Qué atender primero</h2></div><b>${fmt(r.volume)} Hl disponibles</b></div><div class="turn-task-grid">${rows.slice(0,6).map(t=>`<a class="turn-task ${t.color}" href="#turn-${t.section}" data-turn-jump="${t.section}"><span class="turn-dot"></span><div><b>${esc(t.label)}</b><small>${esc(t.help)}</small></div><span>↗</span></a>`).join('')||'<p>Seguimiento al día.</p>'}</div></section>`;}
 function harvestPanel(r,a){const h=harvest(r,a);return `<section class="fv-detail-section harvest-window ${h.color}" id="turn-harvest"><div class="sec-h"><h2>Ventana de cosecha</h2><span class="turn-pill ${h.color}">${esc(h.label)}</span></div><p>${esc(h.help)}</p><div class="harvest-stages">${[['green','T0 → +12 h','Ya puede retirarse',a.t0],['yellow','+12 → +24 h','Retiro recomendado',a.t0?a.t0+12*H:null],['red','Después de +24 h','Tiempo máximo superado',a.t0?a.t0+24*H:null]].map(([c,l,d,t])=>`<article class="${c} ${h.color===c?'current':''}"><b>${l}</b><span>${d}</span><small>${date(t)}</small></article>`).join('')}</div><p class="fv-helper">T0 se calcula con atenuaciones. La recomendación de retiro es T0 +12 h; después de T0 +24 h se marca en rojo. Una cosecha registrada cierra el aviso.</p>${App.Store.canWrite?'<button class="btn" data-turn-check="harvest">Registrar cosecha realizada</button>':''}</section>`;}
 function checksPanel(r){const s=state(r),due=(r.fvRegistration?.fillEnd||r.fill)?+parseDT(r.fvRegistration?.fillEnd||r.fill)+3*H:NaN,ready=Number.isFinite(due)&&Date.now()>=due;return `<section class="fv-detail-section" id="turn-checks"><div class="sec-h"><h2>Controles de las 3 horas</h2><span class="turn-pill ${ready?'yellow':'neutral'}">${ready?'Disponibles':'Disponibles desde '+date(due)}</span></div><p class="fv-helper">Contados desde el fin de llenado del FV.</p><div class="turn-check-grid">${[['plant','Conexión a la planta'],['cells','Conteo celular']].map(([k,l])=>`<article><h3>${l}</h3><b>${s.checks[k]?date(s.checks[k].t):'Pendiente'}</b>${k==='cells'&&s.checks[k]?'<p>'+fmt(s.checks[k].value)+' Mcel/mL</p>':''}<p>${esc(s.checks[k]?.note||'Registra la operación y su responsable.')}</p>${App.Store.canWrite?`<button class="btn" data-turn-check="${k}" ${ready?'':'disabled'}>${s.checks[k]?'Actualizar':'Registrar'}</button>`:''}</article>`).join('')}</div></section>`;}
 function logPanel(r){const s=state(r);return `<section class="fv-detail-section turn-log" id="turn-log"><div class="sec-h"><div><h2>Bitácora del tanque</h2><p class="fv-helper">Describe lo ocurrido. Espuma y desviaciones generan avisos pendientes; puedes ajustar su prioridad.</p></div>${App.Store.canWrite?'<button class="btn pri" id="turnNote">Agregar comentario</button>':''}</div>${(s.notes||[]).slice().reverse().map(note=>`<article class="log-entry ${note.resolved?'done':note.alert==='urgent'?'red':note.alert==='review'?'yellow':'neutral'}"><div><b>${esc(note.category)}</b><span>${date(note.t)} · ${esc(note.responsible||'Sin responsable')}</span></div><p>${esc(note.text)}</p><small>${note.resolved?'Resuelto · '+date(note.resolved):note.alert==='urgent'?'Atención urgente':note.alert==='review'?'Revisar en el turno':'Informativo'}</small>${!note.resolved&&note.alert!=='info'&&App.Store.canWrite?`<button class="btn sm" data-turn-resolve="${esc(note.id)}">Marcar resuelto</button>`:''}</article>`).join('')||'<p class="fv-helper">Sin comentarios. Puedes registrar espuma, observaciones de proceso o pendientes para el siguiente turno.</p>'}</section>`;}
 async function saveTurn(r,next){return App.Store.set('config',key(r),next);}
 async function check(r,type){const fields=[{k:'t',l:'Fecha y hora real',t:'dt',req:true},...(type==='cells'?[{k:'value',l:'Recuento celular (Mcel/mL)',t:'n',req:true}]:[]),{k:'responsible',l:'Responsable'},{k:'note',l:'Observación'}];const d=await App.UI.form({title:{plant:'Conexión a la planta',cells:'Conteo celular a las 3 horas',harvest:'Cosecha realizada'}[type],fields,values:Object.assign({t:App.U.toIn(new Date())},state(r).checks[type]),validate:v=>!v.t||!Number.isFinite(+parseDT(v.t))?'Registra una fecha válida.':+parseDT(v.t)<+parseDT(r.fill)?'La fecha debe ser posterior al llenado.':['cells','plant'].includes(type)&&+parseDT(v.t)<+parseDT(r.fvRegistration?.fillEnd||r.fill)+3*H?'Este control corresponde a las 3 horas desde el fin de llenado.':type==='cells'&&(v.value==null||v.value<0)?'Indica un recuento mayor o igual a cero.':null});if(!d)return;const s=clone(state(r));s.checks[type]=d;if(await saveTurn(r,s))App.render(true);}
 async function note(r){const d=await App.UI.form({title:'Comentario del turno',fields:[{k:'category',l:'Qué ocurrió',opts:[['Observación','Observación'],['Espuma','El tanque espumó'],['pH','Desviación de pH'],['Fuga','Fuga'],['Temperatura','Temperatura'],['Pendiente','Pendiente para el siguiente turno']]},{k:'text',l:'Comentario',req:true},{k:'alert',l:'Prioridad',opts:[['auto','Sugerir según comentario'],['info','Informativo'],['review','Revisar en el turno'],['urgent','Atención urgente']]},{k:'responsible',l:'Responsable'}],values:{category:'Observación',alert:'auto'}});if(!d)return;const text=d.category+' '+d.text;if(d.alert==='auto')d.alert=/fuga|derrame|desbord|espuma.*(much|fuerte)|riesgo/i.test(text)?'urgent':/espum|ph|temperatura|pendiente|anomal|desvia/i.test(text)?'review':'info';const s=clone(state(r));s.notes=s.notes||[];s.notes.push(Object.assign(d,{id:'note-'+Date.now(),t:new Date().toISOString()}));if(await saveTurn(r,s))App.render(true);}
 // Durable operation drafts. They belong to the source lot; finishing a transaction records its token atomically.
 let currentDraft=null,draftQueue=Promise.resolve(),draftTimer;
 const draftKey=(kind,r)=>'tankOpDraft_'+encodeURIComponent(kind+'|'+id(r));
 const storageKey=k=>'cavas:'+k;
 function readDraft(k){let local;try{local=JSON.parse(localStorage.getItem(storageKey(k)));}catch(e){}const stored=App.S.config[k];return local&&(!stored||local.updatedAt>stored.updatedAt)?local:stored;}
 function persistDraft(){if(!currentDraft||!App.Store.canWrite)return;const {key:k,data}=currentDraft;data.updatedAt=new Date().toISOString();const snapshot=clone(data);try{localStorage.setItem(storageKey(k),JSON.stringify(snapshot));status('Borrador guardado en este navegador');}catch(e){status('No se pudo guardar el borrador; conserva esta página abierta.');}clearTimeout(draftTimer);draftTimer=setTimeout(()=>{draftQueue=draftQueue.then(()=>App.Store.set('config',k,snapshot)).catch(()=>status('No se pudo guardar el avance.'));},300);}
 function status(message){const el=document.getElementById('operationDraftStatus');if(el)el.textContent=message;}
 const specs={
 transfer:[['Origen y destino',[
 ['destination','SV destino (cualquier tanque libre)','tank'],['consecutive','Consecutivo de maduración (M)','text'],['start','Inicio trasiego','datetime-local'],['end','Fin trasiego / fin llenado SV','datetime-local'],['temperatureBefore','Temperatura antes de trasiego (°C)','number'],['eoKitchen','E.O cocina (°P)','number'],['eoFV','E.O en FV (°P)','number'],['kitchenVolume','Volumen cocina (Hl)','number'],['kitchenKGE','KGE cocina','number'],['recoveredTankVolume','Volumen cerveza recuperada (Hl)','number'],['recoveredTankEO','E.O cerveza recuperada (°P)','number'],['silicaLot','Lote sílica y PVPP','text'],['silicaBags','Bultos preparados sílica y PVPP','number'],['sensory','Sensorial sílica','text'],['taster','Degustador','text']]],
 ['Seguimiento del trasiego',[]],
 ['Cierre y volumen',[['volume','Volumen total contador a SV (Hl)','number'],['empty','¿FV queda vacío?','yesno'],['co2','CO₂ en SV','number'],['oxygenSV','O₂ en SV (ppb)','number'],['responsible','Responsable','text'],['comment','Eventos durante trasiego','text']]],
 ['Centrífuga y Deep Freeze',[['centrifuge','Trasiego con centrífuga','yesno'],['yeastRecovery','Recuperación de levadura','yesno'],['noRecoveryReason','Causa no recuperación','text'],['originCollector','Colector origen levadura','text'],['collectorVolume','Volumen en colector (Hl)','number'],['collectorTemp','Temperatura colector (°C)','number'],['partialDischarges','Número de descargas parciales','number'],['recoveredYeast','Volumen levadura recuperada (Hl)','number'],['yeastRemaining','¿Queda levadura para otro trasiego?','yesno'],['dischargeConsistency','Consistencia descarga centrífuga (%)','number'],['dischargeEO','Extracto original descarga centrífuga (°P)','number'],['centrifugeCounter','Volumen contador centrífuga (Hl)','number'],['yeast','Levadura','text'],['usageHours','Tiempo de uso (h)','number'],['treatedConsistency','Consistencia levadura a tratar (%)','number'],['ph','pH','number'],['beerRecovered','Volumen cerveza recuperado (Hl)','number'],['beerLost','Cerveza perdida en descargas (Hl)','number'],['realRecovered','Volumen real recuperado (Hl)','number'],['kgeRecovered','KGE recuperados','number'],['equivalent95','Volumen equivalente recuperado a 9,5 °P (Hl)','number'],['integratedOxygen','OD integrado (ppb)','number'],['deepFreeze','Trasiego Deep Freeze','yesno'],['deepFreezeCase','Caso Deep Freeze','deepcase']]]],
 filter:[['Filtración y liquidación de SV',[['start','Fecha inicio filtración','datetime-local'],['end','Fecha fin filtración','datetime-local'],['eoSV','E.O en SV (°P)','number'],['kgeIn','KGE entrada','number'],['volumeFromFV','Volumen a SV desde FV (Hl)','number'],['previousFiltered','Volumen filtrado anteriormente (Hl)','number'],['volume','Volumen de esta filtración (Hl)','number'],['earlyReason','Motivo de filtración antes del mínimo de maduración','text'],['empty','¿SV queda vacío?','yesno'],['kgeOut','KGE salida','number'],['responsible','Responsable','text'],['comment','Comentario','text']]]]
 };
 const stageFields=[['time','Hora seguimiento','time'],['pressure','Presión entrada enfriador','number'],['ph','pH','number'],['outTemp','Temperatura salida enfriador (°C)','number'],['inTemp','Temperatura entrada enfriador (°C)','number'],['oxygen','O₂ en línea','number'],['operator','Cavero','text']];
 function input(field,d,r){const [k,l,t]=field,v=d[k]??'';let control;if(t==='deepcase')control=`<select name="${k}"><option value="">Seleccionar combinación</option>${App.PlatformRules.cases.map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select>`;else if(t==='tank')control=`<select name="${k}"><option value="">Seleccionar tanque</option>${App.Cavas.records().filter(x=>x.tq!==r.tq&&(!x.operation||x.operation==='M'&&x.brand===r.brand)).map(x=>`<option value="${x.tq}" ${String(v)===String(x.tq)?'selected':''}>UTQ ${x.tq} · ${x.operation?x.consecutive+' (SV activo)':'Libre · usar como SV'}</option>`).join('')}</select>`;else if(t==='yesno')control=`<select name="${k}"><option value="">Seleccionar</option>${['SI','NO'].map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select>`;else control=`<input name="${k}" type="${t}" ${t==='number'?'step="any"':''} value="${esc(v)}">`;return `<label class="f"><span>${l}</span>${control}</label>`;}
 function draftData(kind,r){const k=draftKey(kind,r);let d=readDraft(k);const transactions=App.ExcelCavas.inventory().operationEvents||[];if(d&&transactions.some(e=>e.token===d.token))d=null;if(!d)d={token:'op-'+Date.now()+'-'+Math.random().toString(36).slice(2),identity:id(r),kind,tq:r.tq,empty:'SI',consecutive:kind==='transfer'?'M'+(Math.max(0,...App.Cavas.records().filter(x=>x.operation==='M').map(x=>+String(x.consecutive).slice(1)||0),...(App.ExcelCavas.inventory().operationEvents||[]).filter(x=>x.kind==='transfer').map(x=>+String(x.consecutive).slice(1)||0))+1):r.consecutive,eoKitchen:App.FVDetail.model(r).eo,eoFV:App.FVDetail.model(r).eo??'',eoSV:r.maturation?.finalAnalysis?.eo??r.maturation?.cells?.[65]??'',kgeIn:r.maturation?.cells?.[448]??null,previousFiltered:r.maturation?.cells?.[364]??0,volumeFromFV:r.maturation?.vol??r.volume};return {key:k,data:d};}
 function operationView(kind,tq){const r=record(tq),phase=kind==='transfer'?'F':'M';if(!r||r.operation!==phase)return '<section class="fv-detail-section"><h1>Operación cerrada o tanque libre</h1><a class="btn" href="#/tanques">Volver a tanques</a></section>';currentDraft=draftData(kind,r);const d=currentDraft.data;return `<div class="tank-operation"><a href="#/${phase==='F'?'fv':'sv'}/detalle/${r.tq}">← Volver al tanque</a><header class="operation-hero"><span class="turn-eyebrow">${esc(r.consecutive)} · UTQ ${r.tq} · ${esc(r.brand)}</span><h1>${kind==='transfer'?'Trasiego a maduración':'Filtración y liquidación'}</h1><p>Completa los datos entre turnos. Finalizar guarda el movimiento y libera el tanque si confirmas que quedó vacío.</p><b>Volumen disponible: ${fmt(r.volume)} Hl</b><div class="operation-context"><span>Ocupación ${phase==='F'?'FV':'SV'}: ${fmt((Date.now()-+parseDT(r.fill))/H)} h · ${fmt((Date.now()-+parseDT(r.fill))/H/24)} días</span>${phase==='M'?`<span>Tiempo previo en FV: ${fmt(App.TankProcess.archiveForM(r)[0]?(App.TankProcess.archiveForM(r)[0].transferStart-App.TankProcess.archiveForM(r)[0].a.fin)/H:null)} h</span>`:''}</div></header>${App.TankPurges.schedules(r).some(p=>p.required&&!p.done)?'<p class="operation-warning">Hay purgas pendientes de registrar. Revisa el apartado Purgas y registra los volúmenes retirados antes de cerrar el movimiento.</p>':''}<form id="tankOperationForm">${specs[kind].map(([title,fields])=>`<fieldset class="fv-detail-section"><legend>${title}</legend>${title==='Centrífuga y Deep Freeze'?'<p class="fv-helper" id="operationApplicability"></p>':''}${title==='Seguimiento del trasiego'?`<div class="fv-table-scroll"><table class="fv-progress-table"><thead><tr><th>Dato</th>${['5 min inicio (50 Hl)','Mitad (1700 Hl)','5 min fin (3800 Hl)'].map(l=>'<th>'+l+'</th>').join('')}</tr></thead><tbody>${stageFields.map(([k,l,t])=>`<tr><th>${l}</th>${[0,1,2].map(i=>`<td><input name="stage_${i}_${k}" type="${t}" ${t==='number'?'step="any"':''} aria-label="${esc(l)} · etapa ${i+1}" value="${esc(d['stage_'+i+'_'+k]??'')}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="operation-grid">${fields.map(f=>input(f,d,r)).join('')}</div>`}</fieldset>`).join('')}<section class="fv-detail-section operation-summary"><h2>Balance del movimiento</h2><div id="operationBalance"></div><p class="fv-helper">El balance de volumen ya descuenta las purgas. La merma de extracto del Excel usa KGE entrada y KGE salida, y se calcula al confirmar tanque vacío. Los KGE quedan editables; la función externa Levadura del libro no se sustituye por una fórmula distinta.</p></section><footer class="operation-footer"><span id="operationDraftStatus">Borrador guardado entre turnos en este navegador</span><a class="btn" href="#/${phase==='F'?'fv':'sv'}/detalle/${r.tq}">Cerrar y continuar después</a><button class="btn pri" type="submit">${kind==='transfer'?'Finalizar trasiego':'Finalizar filtración'}</button></footer></form></div>`;}
 function balanceHTML(r,d){const volume=num(d.volume),loss=volume!=null&&r.volume!=null?r.volume-volume:null;const m=r.operation==='M'?App.PlatformRules.maturity(r):null,t=+parseDT(d.start),h=m&&t?(t-m.start)/H:null;return `${m?`<div class="filter-timing ${App.PlatformRules.early(r,d.start)?'early':''}"><b>Maduración antes del inicio del filtro: ${fmt(h)} h</b><span>Mínimo ${fmt(m.minimum)} h · objetivo ${fmt(m.target)} h</span>${App.PlatformRules.early(r,d.start)?'<strong>Inicio anticipado: registra el motivo.</strong>':''}</div>`:''}${m?`<div class="fv-metrics"><div class="fv-metric"><span>Filtrado acumulado</span><b>${fmt((num(d.previousFiltered)||0)+(volume||0))} Hl</b></div><div class="fv-metric"><span>Merma de extracto (KGE)</span><b>${d.empty==='SI'&&num(d.kgeIn)>0&&num(d.kgeOut)!=null?fmt((num(d.kgeIn)-num(d.kgeOut))/num(d.kgeIn)*100)+' %':'Pendiente de cierre / KGE'}</b></div></div>`:''}<div class="fv-metrics"><div class="fv-metric"><span>Disponible antes del movimiento</span><b>${fmt(r.volume)} Hl</b></div><div class="fv-metric"><span>Volumen de contador</span><b>${fmt(volume)} Hl</b></div><div class="fv-metric"><span>${d.empty==='SI'?'Diferencia al vaciar':'Saldo que permanece'}</span><b>${fmt(loss)} Hl</b><small>${d.empty==='SI'&&r.volume>0&&loss!=null?'Merma: '+fmt(loss/r.volume*100)+' %':''}</small></div></div>`;}
 async function finish(kind,r,d){
  await draftQueue;const latest=record(r.tq);if(!latest||id(latest)!==d.identity)return toast('El lote cambió. Revisa el tanque antes de finalizar.');
  if(kind==='transfer')for(const k of App.PlatformRules.inactive(d))d[k]=null;
  for(const [k,label,type]of specs[kind].flatMap(x=>x[1]))if(type==='number'&&d[k]!=null&&d[k]<0&&!/temp/i.test(k))return toast(label+' no puede ser negativo.');if(num(d.ph)!=null&&d.ph>14)return toast('El pH debe estar entre 0 y 14.');
  const start=+parseDT(d.start),end=+parseDT(d.end),volume=num(d.volume);
  if(!start||!end||!Number.isFinite(start)||!Number.isFinite(end)||end<start||start<+parseDT(r.fill))return toast('Completa inicio y fin; deben ser posteriores al llenado y estar en orden.');
  if(volume==null||volume<=0||latest.volume==null||volume>latest.volume)return toast('El volumen del contador debe ser mayor que cero y no superar el saldo disponible.');
  if(!['SI','NO'].includes(d.empty))return toast('Confirma si el tanque quedó vacío.');
  if(kind==='filter'&&App.PlatformRules.early(latest,d.start)&&!String(d.earlyReason||'').trim())return toast('La filtración inicia antes del mínimo de maduración. Registra el motivo.');
  const snapshot=clone(App.ExcelCavas.inventory());snapshot.operationEvents=snapshot.operationEvents||[];if(snapshot.operationEvents.some(e=>e.token===d.token))return toast('Este movimiento ya se registró.');
  let destination;
  if(kind==='transfer'){
   destination=record(d.destination);if(!destination||destination.tq===r.tq||destination.operation&&destination.operation!=='M')return toast('Elige un tanque libre o un SV compatible.');

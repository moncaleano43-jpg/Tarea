<script>
/* Seguimiento y proyección del proceso: observaciones, cálculos y estimaciones separados. */
(function(){
 const H=3600000,{esc,clone,parseDT,fmtS,toast}=App.U;
 const defaults={p15:.15,p75:.75,minCases:5,maxCases:30,eoTolerance:1.5,genTolerance:2,volumeTolerance:.35,nearHours:12,confidenceHigh:75,confidenceMedium:50,coldHours:{std190:190,std5:195,LIGHT:185,AZTECA:190,CLUB:200}};
 const number=v=>{const n=App.FVRegistration.num(v);return n!=null&&Number.isFinite(n)?n:null;};
 const key=v=>({S:'ESTANDAR',STD:'ESTANDAR',L:'LIGHT',Z:'AZTECA',CC:'CLUB', 'CLUB COLOMBIA':'CLUB'}[String(v||'').toUpperCase()]||String(v||'').toUpperCase());
 const duration=hours=>hours==null?'—':Math.floor(hours/24)+' días '+Math.floor(hours%24)+' h '+Math.floor((hours%1)*60)+' min';
 const fmt=v=>v==null?'—':new Intl.NumberFormat('es-CO',{maximumFractionDigits:2}).format(v),date=v=>v?fmtS(new Date(v)):'Pendiente';
 const config=()=>Object.assign({},defaults,App.S.config.tankAnalysisCriteria||{},{coldHours:Object.assign({},defaults.coldHours,App.S.config.tankAnalysisCriteria?.coldHours)});
 const canonical=v=>{const d=parseDT(v);return d&&Number.isFinite(+d)?[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')+'T'+[d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':'):'';};
 const identity=r=>['F',r.consecutive||r.lote,r.tq,canonical(r.fvRegistration?.fillEnd||r.fin||r.fill)].join('|');
 const stateKey=r=>'tankProcess_'+encodeURIComponent(identity(r));
 const state=r=>App.S.config[stateKey(r)]||{};
 const brewCount=r=>(r.fvRegistration?.brews||r.registration?.brews||[]).filter(b=>b.coc!=null||number(b.volume)>0).length;
 function profile(r){const brand=key(r.brand||r.marca),manual=state(r).profile;return manual&&manual!=='auto'?manual:brand==='ESTANDAR'?(brewCount(r)>=5?'std5':'std190'):brand;}
 function cold(r,now=Date.now()){
  const c=config(),s=state(r),start=+parseDT(r.fvRegistration?.fillEnd||r.fin||r.fill),p=profile(r),hours=c.coldHours[p]??null,source=number(+parseDT(r.fermentation?.cells?.[505]||r.cells?.[505])),real=s.coldAt?+parseDT(s.coldAt):source>0?source:null;
  const elapsed=start>0?Math.max(0,(now-start)/H):null,due=start>0&&hours!=null?start+hours*H:null,remaining=due?(due-now)/H:null;
  return {start,profile:p,hours,elapsed,due,remaining,real,status:real?'Frío registrado':due==null?'Proceso por definir':remaining<=0?'Hora de dar frío':remaining<=c.nearHours?'Próximo a dar frío':'En proceso'};
 }
 function cross(points,target){if(target==null)return null;for(let i=1;i<points.length;i++){const a=points[i-1],b=points[i];if(a.e>=target&&b.e<=target&&a.e>b.e&&b.time>a.time)return a.time+(a.e-target)/(a.e-b.e)*(b.time-a.time);}return points[0]?.e<=target?points[0].time:null;}
 const quantile=(values,p)=>{const a=values.filter(Number.isFinite).sort((a,b)=>a-b);if(!a.length)return null;const i=(a.length-1)*p,j=Math.floor(i);return a[j]+(a[Math.min(j+1,a.length-1)]-a[j])*(i-j);};
 function interpolate(points,h){for(let i=1;i<points.length;i++){const a=points[i-1],b=points[i];if(h>=a.h&&h<=b.h&&b.h>a.h)return a.e+(b.e-a.e)*(h-a.h)/(b.h-a.h);}return null;}
 function cohort(r,a){
  const cfg=config(),brand=key(r.brand||r.marca),p=profile(r),gen=number(r.fermentation?.levadura?.generacion??r.levadura?.generacion),volume=number(r.volume??r.vol),recent=a.pts.slice(-4),rows=[];
  for(const c of App.Hist2.hist()){
   if(key(c.marca)!==brand||!c.finT||c.finT>=a.fin||c.eo==null||c.el==null||c.eo<=c.el||c.pts?.length<3)continue;
   if(brand==='ESTANDAR'&&profile(c)!==p)continue;
   if(a.eo!=null&&Math.abs(a.eo-c.eo)>cfg.eoTolerance)continue;
   const g=number(c.lev?.gen??c.levadura?.generacion);if(gen!=null&&g!=null&&Math.abs(gen-g)>cfg.genTolerance)continue;
   if(volume>0&&c.vol>0&&Math.abs(volume-c.vol)/volume>cfg.volumeTolerance)continue;
   const differences=recent.map(pt=>{const e=interpolate(c.pts,(pt.time-a.fin)/H);return e==null?null:Math.abs((a.eo-pt.e)/(a.eo-a.el)-(c.eo-e)/(c.eo-c.el));}).filter(v=>v!=null);
   if(recent.length>=2&&differences.length<Math.min(2,recent.length))continue;
   const distance=differences.length?differences.reduce((x,y)=>x+y,0)/differences.length:0;
   if(distance>.18)continue;
   rows.push({record:c,distance,coverage:recent.length?differences.length/recent.length:.25});
  }
  return rows.sort((a,b)=>a.distance-b.distance).slice(0,cfg.maxCases);
 }
 function projection(cases,a,target,kind){
  if(target==null||!a.fin)return null;const cfg=config(),fraction=kind==='t0'?1:kind==='alta'?null:target,values=[],used=[];
  const currentFraction=a.valid&&a.last?(a.eo-a.last.e)/(a.eo-a.el):null;
  for(const item of cases){const c=item.record,points=c.pts.map(p=>({time:p.h*H,e:p.e}));let h;
   if(kind==='t0'){const h15=cross(points,c.eo-(c.eo-c.el)*cfg.p15),h75=cross(points,c.eo-(c.eo-c.el)*cfg.p75);if(h15==null||h75==null||h75<=h15)continue;h=(h15+(h75-h15)*(1-cfg.p15)/(cfg.p75-cfg.p15))/H;}
   else{const crossing=cross(points,kind==='alta'?target:c.eo-(c.eo-c.el)*fraction);if(crossing==null)continue;h=crossing/H;}
   let predicted=a.fin+h*H;
   if(a.last&&currentFraction!=null){const atCurrent=cross(points,c.eo-(c.eo-c.el)*currentFraction);if(atCurrent==null||h*H<atCurrent)continue;predicted=a.last.time+(h*H-atCurrent);}
   if(predicted<(a.last?.time||a.fin))continue;
   values.push(predicted);used.push(item);
  }
  if(values.length<cfg.minCases)return null;
  const mid=quantile(values,.5),lo=quantile(values,.25),hi=quantile(values,.75),duration=Math.max(H,mid-(a.last?.time||a.fin));
  const dispersion=(hi-lo)/duration,sampleFactor=Math.min(1,values.length/20),similarity=1-used.reduce((s,c)=>s+c.distance,0)/used.length/.25,coverage=a.pts.length>=2?1:a.pts.length?.7:.45;
  const confidence=Math.round(100*Math.max(0,Math.min(1,(.5+.5*sampleFactor)*Math.exp(-dispersion)*Math.max(.2,similarity)*coverage)));
  return {time:mid,lo,hi,n:values.length,confidence,level:confidence>=cfg.confidenceHigh?'alta':confidence>=cfg.confidenceMedium?'media':'baja',kind:'proyectada',historical:true,cases:used.map((x,i)=>({lote:x.record.lote,tq:x.record.tq,fin:x.record.finT,distance:x.distance,hours:(values[i]-(a.last?.time||a.fin))/H})),dispersion};
 }
 function enhance(t,a,r){
  r=r||App.Cavas.records().find(r=>r.tq===+t.tq&&r.consecutive===t.lote)||Object.assign({},t,{brand:t.marca,consecutive:t.lote,fill:t.fin});
  const cfg=config(),s=state(r);a.target15=a.valid?a.eo-(a.eo-a.el)*cfg.p15:null;a.target75=a.valid?a.eo-(a.eo-a.el)*cfg.p75:null;
  const point=(name,target,fraction)=>{const manual=s.points?.[name],date=manual?.t?+parseDT(manual.t):null,auto=cross(a.curve,target);return s.mode==='manual'&&date&&date>=a.fin&&(!manual.fraction||Math.abs(manual.fraction-fraction)<.00001)?{time:date,e:target,kind:'manual',note:manual.note||''}:auto!=null?{time:auto,e:target,kind:'automático'}:null;};
  a.at15=point('p15',a.target15,cfg.p15);a.at75=point('p75',a.target75,cfg.p75);a.t0=a.at15&&a.at75&&a.at75.time>a.at15.time?a.at15.time+(a.at75.time-a.at15.time)*(1-cfg.p15)/(cfg.p75-cfg.p15):null;
  a.processRecord=r;a.processState=s;a.cold=cold(r);a.cohort=a.valid?cohort(r,a):[];
  a.projected15=!a.at15?projection(a.cohort,a,cfg.p15,'point'):null;a.projected75=!a.at75?projection(a.cohort,a,cfg.p75,'point'):null;
  a.projectedT0=!a.t0?projection(a.cohort,a,1,'t0'):null;
  const observed=a.target!=null?cross(a.curve,a.target):null;
  if(observed!=null){a.alta={time:observed,kind:'interpolada'};a.history=null;}
  else{const historical=projection(a.cohort,a,a.target,'alta');a.alta=historical||(!a.alta?.historical?a.alta:null);a.history=historical;}
  if(!a.projectedT0&&!a.t0&&a.calc?.T?.metodo!=='marca'&&a.calc?.t0)a.projectedT0={time:+a.calc.t0,confidence:null,level:'baja',n:0,kind:'proyectada',source:'Tendencia del FV; sin respaldo histórico suficiente'};
  if(a.t0&&a.calc){a.calc=Object.assign({},a.calc,{t0:new Date(a.t0),T:Object.assign({},a.calc.T,{metodo:'curva',horas:(a.t0-a.fin)/H,pasos:[[fmt(cfg.p15*100)+' % · '+a.at15.kind,fmt((a.at15.time-a.fin)/H)+' h'],[fmt(cfg.p75*100)+' % · '+a.at75.kind,fmt((a.at75.time-a.fin)/H)+' h'],['T0 extrapolado hasta extracto límite',date(a.t0)]]})});}
  if(a.pts.length>=2){const p=a.pts.at(-2),last=a.last,slope=(last.e-p.e)/((last.time-p.time)/H);const local=target=>slope<0&&target<last.e?{time:last.time+(target-last.e)/slope*H,confidence:null,level:'baja',n:0,kind:'proyectada',source:'Tendencia local; sin suficientes referencias históricas'}:null;if(!a.at15&&!a.projected15)a.projected15=local(a.target15);if(!a.at75&&!a.projected75)a.projected75=local(a.target75);if(!a.t0&&!a.projectedT0)a.projectedT0=local(a.el);}
  return a;
 }
 async function save(r,patch,event){const previous=state(r),next=Object.assign({},previous,patch,{identity:identity(r),events:[...(previous.events||[]),...(event?[Object.assign({t:new Date().toISOString()},event)]:[])]});return App.Store.set('config',stateKey(r),next);}
 const metric=(label,value,help='')=>`<div class="fv-metric"><span>${label}</span><b>${value}</b><small>${help}</small></div>`;
 function reliability(p){return p?`<span class="process-confidence ${p.level||'baja'}">Confiabilidad ${p.confidence!=null?p.confidence+' %':'baja'} · ${p.level||'baja'}</span><small>${p.n||0} tanques históricos de referencia${p.lo?' · Rango central: '+date(p.lo)+' – '+date(p.hi):''}</small>`:'';}
 function projectedCard(label,point,projection){return '<div class="process-projection-card">'+metric(label,date(point?.time||projection?.time),point?`${point.kind} · ${fmt(point.e)} °P`:projection?`Proyectado · ${projection.n} referencias`: 'Datos insuficientes para una proyección')+(projection?`<div class="process-projection-help">${reliability(projection)}</div>`:'')+'</div>';}
 function trace(r){const t=r.fermentation||r,reg=r.fvRegistration||r.registration||{},name=reg.yeastName||t.levadura?.nombre||r.yeast,gen=t.levadura?.generacion??null;const seeds=App.ExcelCavas.data().yeasts.filter(y=>y.nombre===name).flatMap(y=>y.siembras||[]).filter(s=>s.lote===(r.consecutive||r.lote)&&+s.tq===+r.tq&&s.fecha&&+parseDT(s.fecha)<=+parseDT(reg.fillEnd||r.fin||r.fill));const sow=seeds.sort((a,b)=>+parseDT(b.fecha)-+parseDT(a.fecha))[0];return `<section class="fv-detail-section"><h2>Levadura sembrada · Trazabilidad</h2><div class="fv-metrics">${metric('Levadura',esc(name||'Sin dato'))}${metric('Colector de procedencia',esc(reg.collector??'Sin dato'))}${metric('Generación',esc(gen??'Sin dato'))}${metric('Fecha y hora de siembra',date(sow?.fecha||reg.fillStart),sow?'Registro de resiembra del Excel':reg.fillStart?'Referencia: inicio de llenado':'Sin fecha de siembra registrada')}</div>${name?`<a class="btn sm" href="#/bd" data-process-trace="${esc(name)}">Ir a trazabilidad de ${esc(name)}</a>`:''}</section>`;}
 function panel(r,a){const c=a.cold,remaining=c.remaining==null?'—':c.remaining<=0?'Objetivo alcanzado':Math.floor(c.remaining)+' h '+Math.floor((c.remaining%1)*60)+' min';return `<section class="fv-detail-section process-cold ${!c.real&&c.due&&c.remaining<=0?'due':''}"><div class="sec-h"><h2>Tiempo de fermentación y frío</h2><span class="process-status">${c.status}</span></div><div class="fv-metrics">${metric('Tiempo en fermentación','<span data-process-elapsed>'+fmt(c.elapsed)+' h · '+duration(c.elapsed)+'</span>','Desde el fin de llenado')}${metric('Hora objetivo para dar frío',date(c.due),c.hours!=null?c.hours+' horas · '+c.profile:'Configura el tipo de proceso')}${metric('Tiempo restante','<span data-process-remaining>'+remaining+'</span>')}${metric('Frío registrado',date(c.real),c.real?'Evento real registrado':'Pendiente')}</div><p class="process-alert" ${!c.real&&c.due&&c.remaining<=0?'':'hidden'}>Es hora de dar frío a este tanque.</p><div class="fv-reference"><label class="f"><span>Tipo de proceso</span><select id="processProfile" ${App.Store.canWrite?'':'disabled'}>${[['auto','Identificar automáticamente'],['std190','STD 190 hL · 190 h'],['std5','STD cinco cocimientos · 195 h'],['LIGHT','Light · 185 h'],['CLUB','Club · 200 h'],['AZTECA','Azteca · 190 h']].map(([v,l])=>`<option value="${v}" ${(state(r).profile||'auto')===v?'selected':''}>${l}</option>`).join('')}</select></label>${App.Store.canWrite?`<button class="btn pri" id="processCold">${c.real?'Revisar / corregir registro de frío':'Registrar que ya se dio frío'}</button>`:''}</div></section>${trace(r)}<section class="fv-detail-section"><div class="sec-h"><h2>Atenuaciones y proyecciones del proceso</h2>${App.Store.canWrite?'<button class="btn sm" id="processPoints">Ajustar puntos manualmente</button><button class="btn sm" id="processAuto">Usar automático</button>':''}</div><div class="process-mode"><span class="turn-pill ${state(r).mode==='manual'?'yellow':'green'}">${state(r).mode==='manual'?'Manual autorizado':'Automático · modo principal'}</span><p>Los cálculos usan las muestras reales. Los ajustes manuales requieren contraseña y conservan el historial.</p></div><div class="process-projections">${projectedCard(fmt(config().p15*100)+' % del descenso',a.at15,a.projected15)}${projectedCard(fmt(config().p75*100)+' % del descenso',a.at75,a.projected75)}${projectedCard(a.t0?'T0 calculado':'T0 proyectado',a.t0?{time:a.t0,kind:'Calculado con puntos '+(a.at15?.kind==='manual'||a.at75?.kind==='manual'?'ajustados manualmente':'automáticos'),e:a.el}:null,a.projectedT0)}</div><details><summary>Cómo se mide la confiabilidad</summary><p class="fv-helper">El porcentaje es un índice de consistencia: cantidad de referencias, dispersión del tiempo restante, similitud de la curva y cantidad de muestras actuales. No equivale a una probabilidad validada de acertar la hora. Los rangos son percentiles 25–75. Se excluyen fermentaciones posteriores al llenado de este FV.</p></details></section><section class="fv-detail-section"><h2>Alta de fermentación · Lectura predictiva</h2><div class="fv-metrics">${metric(a.alta?.kind==='proyectada'?'Alta estimada':'Cruce de alta según muestras',date(a.alta?.time),'Meta: '+fmt(a.target)+' °P')}</div>${a.alta?.kind==='proyectada'?reliability(a.alta):''}${!a.alta?'<p class="fv-helper">Aún no hay mediciones ni referencias comparables suficientes para proyectar el alta.</p>':''}</section><details class="fv-detail-section"><summary>Eventos del proceso y configuración</summary><div class="row">${App.Store.canWrite?'<button class="btn sm" id="processSettings">Configurar criterios y objetivos</button>':''}</div><ol>${(a.processState.events||[]).map(e=>`<li>${date(+parseDT(e.t))} · ${esc(e.label||e.type)} ${esc(e.note||'')}</li>`).join('')}</ol><p class="fv-helper">Los cambios y el evento de frío quedan vinculados a este lote, tanque y fecha de llenado.</p></details>`;}
 function archiveInto(snapshot,r){snapshot.fermentationArchives=snapshot.fermentationArchives||{};snapshot.fermentationArchives[identity(r)]=clone(r);}
 function chart(t,a,large=false){
  if(!a.curve.length)return '<p class="fv-helper">Registra EO y muestras para construir la curva.</p>';
  const events=[{time:a.cold?.due,label:'Objetivo frío',color:'#ff9f0a'},{time:a.cold?.real,label:'Frío real',color:'#30a46c'},{time:a.t0||a.projectedT0?.time,label:a.t0?'T0 calculado':'T0 proyectado',color:'#af52de'},{time:a.alta?.time,label:a.alta?.kind==='proyectada'?'Alta estimada':'Cruce de alta',color:'#007aff'}].filter(e=>e.time);
  const end=Math.max(a.curve.at(-1).time,...events.map(e=>e.time),a.projected75?.time||0,a.fin+H),lo=a.fin||a.curve[0].time,max=Math.max(1,a.eo||0,...a.curve.map(p=>p.e))*1.12,W=1200,HH=450,X=time=>70+(time-lo)/(end-lo)*1030,Y=e=>355-e/max*285;
  const path=points=>points.map((p,i)=>(i?'L':'M')+X(p.time).toFixed(1)+','+Y(p.e).toFixed(1)).join(' ');
  const historical=[];for(let h=0;h<=(end-lo)/H;h+=6){const values=(a.cohort||[]).map(c=>interpolate(c.record.pts,h)).filter(v=>v!=null);if(values.length>=config().minCases)historical.push({time:lo+h*H,e:values.reduce((x,y)=>x+y,0)/values.length,lo:quantile(values,.25),hi:quantile(values,.75),n:values.length});}
  const future=[a.last||a.curve.at(-1),...[a.projected15?{time:a.projected15.time,e:a.target15}:null,a.projected75?{time:a.projected75.time,e:a.target75}:null,a.projectedT0?{time:a.projectedT0.time,e:a.el}:null,a.alta?.kind==='proyectada'?{time:a.alta.time,e:a.target}:null].filter(Boolean)].sort((a,b)=>a.time-b.time);

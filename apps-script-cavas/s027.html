  const FK="inventarioLevadura:v38fil"; const FIL=()=>Object.assign({marca:"",fam:"",gen:"",per:"todo"},LS.get(FK,{})||{});

  function agrupar(rows,met,g,minN=1){ const m=new Map(); rows.forEach(r=>{ const k=gkey(r,g), v=r.v[met]; if(k==null||v==null) return; if(!m.has(k)) m.set(k,[]); m.get(k).push(v); });
    let ks=[...m.keys()]; ks.sort((a,b)=>g==="mes"||g==="gen"||g==="tq"?(+String(a).replace("-","")-+String(b).replace("-","")):String(a).localeCompare(String(b)));
    return ks.map(k=>{ const a=m.get(k); return {k,lab:glab(k,g),n:a.length,mean:mean(a),med:pc(a,.5),p10:pc(a,.1),p25:pc(a,.25),p75:pc(a,.75),p90:pc(a,.9),min:Math.min(...a),max:Math.max(...a),vals:a}; }).filter(x=>x.n>=minN); }
  function pearson(xs,ys){ const p=xs.map((x,i)=>[x,ys[i]]).filter(q=>q[0]!=null&&q[1]!=null); const n=p.length; if(n<30) return null; const mx=mean(p.map(q=>q[0])), my=mean(p.map(q=>q[1])); let sxy=0,sxx=0,syy=0; p.forEach(([x,y])=>{ sxy+=(x-mx)*(y-my); sxx+=(x-mx)**2; syy+=(y-my)**2; }); if(!sxx||!syy) return null; return {r:sxy/Math.sqrt(sxx*syy),n,m:sxy/sxx,b:my-sxy/sxx*mx}; }

  function marco(W,H,xr,yr,xt,yt,xl,yl){ const L=46,R=14,T=26,B=36, X=v=>L+(W-L-R)*(v-xr[0])/((xr[1]-xr[0])||1), Y=v=>T+(H-T-B)*(1-(v-yr[0])/((yr[1]-yr[0])||1));

  function lineSvg(series,unit,W=720,H=300,proj){ const pts=series.flatMap(s=>s.pts); if(pts.length<2) return ""; const labs=[...new Set(series.flatMap(s=>s.pts.map(p=>p.x)))].sort(), px=proj?proj.length:0, nx=labs.length+px, ys=pts.map(p=>p.y).concat((proj||[]).flatMap(p=>[p.lo,p.hi])), yr=rng(ys,.12), fr=marco(W,H,[0,nx-1||1],yr,labs.map((l,i)=>[i,mesLbl(l)]).filter((_,i)=>i%Math.ceil(labs.length/9)===0),ticks(...yr),null,unit), ix=l=>labs.indexOf(l);

    return `<svg viewBox="0 0 ${W} ${H}" class="v35-ch" role="img">${fr.g}${s}</svg>`; }
  function scatterSvg(P,xl,yl,fit,W=720,H=320){ if(P.length<10) return ""; const xr=rng(P.map(p=>p[0])), yr=rng(P.map(p=>p[1])), fr=marco(W,H,xr,yr,ticks(...xr).map(v=>[v,n1(v,Math.abs(v)<10&&v%1?1:0)]),ticks(...yr),xl,yl);
    return `<svg viewBox="0 0 ${W} ${H}" class="v35-ch" role="img">${fr.g}${P.map(p=>`<circle cx="${fr.X(p[0]).toFixed(1)}" cy="${fr.Y(p[1]).toFixed(1)}" r="3" fill="${p[2]||PAL[0]}" opacity=".5"><title>${esc(p[3]||"")} ${n1(p[0],2)} · ${n1(p[1],2)}</title></circle>`).join("")}${fit?`<line x1="${fr.X(xr[0])}" x2="${fr.X(xr[1])}" y1="${fr.Y(fit.m*xr[0]+fit.b)}" y2="${fr.Y(fit.m*xr[1]+fit.b)}" stroke="#ff375f" stroke-width="2" stroke-dasharray="6 4"/>`:""}</svg>`; }
  function histSvg(vals,unit,W=720,H=260,bins=14){ vals=vals.filter(x=>x!=null&&isFinite(x)); if(vals.length<10) return ""; const all=vals.length, c1=pc(vals,.01), c99=pc(vals,.99); vals=vals.filter(x=>x>=c1&&x<=c99); const omit=all-vals.length, lo=Math.min(...vals), hi=Math.max(...vals), w=(hi-lo)/bins||1, c=Array(bins).fill(0); vals.forEach(v=>c[Math.min(bins-1,Math.floor((v-lo)/w))]++); const my=Math.max(...c), fr=marco(W,H,[lo,hi],[0,my*1.1],ticks(lo,hi).map(v=>[v,n1(v,Math.abs(v)<10&&v%1?1:0)]),ticks(0,my*1.1,4),unit,"n"), md=pc(vals,.5);

  const barsSvg=(items,fmt)=>{ const mx=Math.max(...items.map(i=>i.v),1e-9); return `<div class="v37-bars">${items.map(i=>`<div class="v37-bar"><span>${esc(i.lab)}</span><div><i style="width:${Math.max(2,i.v/mx*100)}%;background:${i.c||PAL[0]}"></i></div><b>${fmt?fmt(i.v):n1(i.v,1)}</b>${i.sub?`<small>${esc(i.sub)}</small>`:""}</div>`).join("")}</div>`; };
  /* ---- explicación de cada gráfico: qué muestra y qué vemos ---- */
  const ex=(que,vemos)=>`<div class="v40-ex"><p><b>Qué muestra.</b> ${que}</p>${vemos?`<p><b>Qué vemos.</b> ${vemos}</p>`:""}</div>`;
  const U=(u)=>u?" "+u:"";
  function boxChart(G,unit,W,H){ const s=boxSvg(G,unit,W,H); if(!s) return ""; const S=[...G].filter(g=>g.med!=null).sort((a,b)=>a.med-b.med), lo=S[0], hi=S[S.length-1], v=[];
    if(S.length>=2){ const mm=mean(S.map(g=>g.med)), rel=Math.abs(mm)?(hi.med-lo.med)/Math.abs(mm):0; v.push(rel<.03?`las medianas son prácticamente iguales (de ${n1(lo.med,2)} a ${n1(hi.med,2)}${U(unit)})`:`la mediana más alta es la de ${esc(hi.lab)} (${n1(hi.med,2)}${U(unit)}) y la más baja la de ${esc(lo.lab)} (${n1(lo.med,2)}${U(unit)}), una diferencia de ${n1(hi.med-lo.med,2)}${U(unit)} (${n1(rel*100,0)} %)`); const vr=[...S].sort((a,b)=>(b.p90-b.p10)-(a.p90-a.p10))[0]; v.push(`donde más varían los resultados es en ${esc(vr.lab)} (el 80 % de los casos va de ${n1(vr.p10,2)} a ${n1(vr.p90,2)})`); const pocos=S.filter(g=>g.n<8); if(pocos.length) v.push(`ojo: ${pocos.map(g=>esc(g.lab)+" (n="+g.n+")").join(", ")} ${pocos.length>1?"tienen":"tiene"} pocos datos, así que su caja es menos fiable`); }
    return s+ex("Cada caja resume un grupo de fermentaciones: la caja es el 50 % central, la línea fina el 80 % de los casos y el trazo grueso la mediana (el valor típico). Sirve para comparar grupos y ver cuánto varían.",v.join("; ")+(v.length?".":"")); }
  function lineChart(series,unit,W,H,proj){ const s=lineSvg(series,unit,W,H,proj); if(!s) return ""; const v=[];
    series.slice(0,3).forEach(q=>{ const p=q.pts; if(p.length<2) return; const a=p[0], z=p[p.length-1], ch=a.y?(z.y-a.y)/Math.abs(a.y):0, mx=p.reduce((m,x)=>x.y>m.y?x:m), mn=p.reduce((m,x)=>x.y<m.y?x:m); v.push(`${series.length>1?esc(q.name)+": ":""}pasó de ${n1(a.y,2)}${U(unit)} (${mesLbl(a.x)}) a ${n1(z.y,2)}${U(unit)} (${mesLbl(z.x)}), ${Math.abs(ch)<.03?"prácticamente estable":(ch>0?"subió ":"bajó ")+n1(Math.abs(ch)*100,0)+" %"}; el máximo fue en ${mesLbl(mx.x)} (${n1(mx.y,2)}) y el mínimo en ${mesLbl(mn.x)} (${n1(mn.y,2)})`); });
    if(proj&&proj.length) v.push(`la línea punteada extiende la tendencia lineal: ${proj.map(p=>p.lab+" ≈ "+n1(p.y,2)+" (rango "+n1(p.lo,2)+"–"+n1(p.hi,2)+")").join(", ")}`);

  function scatter(P,xl,yl,fit,W,H){ const s=scatterSvg(P,xl,yl,fit,W,H); if(!s) return ""; let v; if(fit){ const a=Math.abs(fit.r); v=a<.3?`no se aprecia relación clara entre las dos medidas (r = ${n1(fit.r,2)}, n = ${fit.n}): los puntos no siguen un patrón`:`la relación es ${fuerza(fit.r)} y ${fit.r>0?"positiva: cuando una sube, la otra tiende a subir":"negativa: cuando una sube, la otra tiende a bajar"} (r = ${n1(fit.r,2)}, n = ${fit.n}); por cada +1 en el eje horizontal, el vertical cambia ≈ ${n1(fit.m,2)}`; v+=". Es una asociación observada, no prueba que una cause la otra"; } else v="hay pocos puntos para calcular una relación";

  const tabla=(head,rows)=>`<div class="v35-tbw"><table class="v32-tb"><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  const card=(t,sub,body,extra)=>`<div class="v35-card"><div class="v35-ch-h"><div><h2>${t}</h2>${sub?`<p class="v35-muted">${sub}</p>`:""}</div>${extra||""}</div>${body}</div>`;
  const nodat=m=>`<p class="v35-no">No hay suficientes datos para esto${m?": "+esc(m):""}.</p>`;

  /* ---- correlaciones e insights ---- */
  const DER=new Set(["h75|rata","alc|rdf","e72|h75","eo|e72","eo|alc","e72|alc","e72|rdf","eo|rdf","rdf|ph"]);
  const CP=["e72","h75","rata","eo","vol","tll","viab","cons","gen","alc","rdf","ph"];

    return (App.AnX&&App.AnX.agenda?App.AnX.agenda(8):"")+`<div class="v32-kp"><div><b>${info.length}</b><span>FV en proceso</span></div><div><b style="color:#248a3d">${c(0)}</b><span>Habituales</span></div><div><b style="color:#b25e00">${c(2)+c(3)}</b><span>Con matices o desviación</span></div><div><b>${c(1)}</b><span>Sin referencia suficiente</span></div></div>`
      +(desv.length?card("Desviaciones frente al histórico",`${desv.length} FV con muestras fuera de la banda habitual (P10–P90) de su marca. Cada una se explica y tiene su evidencia.`,`<div class="v35-ins">${desv.map(i=>{ const u=i.an.list[i.an.list.length-1]; return `<a class="v35-in s2" href="#/ficha/fv/${encodeURIComponent(i.a.lote)}"><i>!</i><span><b>FV ${i.a.tq} · ${esc(tit(i.a.marca))}: ${i.an.list.length} muestra${i.an.list.length>1?"s":""} fuera de lo habitual</b><small>A las ${V35().hh(u.h)} midió ${n1(u.e,2)} °P; el 80 % de los casos de ${esc(tit(i.a.marca))} está entre ${n1(u.b.p10,2)} y ${n1(u.b.p90,2)} °P a esa hora (${u.b.n} fermentaciones). Toca para ver la evidencia.</small></span></a>`; }).join("")}</div>`):card("Desviaciones frente al histórico","",`<p class="v35-ok">Ningún FV con referencia suficiente se aparta de su banda histórica.</p>`))
      +`<div class="v38-mon">${info.map(i=>`<a class="v38-mc s${i.sev}" href="#/ficha/fv/${encodeURIComponent(i.a.lote)}"><div class="h"><b>FV ${i.a.tq}</b><span>${esc(tit(i.a.marca))}</span><em>${i.estado}</em></div>${mini(i)}<div class="f"><span>${i.a.pts.length-1===1?"1 muestra":(i.a.pts.length-1)+" muestras"}</span><span>${i.ix.ok?"Índice "+i.ix.v:"—"}</span><span>${i.py.ok?"Alta ≈ "+fmtS(i.py.t).slice(0,11):i.py.alcanzada?"En alta":"Alta: sin proyección"}</span></div></a>`).join("")}</div>${ex("Cada tarjeta es un FV en proceso: la línea azul es su extracto, la banda la zona donde cae el 80 % de las fermentaciones históricas de su marca, y la línea gris punteada el gemelo histórico más parecido. El color de arriba indica su estado.",`${c(0)} habitual${c(0)===1?"":"es"}, ${c(2)} con matices, ${c(3)} fuera de lo habitual y ${c(1)} sin referencia suficiente (aún no hay muestras o curvas históricas para valorarlos).`)}`; }
  function pagina(tab,a,b,c,d,e){ tab=TABS.find(t=>t[0]===tab)?tab:"monitor"; let body;
    try{ body=tab==="monitor"?tMonitor():tab==="resumen"?tResumen():tab==="proyecciones"?tProy():tab==="tendencias"?tTend(a,null,b):tab==="levadura"?tLev():tab==="calidad"?tCal():(App.AnX&&App.AnX[tab])?App.AnX[tab](a,b,c,d,e):tCons(a,b,c,d,e); }catch(err){ console.error(err); body=nodat(err.message); }
    return `<div class="v35-pg v37-pg"><div class="page-h"><div><h1>Analista de datos</h1><p>Proyecciones, tendencias, comparaciones y relaciones calculadas con las ${DS().length} fermentaciones reales del Excel y lo que está en proceso hoy. Todo sale de datos; si falta información, lo dice.</p></div><span class="v37-hb"><a class="btn sm ghost" href="#/analisis">Altas, calendario y capacidad →</a><button class="btn sm" id="v37x">Exportar datos a Excel</button></span></div>${slicers(tab)}<div class="v31-seg">${TABS.map(([k,l])=>`<a href="#/analista/${k}" class="${k===tab?"on":""}">${l}</a>`).join("")}</div>${body}<p class="v35-foot">Fuente: hojas B.D FERMENTACIÓN y ESPECIFICACIONES MARCA del Excel CONTROL PROCESO CAVAS. Medianas y percentiles; las proyecciones son orientativas.</p></div>`; }
  App.V.analista={ render(...a){ return pagina(...a); },
    mount(tab,a,b,c,d,e){ tab=TABS.find(t=>t[0]===tab)?tab:"monitor"; bindFil(); if(App.AnX&&App.AnX.mount) App.AnX.mount(tab,a,b,c,d,e); const go=p=>{ location.hash="#/analista/"+p.map(encodeURIComponent).join("/"); };
      if(tab==="tendencias"){ const m=$("#v37m"), k=$("#v37k"); const f=()=>{ LS.set("inventarioLevadura:v37m",m.value); go(["tendencias",m.value,k.value]); }; m&&(m.onchange=f); k&&(k.onchange=f); }
      if(tab==="constructor"){ const ids=["a","b","g","t","k"], f=()=>{ const v=Object.fromEntries(ids.map(i=>[i,$("#v37"+i)?$("#v37"+i).value:""])); go(["constructor",v.a,v.b||"h75",v.g||"marca",v.t,v.k]); }; ids.forEach(i=>{ const el=$("#v37"+i); if(el) el.onchange=f; }); }
      const x=$("#v37x"); if(x) x.onclick=()=>{ const R=DS(); const hojas=[{nombre:"Datos",titulo:"Dataset de fermentaciones",sub:"Fuente: CONTROL PROCESO CAVAS · "+App.Excel35.stamp(),cols:[{h:"Lote"},{h:"Marca"},{h:"Mes"},{h:"Familia"}].concat(MET.map(m=>({h:m[1]+(m[2]?" ("+m[2]+")":""),t:"n"}))),rows:R.map(r=>[r.h.lote,r.marca,r.mes,r.fam].concat(MET.map(m=>r.v[m[0]])))}];
        const L=window._v37last; if(tab==="constructor"&&L&&L.tipo!=="dispersion"&&L.tipo!=="hist"){ const G=agrupar(L.rows,L.a,L.g,1); hojas.unshift({nombre:"Gráfico actual",titulo:MM[L.a][1]+" por "+L.g,sub:"",cols:[{h:"Grupo"},{h:"n",t:"i"},{h:"Mediana",t:"n"},{h:"Promedio",t:"n"},{h:"P10",t:"n"},{h:"P90",t:"n"}],rows:G.map(g=>[g.lab,g.n,g.med,g.mean,g.p10,g.p90])}); }
        App.Excel35.excel(`analista_${App.Excel35.stamp()}.xlsx`,hojas); }; } };

  App.An={DS,FR,agrupar,MET,MM,boxChart,lineChart,barsH,card,tabla,pearson,fuerza,mean,pc,sd,n1,PAL,sel,mesLbl,hallazgos,correl,marcasH,nodat,famDe,histChart,scatter,mes:mesLbl};
  /* ---- Análisis / Inicio apuntan al analista ---- */
  document.addEventListener("click",()=>{},true);
  const _nav=document.getElementById("nav"); /* menú se parchea en build */

  /* ---- Cifra: gráficos y analista ---- */
  const MK={e72:/(extracto|e\.?a\.?)\s*(a\s*)?72|e72/,h75:/75|horas.*atenuacion/,rata:/\brata\b/,viab:/viabilidad/,cons:/consistencia/,alc:/alcohol/,rdf:/\brdf\b|atenuacion real/,ph:/\bph\b/,vol:/volumen/,eo:/\be\.?o\b|extracto original|mosto/,tA:/hasta (la )?alta|tiempo.*alta/,tll:/llenado/};
  const metDe=q=>Object.keys(MK).find(k=>MK[k].test(q));
  const prev=App.BotDirecto; const row=(l,h)=>`<div class="ans-r"><em>${esc(l)}</em><span>${h}</span></div>`;
  App.BotDirecto=function(texto,env){ try{ const q=nrm(texto);
      if(/^(abre |abrir |ir al |ve al |muestrame el )?(analista|panel de analisis|analista de datos)$/.test(q)) return {h:`<div class="ans"><div class="ans-h">Panel del analista</div><div class="ans-s">Proyecciones, tendencias, levadura, calidad y un constructor libre de gráficos.</div><a class="ans-ver" href="#/analista">Abrir el analista ›</a></div>`,opts:[{label:"Gráfica de la rata por mes",q:"grafica de la rata por mes"},{label:"Qué relaciones hay entre los datos",q:"que correlaciones hay"}],directo:true};
      if(/(correlacion|correlaciones|relaciones entre|que se relaciona|que influye)/.test(q)){ const C=correl(DS()).slice(0,5); if(!C.length) return {h:`<div class="ans"><div class="ans-h">No hay suficientes datos</div><div class="ans-s">No encontré relaciones de al menos moderada intensidad con 30 o más fermentaciones.</div></div>`,directo:true}; return {h:`<div class="ans"><div class="ans-h">Relaciones que encontré</div><div class="ans-s">Asociaciones observadas en ${DS().length} fermentaciones; no prueban causa.</div>${C.map(c=>row(MM[c.a][1]+" ↔ "+MM[c.b][1],`${fuerza(c.r)} ${c.r>0?"positiva":"negativa"} (r=${n1(c.r,2)}) · <a href="#/analista/constructor/${c.a}/${c.b}/marca/dispersion/">ver gráfico</a>`)).join("")}<a class="ans-ver" href="#/analista/levadura">Abrir el analista ›</a></div>`,directo:true}; }
      if(/(grafica|grafico|graficame|tendencia|evolucion|como ha cambiado|como ha ido|distribucion)/.test(q)){ const met=metDe(q)||"e72", M=MM[met], mkId=marcasH().find(id=>new RegExp("(^|\\s)"+nrm(id)+"(\\s|$)").test(q))||(/\bclub\b/.test(q)?"CLUB COLOMBIA":""), rows=DS().filter(r=>!mkId||r.marca===mkId), G=agrupar(rows,met,"mes",3);
        if(/distribucion/.test(q)){ const ch=histChart(rows.map(r=>r.v[met]),M[2],520,200); return {h:`<div class="ans"><div class="ans-h">${esc(M[1])}${mkId?" · "+esc(tit(mkId)):""}</div>${ch?`<div class="v35-bc">${ch}</div>`:`<div class="ans-s">No hay suficientes datos.</div>`}<a class="ans-ver" href="#/analista/constructor/${met}/${met}/mes/hist/${encodeURIComponent(mkId)}">Abrir en el constructor ›</a></div>`,directo:true}; }
        if(G.length<2) return {h:`<div class="ans"><div class="ans-h">No hay suficientes datos</div><div class="ans-s">Necesito al menos 2 meses con 3 fermentaciones para dibujar la tendencia de ${esc(M[1].toLowerCase())}${mkId?" de "+esc(tit(mkId)):""}.</div></div>`,directo:true};
        const first=G[0], last=G[G.length-1];
        return {h:`<div class="ans"><div class="ans-h">${esc(M[1])} por mes${mkId?" · "+esc(tit(mkId)):""}</div><div class="v35-bc">${lineChart([{name:M[1],pts:G.map(x=>({x:x.k,y:x.med,n:x.n}))}],M[2],520,210)}</div>${row("Último mes",`${n1(last.med,2)} ${M[2]} <small>(${last.lab}, n=${last.n})</small>`)}${row("Primer mes",`${n1(first.med,2)} ${M[2]} <small>(${first.lab}, n=${first.n})</small>`)}<div class="ans-n">Mediana mensual de fermentaciones reales.</div><a class="ans-ver" href="#/analista/tendencias/${met}/${encodeURIComponent(mkId)}">Ver con proyección en el analista ›</a></div>`,opts:["Qué correlaciones hay","Analista"],directo:true}; }
    }catch(e){ console.error("v37 bot",e); } return prev(texto,env); };
  setTimeout(()=>{ try{ App.render&&App.render(true); }catch(e){} },0);
})();

</script>

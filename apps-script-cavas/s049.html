<script>
/* Experiencia operativa: tema compartido, lectura progresiva y controles autorizados. */
(function(){
 const {esc,clone,parseDT,toast}=App.U,H=3600000,n=App.FVRegistration.num;
 const fmt=v=>v==null?'—':new Intl.NumberFormat('es-CO',{maximumFractionDigits:2}).format(v),date=v=>v?App.U.fmtS(new Date(v)):'Pendiente';
 async function authorize(action){const data=await App.UI.form({title:'Autorizar cambio',intro:esc(action)+'. Se requiere la contraseña existente para este cambio.',fields:[{k:'password',l:'Contraseña de autorización',t:'pwd',req:true}],ok:'Autorizar',validate:v=>App.Sec.verificar(v.password)?null:'La contraseña no es correcta.'});if(!data)return false;await App.Sec.auditar(action,null,null,'Autorización para editar atenuaciones / proyecciones');return true;}
 function tankSvg(amount,kind='F',color='var(--vessel-liquid)'){const qty=typeof amount==='boolean'?(amount?2:0):Math.max(0,Math.min(2,+amount||0));return App.V31.vaso(qty,color,'studio-'+kind).replace('class="avessel"','class="studio-vessel"');}
 function collectorVisual(nc){const rows=App.CollectorFlow.occupied(nc),times=rows.map(x=>App.CollectorFlow.timing(x.c)),decision=(App.S.config['collectorFlow_'+nc]||{}).decision||'normal',late=times.some(x=>x.color==='red'),soon=times.some(x=>x.color==='yellow'),healthy=times.length>0&&times.every(x=>x.color==='green');let status=decision==='recover'?'recover':decision==='discard'?'discard':late?'late':soon?'soon':healthy?'healthy':'neutral';const colors={late:'#d94343',recover:'#2684df',discard:'#8254c7',soon:'#dfa600',healthy:'#258b57',neutral:'#90939a'};return {status,color:colors[status]};}
 function reliability(r){const a=App.FVDetail.analyze(App.FVDetail.model(r),r),p=a.alta;return `<section class="studio-reliability"><span>Hora de alta</span><b>${date(p?.time)}</b><span class="turn-pill ${p?.kind==='interpolada'?'green':p?.level==='alta'?'green':p?'yellow':'neutral'}">${p?.kind==='interpolada'?'Cruce según muestras':p?.confidence!=null?'Índice de consistencia '+p.confidence+' %':'Sin índice histórico suficiente'}</span><small>${p?.kind==='interpolada'?'Fecha interpolada entre mediciones reales.':p?.n?p.n+' referencias · rango '+date(p.lo)+' – '+date(p.hi):'Completa muestras y compara históricos antes de usar la hora como referencia.'}</small><small>El índice describe respaldo histórico; no es una probabilidad validada de acertar.</small></section>`;}
 const fv=App.V.fv;App.V.fv=Object.assign({},fv,{render(action,tq){const html=fv.render(action,tq);if(action!=='detalle')return html;const r=App.Cavas.records().find(x=>x.tq===+tq&&x.operation==='F');return r?html.replace('</header>','</header>'+reliability(r)):html;},mount(...args){fv.mount?.apply(fv,args);const capture=document.querySelector('.lab-capture');if(capture){capture.classList.add('studio-lab-capture');const s=capture.querySelector('summary');s.innerHTML='<span class="capture-symbol">＋</span><span><b>Registrar análisis de laboratorio</b><small>Una muestra, sus resultados y observaciones</small></span><i>⌄</i>';}}});
 let tankMode=localStorage.getItem('cavas:tankView')||'cards';const tanks=App.V.tanques;function setTankMode(){const list=document.getElementById('cavasList');if(list)list.classList.toggle('studio-tank-list',tankMode==='list');document.querySelectorAll('[data-studio-tank-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.studioTankView===tankMode));}
 App.V.tanques=Object.assign({},tanks,{render(...args){return tanks.render.apply(tanks,args).replace('<div id="cavasList">',`<div class="view-switch tank-view-toggle"><button data-studio-tank-view="cards" aria-pressed="${tankMode==='cards'}">▦ Tarjetas</button><button data-studio-tank-view="list" aria-pressed="${tankMode==='list'}">☰ Lista</button></div><div id="cavasList" class="${tankMode==='list'?'studio-tank-list':''}">`);},mount(...args){tanks.mount.apply(tanks,args);document.querySelectorAll('[data-studio-tank-view]').forEach(b=>b.onclick=()=>{tankMode=b.dataset.studioTankView;localStorage.setItem('cavas:tankView',tankMode);setTankMode();});document.getElementById('cavasSearch')?.addEventListener('input',setTankMode);setTankMode();}});
 const generationSettings=()=>Object.assign({propagationHours:null,sowingIntervalHours:null},App.S.config.generationPlanning||{});
 function generations(){const items=[];for(const r of App.Cavas.records().filter(x=>x.operation==='F')){const y=r.fermentation?.levadura||{},name=y.nombre||r.yeast,gen=n(y.generacion??r.fvRegistration?.generation);if(name)items.push({name,gen,place:'FV '+r.tq,entered:r.fvRegistration?.fillEnd||r.fill,volume:r.volume,family:App.Traza?.origen(name)?.familia||String(name).replace(/^\(P\)\s*/,'').match(/^[A-Z]+/)?.[0]||r.brand});}for(const nc of [1,2,3,4,5,6]){const occupied=App.CollectorFlow.occupied(nc);if(!occupied.length)continue;const c=occupied[0].c;items.push({name:c.nombre,gen:n(c.generacion),place:'C'+nc,entered:c.ingreso||c.finRemocion||c.retiro,volume:occupied.reduce((v,x)=>v+(x.c.vol||0),0),family:c.familia||String(c.nombre).replace(/^\(P\)\s*/,'').match(/^[A-Z]+/)?.[0]||c.marca});}const groups=Object.values(items.reduce((m,x)=>{const g=m[x.family]||(m[x.family]={family:x.family,items:[]});g.items.push(x);return m;},{})),cfg=generationSettings();for(const g of groups){const known=g.items.filter(x=>x.gen!=null);g.max=known.length?Math.max(...known.map(x=>x.gen)):null;g.color=g.max>10?'red':g.max>=7?'yellow':g.max!=null?'green':'neutral';g.remaining=g.max!=null?Math.max(0,7-g.max):null;g.lead=cfg.propagationHours>0&&cfg.sowingIntervalHours>0?Math.max(0,g.remaining*cfg.sowingIntervalHours-cfg.propagationHours):null;const times=known.filter(x=>x.gen===g.max).map(x=>+parseDT(x.entered)).filter(x=>Number.isFinite(x)&&x>0);g.anchor=times.length?Math.max(...times):null;g.start=g.anchor&&cfg.propagationHours>0&&cfg.sowingIntervalHours>0?g.anchor+(g.remaining*cfg.sowingIntervalHours-cfg.propagationHours)*H:null;g.lead=g.start!=null?Math.max(0,(g.start-Date.now())/H):null;g.concentration=known.length?known.filter(x=>x.gen>=8).length/known.length*100:null;}return {items,groups,cfg};}
 function generationPanel(){const g=generations();return `<section class="studio-section"><div class="sec-h"><div><span class="studio-kicker">RENOVACIÓN DE LEVADURA</span><h2>Generaciones en uso.</h2></div><button class="btn" id="generationConfig">Configurar planificación</button></div><p>Hasta generación 7: preferida. Generaciones 8–10: revisar y planificar renovación. Más de 10: fuera del máximo indicado.</p><div class="generation-grid">${g.groups.map(x=>`<article class="generation-card"><div class="sec-h"><h3>Familia ${esc(x.family)}</h3><span class="turn-pill ${x.color}">${x.max==null?'Sin generación':x.max>10?'Fuera de máximo':x.max>=8?'Generaciones altas':x.max===7?'Preparar renovación':'En rango preferido'}</span></div><b class="generation-number">${x.max==null?'—':'G'+x.max}</b><p>${x.items.length} ubicaciones · ${fmt(x.concentration)} % con generación 8 o superior</p><div class="generation-scale">${Array.from({length:10},(_,i)=>`<span class="${i<7?'green':'yellow'} ${x.max===i+1?'current':''}">${i+1}</span>`).join('')}</div><h4>${x.max>=7||x.start&&x.start<=Date.now()?'Iniciar o confirmar propagación ahora':x.start?'Inicio de propagación recomendado: '+date(x.start):'Configura tiempos para estimar el inicio'}</h4><small>${x.lead!=null?'Modelo conservador: fecha del lote de mayor generación, intervalo entre siembras y duración de propagación. No reemplaza el plan de producción.':'Faltan duración de propagación e intervalo de siembras. No se inventa una fecha.'}</small><details><summary>Ver levaduras y ubicaciones</summary>${x.items.map(i=>`<p>${esc(i.place)} · ${esc(i.name)} · G${i.gen??'—'}</p>`).join('')}</details></article>`).join('')}</div></section>`;}
 async function configureGenerations(){const d=await App.UI.form({title:'Planificación de propagación',intro:'El objetivo es renovar antes de trabajar con varias generaciones 8 o superiores.',fields:[{k:'propagationHours',l:'Tiempo completo de propagación (h)',t:'n',req:true},{k:'sowingIntervalHours',l:'Intervalo típico entre siembras de la misma familia (h)',t:'n',req:true}],values:generationSettings(),validate:v=>!(v.propagationHours>0&&v.sowingIntervalHours>0)?'Ambos tiempos deben ser mayores que cero.':null});if(d&&await App.Store.set('config','generationPlanning',d))App.render(true);}
 const collectors=App.V.colectores;App.V.colectores=Object.assign({},collectors,{render(...args){let html=collectors.render.apply(this,args);return html.replace(/<span class="flow-vessel">[\s\S]*?<\/span>/g,'').replace(/(<button class="flow-collector[^>]*data-flow-collector="(\d+)"[^>]*>)/g,(full,start,nc)=>{const qty=App.CollectorFlow.occupied(+nc).length,v=collectorVisual(+nc);return start.replace(/>$/,` data-vessel-status="${v.status}" style="--collector-status:${v.color}">`)+tankSvg(qty,'C'+nc,v.color);});},mount(...args){collectors.mount?.apply(this,args);}});
 const lev=App.V.levaduras;App.V.levaduras=Object.assign({},lev,{render(...args){let html=lev.render.apply(lev,args);html=html.replace(/<span class="flow-vessel">[\s\S]*?<\/span>/g,'').replace(/(<button class="flow-collector[^>]*data-flow-collector="(\d+)"[^>]*>)/g,(full,start,nc)=>{const qty=App.CollectorFlow.occupied(+nc).length,v=collectorVisual(+nc),tag=start.replace(/>$/,` data-vessel-status="${v.status}" style="--collector-status:${v.color}">`);return tag+tankSvg(qty,'C'+nc,v.color);});return html+generationPanel();},mount(...args){lev.mount.apply(lev,args);document.querySelectorAll('[data-flow-harvest]').forEach(b=>{const card=b.closest('article'),tq=+b.dataset.flowHarvest,r=App.Cavas.records().find(x=>x.tq===tq);if(!r||!card)return;const a=App.FVDetail.analyze(App.FVDetail.model(r),r),h=App.TankOperations.harvest(r,a);card.classList.add('studio-harvest-card');const block=document.createElement('div');block.className='harvest-context';block.innerHTML=`<div class="harvest-traffic" role="img" aria-label="${esc(h.label)}">${['green','yellow','red'].map(c=>`<i class="${c} ${h.color===c?'on':''}"></i>`).join('')}</div><div class="harvest-times"><span>T0 <b>${date(a.t0)}</b></span><span>Recomendado +12 h <b>${date(a.t0?a.t0+12*H:null)}</b></span><span>Máximo +24 h <b>${date(a.t0?a.t0+24*H:null)}</b></span><span>Extracto actual <b>${fmt(a.last?.e)} °P</b></span></div>`;card.insertBefore(block,card.lastElementChild);});document.getElementById('generationConfig')?.addEventListener('click',configureGenerations);}});
 function home(){const rs=App.Cavas.records(),alerts=App.PlatformFinish.alerts(),count=x=>rs.filter(r=>r.operation===x).length;const shortcuts=[['tanques','Tanques','tank'],['levaduras','Levaduras','yeast'],['aseos','Aseos','water'],['recuperacion','Recuperación','yeast'],['programa','Trasiegos','tank'],['merma','Merma','chart'],['analisis','Análisis','chart'],['bd','Datos','db']];return `<div class="studio-page studio-home"><header class="studio-home-hero"><h1>Cavas.<span> Todo tu proceso,<br>en una sola mirada.</span></h1><div><p>${count('F')} fermentadores · ${count('M')} maduradores</p><a href="#/analisis">Explorar el análisis del proceso ↗</a><a href="#/tanques">${count(null)} tanques disponibles ↗</a></div></header><nav class="studio-shortcuts">${shortcuts.map(([route,label,icon])=>`<a href="#/${route}"><span>${App.C.icon(['water','chart'].includes(icon)?'db':icon)}</span><b>${label}</b></a>`).join('')}</nav><section class="studio-home-section"><h2>Tu turno.<span> Lo que necesita atención ahora.</span></h2><div class="studio-home-rail"><a class="studio-home-card blue" href="#/tanques"><span>OPERACIÓN EN VIVO</span><h3>${rs.filter(r=>r.operation).length} tanques en proceso.</h3><p>Prioridades claras, registros por turno y trazabilidad de cada lote.</p>${tankSvg(true,'home')}<b>Abrir tanques →</b></a><a class="studio-home-card" href="#/alertas"><span>PRIORIDADES</span><h3>${alerts.length} tareas para revisar.</h3><p>${esc(alerts[0]?.label||'Consulta el estado de los procesos.')}</p><div class="studio-big-number">${alerts.filter(x=>x.color==='red').length}<small>en rojo</small></div><b>Consultar alertas →</b></a><a class="studio-home-card violet" href="#/analisis"><span>ANÁLISIS DEL PROCESO</span><h3>Encuentra dónde puedes mejorar.</h3><p>Agua, merma y comportamiento de los tanques con datos y referencias visibles.</p><svg viewBox="0 0 260 140" aria-hidden="true"><path d="M0 100Q40 130 80 80T160 70T260 20" fill="none" stroke="currentColor" stroke-width="5"/><path d="M0 125Q40 95 80 115T160 80T260 65" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="3"/></svg><b>Explorar análisis →</b></a></div></section><section class="studio-home-section"><h2>Decisiones con respaldo.<span> Del registro a la mejora.</span></h2><div class="studio-pair-cards"><a class="studio-editorial" href="#/merma"><span>MERMA</span><h3>Un balance claro.<br>Una pérdida explicada.</h3><p>Distingue purgas documentadas, diferencias pendientes y balances finales.</p><b>Ver merma →</b></a><a class="studio-editorial" href="#/analisis"><span>AGUA</span><h3>Mide mejor.<br>Consume con criterio.</h3><p>Separa contadores reales de enjuagues estimados para detectar oportunidades.</p><b>Analizar agua →</b></a></div></section></div>`;}
 App.V.inicio={render:home,mount(){}};
 const plant=App.V.pantalla;App.V.pantalla={render(){const rows=App.Cavas.records();return `<div class="studio-page plant-studio"><header class="studio-heading"><span class="studio-kicker">PANTALLA DE PLANTA</span><h1>El proceso.<span> A la vista.</span></h1><div class="studio-actions"><span id="studioClock">${date(Date.now())}</span><button class="btn" id="plantFullscreen">Pantalla completa</button></div></header><div class="plant-legend"><span>● Fermentación</span><span>● Maduración</span><span>○ Disponible</span><span>Rojo: urgente · amarillo: revisar · verde: en tiempo</span></div><div class="studio-plant-grid">${rows.map(r=>{const task=r.operation?App.TankOperations.tasks(r)[0]:null;return `<a class="studio-plant-tank ${r.operation==='F'?'fermentation':r.operation==='M'?'maturation':'free'} ${task?.color||''}" href="#/${r.operation==='F'?'fv/detalle/'+r.tq:r.operation==='M'?'sv/detalle/'+r.tq:'tanques/todos'}"><div><b>UTQ ${r.tq}</b><span class="turn-pill ${task?.color||'neutral'}">${r.operation==='F'?'FV':r.operation==='M'?'SV':'Libre'}</span></div><h3>${esc(r.consecutive||'Disponible')}</h3><p>${esc(r.brand||'Fermentación / maduración')}</p><b>${fmt(r.volume)} <small>Hl</small></b><footer><span class="turn-dot ${task?.color||''}"></span>${esc(task?.label||'Disponible para el siguiente proceso')}</footer></a>`;}).join('')}</div></div>`;},mount(){document.getElementById('plantFullscreen').onclick=()=>document.documentElement.requestFullscreen?.();}};
 function showAlerts(){const rows=App.PlatformFinish.alerts();const d=App.UI.info('Alertas del proceso',`<div class="floating-alert-summary"><b>${rows.length}</b><span>tareas requieren revisión</span><a href="#/alertas" data-close-studio>Ver todas →</a></div><div class="studio-floating-alerts">${rows.slice(0,15).map(t=>`<a href="#/${t.r.operation==='F'?'fv':'sv'}/detalle/${t.r.tq}" data-close-studio><span class="turn-pill ${t.color}">${t.r.operation==='F'?'FV':'SV'} ${t.r.tq}</span><div><b>${esc(t.label)}</b><small>${esc(t.r.consecutive)} · ${esc(t.help)}</small></div></a>`).join('')||'<p>No hay tareas vencidas.</p>'}</div>`,{wide:false});d.classList.add('studio-floating-alert-dialog');d.querySelectorAll('[data-close-studio]').forEach(a=>a.onclick=()=>d.close());}
 function search(){if(document.getElementById('studioSearchDialog'))return;const d=App.UI.info('Buscar en Cavas',`<label class="studio-search-field">${App.C.icon('search')}<input id="studioSearchInput" autocomplete="off" placeholder="Buscar tanque, lote, levadura o equipo…" aria-label="Buscar en Cavas"></label><div id="studioSearchResults"><h3>Accesos rápidos</h3>${[['tanques','Tanques'],['levaduras','Colectores y cosechas'],['aseos','Aseos y CIP'],['analisis','Agua, merma y proyecciones'],['bd','Base de datos']].map(([url,l])=>`<a href="#/${url}">→ ${l}</a>`).join('')}</div>`,{wide:true});d.id='studioSearchDialog';d.classList.add('studio-search-dialog');const results=d.querySelector('#studioSearchResults'),input=d.querySelector('input');function wire(){results.querySelectorAll('a').forEach(a=>a.onclick=()=>d.close());}wire();input.oninput=()=>{const q=input.value.trim().toLowerCase(),tanks=App.Cavas.records().filter(r=>q&&[r.tq,r.consecutive,r.brand,r.yeast].join(' ').toLowerCase().includes(q)),collectors=[1,2,3,4,5,6].flatMap(App.CollectorFlow.occupied).filter(x=>q&&[x.pos,x.c.nombre,x.c.marca].join(' ').toLowerCase().includes(q));results.innerHTML=`<h3>Resultados</h3>${tanks.slice(0,12).map(r=>`<a href="#/${r.operation==='F'?'fv/detalle/'+r.tq:r.operation==='M'?'sv/detalle/'+r.tq:'tanques/todos'}">→ UTQ ${r.tq} · ${esc(r.consecutive||'Libre')} · ${esc(r.brand||'')}</a>`).join('')}${collectors.slice(0,6).map(x=>`<a href="#/levaduras">→ ${esc(x.pos.toUpperCase())} · ${esc(x.c.nombre)}</a>`).join('')}${!tanks.length&&!collectors.length?'<p>Sin coincidencias. Prueba con el número del tanque, lote o levadura.</p>':''}`;wire();};setTimeout(()=>input.focus(),20);}
 const extraRoutes=[['agua','Consumo de agua'],['aseos','Aseos'],['recuperacion','Recuperación de cerveza'],['programa','Programa de trasiego'],['merma','Merma'],['analisis','Análisis de datos'],['analista','Analista de fermentación'],['comparar','Comparar'],['historico','Histórico de fermentación'],['config','Configuración']];
 function topbar(){const bell=document.getElementById('v31Bell');if(bell){bell.onclick=e=>{e.preventDefault();e.stopPropagation();showAlerts();};bell.setAttribute('aria-label','Abrir ventana de alertas');}const box=document.querySelector('.topbar .gsearch .box');if(box&&!box.dataset.studioSearch){box.dataset.studioSearch='true';box.classList.add('studio-search-trigger');box.setAttribute('role','button');box.setAttribute('tabindex','0');box.setAttribute('aria-label','Buscar');box.onclick=e=>{e.preventDefault();e.stopPropagation();search();};box.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();search();}};box.querySelector('input')?.setAttribute('tabindex','-1');}const nav=document.querySelector('.topbar .anav');if(nav&&!nav.querySelector('[data-studio-menu]')){const b=document.createElement('button');b.className='studio-more';b.dataset.studioMenu='true';b.textContent='Operación y análisis⌄';b.onclick=()=>{const d=App.UI.info('Operación y análisis',`<nav class="studio-module-menu">${extraRoutes.map(([route,label])=>`<a href="#/${route}"><b>${label}</b><span>→</span></a>`).join('')}</nav>`);d.querySelectorAll('a').forEach(a=>a.onclick=()=>d.close());};nav.appendChild(b);}}
 document.addEventListener('click',()=>setTimeout(topbar,5));document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();search();}});setInterval(()=>{topbar();const clock=document.getElementById('studioClock');if(clock)clock.textContent=date(Date.now());},30000);setTimeout(topbar,350);
 App.ControlStudio={authorize,tankSvg,reliability,generations,showAlerts,search};
})();

</script>

<style>

/* HISTORIAL V17 — bitácora enfocada, con filtros claros */
.hist-overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 16px}
.hist-overview-card{display:flex;align-items:center;gap:12px;min-width:0;padding:13px 15px;border:1px solid var(--line);border-radius:15px;background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;transition:border-color .15s,transform .15s,background .15s}
.hist-overview-card:hover{transform:translateY(-1px);border-color:var(--accent)}.hist-overview-card.is-active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.hist-overview-card b{display:block;font-size:1.22rem;font-variant-numeric:tabular-nums}.hist-overview-card small{display:block;color:var(--muted);font-size:.72rem;margin-top:1px}
.hist-overview-icon{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);font-size:1.15rem;font-weight:800}
.hist-overview-icon.harvest{color:#44ce83;background:color-mix(in srgb,#44ce83 13%,transparent)}.hist-overview-icon.sowing{color:#56a8ff;background:color-mix(in srgb,#56a8ff 13%,transparent)}.hist-overview-icon.discard{color:#ff7474;background:color-mix(in srgb,#ff7474 13%,transparent)}
.hist-tools{padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-bottom:18px}
.hist-search-row{display:flex;gap:10px;align-items:center}.hist-search{flex:1;max-width:none}.hist-clear{white-space:nowrap}.hist-clear:disabled{opacity:.45;cursor:default}
.hist-advanced{margin-top:10px;border-top:1px solid var(--line-2);padding-top:9px}.hist-advanced summary{display:flex;align-items:center;gap:9px;cursor:pointer;list-style:none;font-size:.78rem;font-weight:700;color:var(--ink)}.hist-advanced summary::-webkit-details-marker{display:none}.hist-advanced summary:after{content:"＋";margin-left:auto;color:var(--accent)}.hist-advanced[open] summary:after{content:"−"}.hist-advanced summary span{font-weight:400;color:var(--muted)}
.hist-advanced .hist-filters{padding:12px 0 2px}.hist-advanced .sortsel{min-width:130px}
.hist-type-filters{display:flex;gap:7px;overflow:auto;padding:12px 0 1px;scrollbar-width:thin}.hist-type-btn{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;font-size:.75rem;font-weight:650;cursor:pointer}.hist-type-btn span{font-size:.67rem;opacity:.78}.hist-type-btn.active{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.hist-list-heading{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:0 2px 8px}.hist-list-heading h2{font-size:1.04rem;margin:0}.hist-list-heading p{margin:3px 0 0;color:var(--muted);font-size:.76rem}.hist-visible-count{font-size:.72rem;color:var(--muted)}
.hist[aria-label="Bitácora"]{padding-top:12px}.hist[aria-label="Bitácora"] .day{position:sticky;top:74px;z-index:2;padding:8px 10px;margin:12px 0 4px;border-radius:9px;background:var(--surface-2);font-size:.76rem;color:var(--muted);text-transform:capitalize}.hist[aria-label="Bitácora"] .tl{margin-top:0}.hist[aria-label="Bitácora"] .tl li.hist-click{min-height:56px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line-2)}.hist[aria-label="Bitácora"] .tl li.hist-click .ic{flex:none}.hist[aria-label="Bitácora"] .tl li.hist-click .m{display:flex;flex-direction:column;gap:3px;min-width:0}.hist[aria-label="Bitácora"] .tl li.hist-click .m b{font-size:.84rem}.hist[aria-label="Bitácora"] .tl li.hist-click .m span{font-size:.74rem;color:var(--muted)}.hist[aria-label="Bitácora"] .tl li.hist-click time{margin-left:auto;font-size:.75rem}

</style>

<script>

/* v41 — Posibles factores, simulador de alta, notas por FV y reporte del FV. */
(function(){
  if(!window.App||!App.V35||!App.Bot35||!App.Hist2) return;
  const {esc,fmtS,f}=App.U, H2=App.Hist2, V=App.V35, B35=App.Bot35, E=encodeURIComponent, hh=V.hh, n1=V.n1, $=(s,r=document)=>r.querySelector(s);
  const tit=s=>String(s||"").toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());
  const nrm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9\s.,]/g," ").replace(/\s+/g," ").trim();
  const ex=(q,v)=>V.exH(q,v);

  /* ---- factores ---- */
  function factoresHTML(a){ if(a.hist) return ""; const F=H2.factores(a);
    const body=!F.ok?`<p class="v35-no">${esc(F.motivo)}</p>`:F.list.length?`<ul class="v41-fac">${F.list.map(x=>`<li class="${x.retrasa?"slow":"fast"}"><b>${esc(x.nom)}: ${n1(x.v,2)}${x.u}</b><span>está en el percentil ${x.rank} de ${esc(tit(a.marca))} (mediana ${n1(x.med,2)}${x.u}). En el histórico, valores así ${x.retrasa?"se asocian con fermentaciones más lentas":"se asocian con fermentaciones más rápidas"} (r = ${n1(x.r,2)}, n = ${x.n}).</span></li>`).join("")}</ul>`:`<p class="v35-ok">Ningún dato de este FV se aparta de lo habitual en un factor que, en el histórico, se relacione con la velocidad.</p>`;
    return `<div class="v35-box wide"><h3>Posibles factores</h3>${body}${ex("Qué tiene este FV (levadura, mosto) que, en las fermentaciones pasadas de su marca, se asocie con fermentar más lento o más rápido. Solo se listan factores con relación clara (|r| ≥ 0,2) y en los que este FV está en un extremo (percentil ≤25 o ≥75).",F.ok?(F.list.length?`${F.list.length} factor${F.list.length>1?"es":""} ${F.list.some(x=>x.retrasa)?"podría"+(F.list.length>1?"n":"")+" ayudar a explicar un ritmo distinto al habitual. Son asociaciones, no causas: úsalo como pista para revisar.":"se asocia"+(F.list.length>1?"n":"")+" con una fermentación más rápida."}`:`calculado sobre ${F.n} fermentaciones históricas.`):"")}</div>`; }

  /* ---- simulador de alta ---- */
  function simHTML(a){ if(a.hist) return ""; const A=App.Alta.de(a.marca); return `<div class="v35-box wide v41-sim" data-lote="${esc(a.lote)}"><h3>¿Y si el extracto de alta fuera otro?</h3><div class="v35-ctl" style="margin:4px 0 8px"><label class="v39-note">Extracto de alta (°P)</label><input class="inp" type="number" step="0.1" min="0" max="40" inputmode="decimal" value="${A!=null?A:""}" placeholder="°P" style="min-width:110px;max-width:130px"><span class="v39-note">Configurado para ${esc(tit(a.marca))}: ${A!=null?A+" °P":"sin definir"}</span></div><div class="out">${simOut(a,A)}</div></div>`; }
  function simOut(a,v){ if(v==null||isNaN(v)||v<=0) return `<p class="v35-no">Escribe un valor para ver cómo cambiaría la hora probable de alta.</p>`; const last=a.pts[a.pts.length-1], base=App.Alta.de(a.marca); if(last&&last.e<=v) return `<p class="v35-ok">Con ${n1(v,1)} °P el FV ya estaría en alta (último extracto ${n1(last.e,2)} °P).</p>`;
    const py=H2.proyHist(a,v); if(!py.ok) return `<p class="v35-no">${esc(py.motivo)}</p>`; const fb=H2.fiab(a,"h",v), b0=base!=null&&base!==v?H2.proyHist(a,base):null, d=b0&&b0.ok?(py.t-b0.t)/3600e3:null;
    return `<p class="v35-big">${fmtS(py.t)}<small>Con ${n1(v,1)} °P · rango ${fmtS(py.lo)} – ${fmtS(py.hi)}</small></p>${d!=null?`<p class="v35-muted">${Math.abs(d)<.5?"Casi sin diferencia":"Es "+hh(Math.abs(d))+(d>0?" más tarde":" antes")} que con el valor configurado (${base} °P).</p>`:""}${V.fbHTML(fb,"con este valor")}`; }
  document.addEventListener("input",e=>{ const i=e.target.closest&&e.target.closest(".v41-sim input"); if(!i) return; const box=i.closest(".v41-sim"), a=V.buscaFerm(box.dataset.lote); if(!a) return; $(".out",box).innerHTML=simOut(a,+String(i.value).replace(",",".")); });

  /* ---- notas ---- */
  const notasDe=l=>{ const n=(App.S.config.notas||{})[l]; return Array.isArray(n)?n:[]; };
  function notasHTML(a){ const L=notasDe(a.lote).slice().sort((x,y)=>String(y.t).localeCompare(String(x.t))), w=App.Store.canWrite;
    return `<div class="v35-box wide v41-nt" data-lote="${esc(a.lote)}"><h3>Notas del ${a.hist?"lote":"FV"}</h3>${L.length?`<ul class="v41-nl">${L.map((n,i)=>`<li><span>${esc(fmtS(new Date(n.t)))}</span><p>${esc(n.txt)}</p>${w?`<button type="button" class="btn sm ghost" data-v41d="${esc(a.lote)}|${esc(n.t)}" aria-label="Quitar nota">Quitar</button>`:""}</li>`).join("")}</ul>`:`<p class="v35-muted">Sin notas todavía. Anota lo que pasó (ajuste de temperatura, cambio de turno, observación de calidad…) para que quede junto al lote.</p>`}${w?`<div class="v41-na"><textarea class="inp" rows="2" maxlength="500" placeholder="Escribe una nota…"></textarea><button type="button" class="btn sm pri" data-v41n="${esc(a.lote)}">Agregar nota</button></div>`:""}</div>`; }
  async function guardarNotas(lote,arr){ const all=Object.assign({},App.S.config.notas||{}); ["actualizado","creado"].forEach(k=>delete all[k]); if(arr.length) all[lote]=arr; else delete all[lote]; return App.Store.set("config","notas",all); }
  document.addEventListener("click",async e=>{
    const n=e.target.closest&&e.target.closest("[data-v41n]"); if(n){ const box=n.closest(".v41-nt"), ta=$("textarea",box), txt=ta.value.trim(); if(!txt){ App.U.toast("Escribe la nota primero"); return; } const lote=n.dataset.v41n; if(await guardarNotas(lote,[...notasDe(lote),{t:new Date().toISOString(),txt}])){ App.U.toast("Nota guardada"); setTimeout(()=>App.render&&App.render(true),50); } return; }
    const d=e.target.closest&&e.target.closest("[data-v41d]"); if(d){ const [lote,t]=d.dataset.v41d.split("|"); if(!await App.UI.confirm("Quitar nota","Se quita esta nota del lote "+lote+".","Quitar")) return; if(await guardarNotas(lote,notasDe(lote).filter(x=>x.t!==t))){ App.U.toast("Nota quitada"); setTimeout(()=>App.render&&App.render(true),50); } return; }
    const x=e.target.closest&&e.target.closest("[data-v41x]"); if(x){ e.preventDefault(); exportar(x.dataset.v41x); } });

  /* ---- reporte del FV a Excel ---- */
  function exportar(lote){ const a=V.buscaFerm(lote); if(!a){ App.U.toast("No encuentro ese lote"); return; } const B=H2.banda(a.marca), A=App.Alta.de(a.marca), ix=a.hist?{ok:false}:H2.indice(a), py=a.hist?{ok:false}:H2.proyHist(a), fb=py.ok?H2.fiab(a,"h"):null, gm=H2.gemelos(a,3), an=a.hist?{ok:false}:H2.anomalias(a), st=H2.stats(a.marca);
    const res=[["Lote",a.lote],["FV",String(a.tq??"")],["Estado",a.hist?"Fermentación histórica":"En proceso"],["Marca",tit(a.marca)],["Levadura",(a.lev&&a.lev.n)||"—"],["Generación",a.lev&&a.lev.gen!=null?String(a.lev.gen):"—"],["E.O (°P)",a.eo!=null?String(a.eo):"—"],["Muestras medidas",String(a.pts.length-1)],["Último extracto (°P)",String(a.pts[a.pts.length-1].e)],["Extracto de alta (°P)",A!=null?String(A):"sin definir"],
      ["Índice de normalidad",ix.ok?ix.v+"/100 · "+ix.nivel:"No hay suficientes datos"],["Muestras fuera de la banda",an.ok?String(an.list.length):"No hay suficientes datos"],["Alta probable (proyección)",py.ok?fmtS(py.t)+" · rango "+fmtS(py.lo)+" – "+fmtS(py.hi):py.alcanzada?"Ya alcanzada":(py.motivo||"—")],["Fiabilidad de la proyección",fb&&fb.ok?fb.pct+" % ("+fb.n+" pruebas, error típico ±"+hh(fb.mae)+")":"No calculable"],["Fermentaciones históricas de la marca",String(st.n)],["Fuente","Excel CONTROL PROCESO CAVAS + datos de la plataforma · "+App.Excel35.stamp()]];
    const hojas=[{nombre:"Resumen",titulo:"Reporte de "+(a.hist?"":"FV "+a.tq+" · ")+a.lote,sub:"Estimaciones orientativas; no son garantías.",cols:[{h:"Indicador"},{h:"Valor"}],rows:res},
      {nombre:"Muestras",titulo:"Muestras de extracto",sub:"Horas desde el fin de llenado",cols:[{h:"Horas",t:"n"},{h:"Extracto °P",t:"n"},{h:"pH",t:"n"}],rows:a.pts.map(p=>[p.h,p.e,p.ph])}];
    if(B.ok) hojas.push({nombre:"Banda histórica",titulo:"Banda típica de "+tit(a.marca),sub:B.n+" fermentaciones reales",cols:[{h:"Horas",t:"n"},{h:"P10",t:"n"},{h:"Mediana",t:"n"},{h:"P90",t:"n"},{h:"n",t:"i"}],rows:B.g.map(g=>[g.h,g.p10,g.p50,g.p90,g.n])});
    if(gm.ok) hojas.push({nombre:"Gemelos",titulo:"Fermentaciones más parecidas",sub:"",cols:[{h:"Lote"},{h:"Diferencia media °P",t:"n"},{h:"Parecido"}],rows:gm.top.map(g=>[g.c.lote,g.dist,g.nivel])});
    const nt=notasDe(a.lote); if(nt.length) hojas.push({nombre:"Notas",titulo:"Notas del lote",sub:"",cols:[{h:"Fecha",t:"d"},{h:"Nota"}],rows:nt.map(n=>[new Date(n.t).toISOString().slice(0,16),n.txt])});
    V.excel(`reporte_${a.lote}_${App.Excel35.stamp()}.xlsx`,hojas); }

  function bloques(a,full){ const h=factoresHTML(a)+simHTML(a)+notasHTML(a)+`<div class="v35-act"><button class="btn sm" type="button" data-v41x="${esc(a.lote)}">Exportar reporte a Excel</button></div>`; return full?`<div class="v35-card"><span class="v35-eb">7 · HERRAMIENTAS</span><h2>Explorar, simular y anotar</h2><div class="v35-grid v41-g">${h}</div></div>`:`<div class="v35-grid v41-g" style="margin-top:14px">${h}</div>`; }
  App.V41={bloques,exportar};

  /* ---- Cifra ---- */
  const prev=App.BotDirecto, {out,row}=B35, m35=B35.m35();
  function ficha(q){ const a=B35.fermsEn(q)[0]||(m35.lote?V.buscaFerm(m35.lote):null); return a; }
  function bot(texto){ const q=nrm(texto); if(!q) return null;
    if(/(por que|porque|a que se debe|que le pasa|que pasa con).*(lent|rapid|distint|rar|demor|tard|desvi|diferente)|(por que|porque) (va|esta|anda|se (esta )?(demora|tarda))/.test(q)){ const a=ficha(q); if(a&&!a.hist){ const F=H2.factores(a), an=H2.anomalias(a); m35.lote=a.lote; m35.marca=a.marca;
        return out({h:`¿Por qué FV ${a.tq} va así?`,s:an.ok?(an.list.length?`Va ${an.list[an.list.length-1].tipo==="lento"?"más lento":"más rápido"} que el 90 % de los casos de su marca.`:"Va dentro de lo habitual."):esc(an.motivo),rows:F.ok?(F.list.length?F.list.slice(0,4).map(x=>row(x.nom,`${n1(x.v,2)}${x.u} (percentil ${x.rank}) · ${x.retrasa?"se asocia con fermentar más lento":"se asocia con fermentar más rápido"} <small>r=${n1(x.r,2)}, n=${x.n}</small>`)):[row("Factores","<small>Ninguno se aparta de lo habitual en un factor con relación clara.</small>")]):[row("Factores",`<small>${esc(F.motivo)}</small>`)],note:"Son asociaciones del histórico de la marca, no causas probadas. Úsalo como pista para revisar.",ver:[["#/tanque/"+a.lote,"Ver el detalle del FV"]]},["PROYECTA FV "+a.tq,"EXPLICA"]); } }
    const sm=q.match(/que (?:pasa|pasaria|ocurre|sale) si (?:la )?alta (?:fuera|fuese|es|sea|seria|a|en|de)?\s*(\d+(?:[.,]\d+)?)/); if(sm){ const a=ficha(q); if(a&&!a.hist){ const v=+sm[1].replace(",","."); m35.lote=a.lote; const py=H2.proyHist(a,v), fb=py.ok?H2.fiab(a,"h",v):null, last=a.pts[a.pts.length-1];
        return out({h:`FV ${a.tq} con alta en ${n1(v,1)} °P`,s:last.e<=v?"Con ese valor el FV ya estaría en alta.":py.ok?`Lo más probable: ${fmtS(py.t)} (rango ${fmtS(py.lo)} – ${fmtS(py.hi)})`:esc(py.motivo),rows:[fb&&fb.ok?row("Fiabilidad",`<b>${fb.pct} %</b> <small>(${fb.n} pruebas, error típico ±${hh(fb.mae)})</small>`):null],note:"Simulación con el histórico; no cambia la configuración de la marca.",ver:[["#/tanque/"+a.lote,"Abrir el tanque y probar otros valores"]]},["PROYECTA FV "+a.tq]); } }
    const nt=q.match(/^(notas?|bitacora|comentarios)\s+(?:del|de|en el|para el)?\s*(?:fv|lote)?\s*(\w+)/); if(nt){ const a=B35.fermsEn("fv "+nt[2])[0]||B35.fermsEn(nt[2])[0]; if(a){ const L=notasDe(a.lote); return out({h:`Notas de ${a.hist?a.lote:"FV "+a.tq}`,s:L.length?`${L.length} nota${L.length>1?"s":""}`:"No hay notas todavía.",rows:L.slice(-5).reverse().map(n=>row(fmtS(new Date(n.t)),esc(n.txt))),ver:[[a.hist?"#/ficha/fv/"+E(a.lote):"#/tanque/"+a.lote,"Abrir y agregar una nota"]]},[]); } }
    if(/(exporta|exportar|descarga|descargar|reporte|informe).*(fv|f\d|lote|tanque)/.test(q)){ const a=ficha(q); if(a) return out({h:`Reporte de ${a.hist?a.lote:"FV "+a.tq}`,s:"Excel con resumen, muestras, banda histórica, gemelos y notas.",ver:[]}).h&&Object.assign(out({h:`Reporte de ${a.hist?esc(a.lote):"FV "+a.tq}`,s:"Excel con resumen, muestras, banda histórica, gemelos y notas.",note:`<a class="ans-ver" href="javascript:void(0)" data-v41x="${esc(a.lote)}">Descargar el reporte ›</a>`},[]),{}); }
    return null; }
  App.BotDirecto=function(texto,env){ try{ const r=bot(texto); if(r) return Object.assign(r,{directo:true}); }catch(e){ console.error("v41 bot",e); } return prev(texto,env); };
  setTimeout(()=>{ try{ App.render&&App.render(true); }catch(e){} },0);
})();

</script>

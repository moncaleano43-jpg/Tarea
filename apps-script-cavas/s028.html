<script>

/* v38 — Red de datos conectados: fichas navegables (FV, levadura, familia,
   generación, marca, colector), trazabilidad visual, comparador de
   generaciones y periodos, y Cifra con contexto de entidades. */
(function(){
  if(!window.App||!App.An||!App.V35||!App.Bot35) return;
  const {esc,fmtS,f}=App.U, H2=App.Hist2, An=App.An, V=App.V35, Mk=App.Marcas, B35=App.Bot35, LS=App.V31.LS, $=(s,r=document)=>r.querySelector(s);
  const tit=s=>String(s||"").toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());
  const nrm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
  const n1=An.n1, hh=V.hh, mean=An.mean, pc=An.pc, PAL=An.PAL, D=()=>App.Cerebro.datos(), E=encodeURIComponent;
  const famDe=An.famDe, parse=n=>(n&&App.Calc.parseLev)?App.Calc.parseLev(n):null;
  const back=`<a class="v34-back" href="javascript:history.back()">‹ Volver</a>`;
  const pg=(t,s,body,cls)=>`<div class="v35-pg ${cls||""}">${back}<div class="page-h"><div><h1>${t}</h1><p>${s||""}</p></div></div>${body}</div>`;
  const chips=qs=>`<div class="v38-q">${qs.map(q=>`<button type="button" data-v35bot="${esc(q)}">${esc(q)}</button>`).join("")}</div>`;
  const step=(k,v,s,go,on)=>`<a class="v38-st ${on?"on":""}" href="${go||"javascript:void(0)"}"><small>${esc(k)}</small><b>${esc(v)}</b>${s?`<em>${esc(s)}</em>`:""}</a>`;
  const chain=a=>`<div class="v38-chain">${a.filter(Boolean).join('<span class="v38-ar">›</span>')}</div>`;
  const rel=(t,s,go)=>`<a href="${go}"><b>${esc(t)}</b><small>${esc(s)}</small></a>`;
  const kp=a=>`<div class="v32-kp">${a.map(([v,l])=>`<div><b>${v}</b><span>${esc(l)}</span></div>`).join("")}</div>`;
  const nodat=An.nodat;
  const med=a=>pc(a.filter(x=>x!=null&&isFinite(x)),.5);
  const sg=(vals,lab)=>{ vals=vals.filter(x=>x!=null&&isFinite(x)); return vals.length?{lab,n:vals.length,med:pc(vals,.5),mean:mean(vals),p10:pc(vals,.1),p25:pc(vals,.25),p75:pc(vals,.75),p90:pc(vals,.9),min:Math.min(...vals),max:Math.max(...vals)}:null; };
  /* métricas de una fermentación (histórica o activa) */
  const met=a=>({e72:a.hist&&a.e72!=null?a.e72:H2.interp(a.pts,72),h75:a.hist&&a.h75!=null?a.h75:(a.eo!=null?H2.cruce(a.pts,a.eo*.25):null),tA:(()=>{ const A=App.Alta.de(a.marca), c=A!=null?H2.cruce(a.pts,A):null; return c>0?c:null; })()});
  const usosDe=name=>[...H2.hist().filter(h=>h.lev&&h.lev.n===name),...H2.activos().filter(a=>a.lev.n===name)];

  /* ---- cadena de trazabilidad ---- */
  function cadena(a){ const Dd=D(), name=a.lev&&a.lev.n, reg=name&&Dd.REG.find(r=>r.nombre===name), p=parse(name), col=a.hist?(a.lev&&a.lev.colector):(a.x&&a.x.t.levadura&&a.x.t.levadura.colector), cos=Dd.REG.find(r=>r.lote===a.lote), fam=famDe(name), gen=a.lev&&a.lev.gen!=null?a.lev.gen:(p&&p.gen);
    const st=[ step("Marca",tit(a.marca),"",`#/ficha/marca/${E(a.marca)}`),
      reg?step("Cosechada de",`FV ${reg.tq}`,reg.lote,`#/ficha/fv/${E(reg.lote)}`):(a.hist&&a.lev&&a.lev.utq?step("Cosechada de","FV "+a.lev.utq,"",""):null),
      col?step("Colector","C"+col,"","#/colectores/"+col):null,
      name?step("Levadura",name,gen!=null?"Gen "+gen:"",`#/ficha/levadura/${E(name)}`):step("Levadura","sin registro","",""),
      gen!=null?step("Generación","Gen "+gen,"",`#/ficha/generacion/${gen}`):null, fam?step("Familia","Familia "+fam,"",`#/ficha/familia/${fam}`):null,
      step("Fermentación",(a.hist?"":"FV "+a.tq+" · ")+a.lote,a.hist?"histórica":"en proceso","",true),
      cos?step("Resultado cosecha",cos.nombre,"Gen "+cos.generacion,`#/ficha/levadura/${E(cos.nombre)}`):null,
      step("Histórico","Marca "+tit(a.marca),H2.stats(a.marca).n+" fermentaciones",`#/historico/${E(a.marca)}`) ];
    return {html:chain(st),reg,cos,name,col,gen,fam}; }

  /* ---- ficha: fermentación ---- */
  function fFV(id){ const a=V.buscaFerm(id); if(!a) return pg("No encuentro esa fermentación","Prueba con un lote (F474), un FV en proceso o un lote del histórico.",chips(["POTENCIAL"]));
    const ch=cadena(a), s=H2.stats(a.marca), m=met(a), ix=a.hist?{ok:false}:H2.indice(a), an=a.hist?{ok:false}:H2.anomalias(a), py=a.hist?{ok:false}:H2.proyHist(a), gm=H2.gemelos(a,3), B=H2.banda(a.marca), A=App.Alta.de(a.marca);
    const prevTq=H2.hist().filter(h=>+h.tq===+a.tq&&h.lote!==a.lote).sort((x,y)=>(y.finT||0)-(x.finT||0));
    const hist=a.hist?H2.hist().find(h=>h.lote===a.lote):null;
    const story=a.hist?`Fermentación histórica de ${tit(a.marca)} (${a.fin?fmtS(new Date(a.fin)):""}). ${m.h75!=null?`Llegó al 75 % de atenuación a las ${hh(m.h75)}`:"Sin dato de atenuación"}${s.h75!=null?` (mediana de la marca: ${hh(s.h75)})`:""}.`:V.narrar(a,ix,an,py,gm);
    const cmp=[["E.O del mosto",n1(a.eo,2)+" °P",n1(s.eo,2)+" °P"],["Extracto a 72 h",m.e72!=null?n1(m.e72,2)+" °P":"—",s.e72!=null?n1(s.e72,2)+" °P":"—"],["Horas al 75 %",m.h75!=null?hh(m.h75):"aún no",hh(s.h75)],["Hasta la alta"+(A!=null?" ("+A+" °P)":""),m.tA!=null?hh(m.tA):A==null?"alta sin definir":"aún no",s.tA?hh(s.tA.p50)+" (n="+s.tA.n+")":"sin datos suficientes"]];
    const body=`<div class="v35-card"><span class="v35-eb">1 · QUÉ ESTÁ PASANDO</span><p class="v35-story" style="font-size:17px">${esc(story)}</p>${kp([[n1(a.eo,2),"E.O °P"],[a.pts.length-1,"Muestras"],[ix.ok?ix.v:"—","Índice de normalidad"],[hh(a.pts[a.pts.length-1].h),"Última muestra"]])}</div>
      <div class="v35-card"><span class="v35-eb">2 · RED DE DATOS</span><h2>De dónde viene y a dónde fue</h2>${ch.html}<p class="v35-muted">Toca cualquier paso para abrirlo. Origen: registros de levadura y fermentaciones de la plataforma.</p></div>
      <div class="v35-card"><span class="v35-eb">3 · QUÉ DICEN LOS DATOS</span><h2>Su curva frente al histórico de ${esc(tit(a.marca))}</h2>${V.chart({series:[{pts:a.pts,dots:true,l:a.lote}].concat(gm.ok?[{pts:gm.top[0].c.pts,c:"#8e8e93",d:true,w:1.8}]:[]),band:B,A,proy:py,base:a.finT,xmax:168})}${V.leyenda([["var(--accent)",a.lote],["rgba(10,132,255,.22)","Banda P10–P90 de la marca","bx"],["#8e8e93","Gemelo histórico","dsh"]])}${B.ok?"":`<p class="v35-no">Referencia histórica limitada: ${B.n} curvas de la marca (se necesitan 8).</p>`}${a.hist?"":`<a class="btn sm" href="#/tanque/${esc(a.lote)}">Abrir el tanque</a>`}</div>
      <div class="v35-card"><span class="v35-eb">4 · CÓMO SE COMPARA</span><h2>Frente a la mediana de su marca</h2>${An.tabla(["Indicador","Esta fermentación","Mediana de la marca"],cmp.map(r=>r.map(esc)))}${V.fuente(`Mediana de ${s.n} fermentaciones históricas de ${esc(tit(a.marca))} (Excel CONTROL PROCESO CAVAS). Las horas se cuentan desde el fin de llenado.`)}</div>
      <div class="v35-card"><span class="v35-eb">5 · QUÉ HA PASADO HISTÓRICAMENTE</span><h2>Relacionado</h2><div class="v38-rel">${gm.ok?gm.top.map(g=>rel("Gemelo: "+g.c.lote,`${g.nivel} · diferencia media ${n1(g.dist,2)} °P`,`#/ficha/fv/${E(g.c.lote)}`)).join(""):`<a href="javascript:void(0)"><b>Sin gemelos</b><small>${esc(gm.motivo||"")}</small></a>`}${prevTq.slice(0,3).map(h=>rel("Mismo tanque: "+h.lote,`FV ${h.tq} · ${h.fin?fmtS(new Date(h.fin)).slice(0,11):""} · ${tit(h.marca)}`,`#/ficha/fv/${E(h.lote)}`)).join("")}${rel("Comparar con otro lote","Curvas y métricas lado a lado",`#/comparar/fermentaciones/${E(a.lote)}/`)}${rel("Histórico de "+tit(a.marca),s.n+" fermentaciones",`#/historico/${E(a.marca)}`)}</div></div>
      <div class="v35-card"><span class="v35-eb">6 · QUÉ PODRÍA PASAR</span><h2>Proyección</h2>${py.ok?`<p class="v35-big">${fmtS(py.t)}<small>Lo más probable · rango ${fmtS(py.lo)} – ${fmtS(py.hi)}</small></p>${V.fbHTML(H2.fiab(a,"h"),"de esta proyección")}${V.fuente(esc(py.fuente)+". Estimación orientativa, no una garantía.")}`:`<p class="v35-no">${esc(py.motivo||(a.hist?"Es una fermentación terminada: no hay proyección.":"No hay suficientes datos para calcularlo con respaldo."))}</p>`}${chips(["ANALIZA "+(a.hist?a.lote:"FV "+a.tq),"EXPLICA","MUESTRA "+(a.hist?a.lote:"FV "+a.tq)])}</div>${App.V41?App.V41.bloques(a,true):""}`;
    return pg((a.hist?"":"FV "+a.tq+" · ")+esc(a.lote),`${esc(tit(a.marca))} · ${a.hist?"fermentación histórica":"en proceso"}`,body,"v38-fx"); }

  /* ---- ficha: levadura ---- */
  function fLev(name){ name=decodeURIComponent(name||""); const Dd=D(), reg=Dd.REG.find(r=>r.nombre===name), U=usosDe(name), p=parse(name), fam=(reg&&reg.familia)||(p&&p.fam)||famDe(name), gen=reg?reg.generacion:(p?p.gen:null), enC=Dd.OC.filter(o=>o.nombre===name);
    if(!reg&&!U.length) return pg(esc(name),"No encuentro esta levadura en la base de datos ni en las fermentaciones.",chips(["POTENCIAL"]));
    const padre=r=>Dd.REG.find(x=>x.id!==r.id&&(x.siembras||[]).some(s=>s.lote===r.lote)); const anc=[]; let c=reg; for(let i=0;i<8&&c;i++){ const q=padre(c); if(!q||anc.includes(q)) break; anc.push(q); c=q; }
    const hijos=reg?Dd.REG.filter(h=>(reg.siembras||[]).some(s=>s.lote===h.lote)&&h.id!==reg.id):[];
    const rows=U.map(a=>Object.assign({a},met(a))), hs=rows.map(r=>r.h75).filter(x=>x!=null), es=rows.map(r=>r.e72).filter(x=>x!=null);
    const famRows=H2.hist().filter(h=>h.lev&&famDe(h.lev.n)===fam), genRows=H2.hist().filter(h=>h.lev&&gen!=null&&+h.lev.gen===+gen);
    const cmp=[["Esta levadura",hs,es,U.length],["Generación "+gen+" (histórico)",genRows.map(h=>h.h75),genRows.map(h=>h.e72),genRows.length],["Familia "+fam+" (histórico)",famRows.map(h=>h.h75),famRows.map(h=>h.e72),famRows.length]];
    const rec=[]; const gc=Object.assign({alerta:8,seguimiento:6},App.S.config.generaciones||{}); if(gen!=null&&reg&&reg.st==="inventario"&&+gen+1>=gc.alerta) rec.push(`Su próxima cosecha sería Gen ${+gen+1}; la alerta crítica está en Gen ${gc.alerta} (Configuración).`);
    const gv=med(genRows.map(h=>h.lev&&h.lev.viab)); if(reg&&reg.viab!=null&&gv!=null&&genRows.length>=8&&reg.viab<gv-.015) rec.push(`Su viabilidad (${Math.round(reg.viab*1000)/10} %) está por debajo de la mediana histórica de la Gen ${gen} (${Math.round(gv*1000)/10} %, n=${genRows.length}).`);
    if(U.length<3) rec.push("Referencia histórica limitada: esta levadura se ha usado pocas veces, así que su comportamiento se compara mejor con su generación y familia.");
    if(hs.length>=2&&med(genRows.map(h=>h.h75))!=null){ const d=med(hs)-med(genRows.map(h=>h.h75)); if(Math.abs(d)>=4) rec.push(`En sus fermentaciones llegó al 75 % en una mediana de ${hh(med(hs))}, ${hh(Math.abs(d))} ${d>0?"más tarde":"antes"} que la mediana de su generación.`); }
    if(!rec.length) rec.push("Con los datos disponibles no hay nada que se aparte de lo habitual para esta levadura.");
    const body=`<div class="v35-card"><span class="v35-eb">1 · QUÉ ESTÁ PASANDO</span><p class="v35-story" style="font-size:17px">${reg?`${esc(name)} es una cosecha de la familia ${esc(fam)}, generación ${gen}, ${esc(tit(reg.marca))}. Estado: ${esc(({utilizada:"ya utilizada",inventario:"disponible en colector",vaciada:"vaciada sin resiembra",descartada:"descartada"})[reg.st]||reg.st)}.`:`${esc(name)} aparece en ${U.length} fermentaciones pero no tiene registro de cosecha en la base.`}${enC.length?` Está en ${enC.map(o=>o.id).join(", ")}.`:""}</p>${kp([[reg&&reg.viab!=null?Math.round(reg.viab*1000)/10+"%":"—","Viabilidad"],[reg&&reg.cons!=null?n1(reg.cons*100,0)+"%":"—","Consistencia"],[reg&&reg.ph!=null?n1(reg.ph,2):"—","pH"],[U.length,"Fermentaciones donde se usó"]])}</div>
      <div class="v35-card"><span class="v35-eb">2 · TRAZABILIDAD</span><h2>Linaje</h2>${chain([...anc.slice().reverse().map(r=>step("Ancestro","Gen "+r.generacion,r.nombre,`#/ficha/levadura/${E(r.nombre)}`)),step("Esta levadura",name,"Gen "+gen,"",true),...(U.length?[step("Se sembró en",U.length+" fermentaciones","",""),]:[]),...hijos.slice(0,4).map(r=>step("Cosecha","Gen "+r.generacion,r.nombre,`#/ficha/levadura/${E(r.nombre)}`))])}<div class="v38-rel"><a href="#/ficha/familia/${esc(fam)}"><b>Familia ${esc(fam)}</b><small>Ver todas sus generaciones</small></a>${gen!=null?`<a href="#/ficha/generacion/${gen}"><b>Generación ${gen}</b><small>Comportamiento histórico</small></a>`:""}${reg?`<a href="#/ficha/marca/${E(reg.marca)}"><b>${esc(tit(reg.marca))}</b><small>Marca</small></a><a href="#/ficha/fv/${E(reg.lote)}"><b>Cosechada de FV ${esc(reg.tq)}</b><small>Lote ${esc(reg.lote)}</small></a>`:""}</div></div>
      <div class="v35-card"><span class="v35-eb">3 · COMPORTAMIENTO</span><h2>Cómo fermentó donde se usó</h2>${U.length?An.tabla(["Fermentación","Marca","Fecha","E.A 72 h","Horas al 75 %"],rows.slice(0,12).map(r=>[`<a href="#/ficha/fv/${E(r.a.lote)}">${r.a.hist?esc(r.a.lote):"FV "+r.a.tq+" · "+esc(r.a.lote)}</a>`,esc(tit(r.a.marca)),r.a.hist&&r.a.fin?fmtS(new Date(r.a.fin)).slice(0,11):"en proceso",r.e72!=null?n1(r.e72,2)+" °P":"—",r.h75!=null?hh(r.h75):"—"])):`<p class="v35-no">No hay suficientes datos: no aparece en ninguna fermentación.</p>`}</div>
      <div class="v35-card"><span class="v35-eb">4 · CÓMO SE COMPARA</span><h2>Frente a su generación y su familia</h2>${An.tabla(["Grupo","Fermentaciones","Horas al 75 % (mediana)","E.A 72 h (mediana)"],cmp.map(r=>[esc(r[0]),r[3],r[1].filter(x=>x!=null).length>=2?hh(med(r[1])):"—",r[2].filter(x=>x!=null).length>=2?n1(med(r[2]),2)+" °P":"—"]))}${V.fuente("Mediana de las fermentaciones históricas del Excel agrupadas por la generación y familia que indica el nombre de la levadura. No separa por marca.")}</div>
      <div class="v35-card"><span class="v35-eb">5 · LO QUE SUGIEREN LOS DATOS</span><h2>Recomendaciones basadas en datos</h2><ul class="v31-ins">${rec.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>${chips(["TRAZA "+name,"COMPARA FAMILIA "+fam+" CON FAMILIA "])}</div>`;
    return pg(esc(name),`${esc(tit((reg&&reg.marca)||""))} · Familia ${esc(fam||"—")} · Gen ${gen??"—"}`,body,"v38-lx"); }

  /* ---- ficha: familia / generación / marca / colector ---- */
  function fFam(F){ F=String(F||"").toUpperCase(); const rows=An.DS().filter(r=>r.fam===F), s=H2.statsFam(F), Dd=D(), reg=Dd.REG.filter(r=>String(r.familia).toUpperCase()===F); if(!rows.length&&!reg.length&&!s.ahora) return pg("Familia "+esc(F),"No hay datos de esta familia.","");
    const g=An.agrupar(rows,"h75","gen",4), act=Dd.P.filter(o=>o.fam===F), col=Dd.OC.filter(o=>o.fam===F);
    return pg("Familia "+esc(F),`${reg.length} cosechas registradas · usada en ${s.marcas.map(tit).join(", ")||"—"}`,
      `<div class="v35-card"><span class="v35-eb">1 · QUÉ ESTÁ PASANDO</span>${kp([[s.n,"Fermentaciones históricas"],[act.length,"En fermentación ahora"],[col.length,"En colectores"],[s.h75!=null?hh(s.h75):"—","Horas al 75 % (mediana)"]])}<div class="v38-rel">${act.map(o=>rel("FV "+o.tq+" · "+o.lev,"Gen "+o.gen+" · en proceso","#/ficha/fv/"+E(o.lote))).join("")}${col.map(o=>rel(o.id+" · "+o.nombre,"Gen "+o.gen+" · colector","#/ficha/levadura/"+E(o.nombre))).join("")}</div></div>
      <div class="v35-card"><span class="v35-eb">2 · CÓMO SE COMPORTA</span><h2>Horas al 75 % por generación</h2>${g.length>=2?An.boxChart(g,"h"):nodat("menos de 2 generaciones con 4 fermentaciones")}${V.fuente("Fermentaciones históricas sembradas con esta familia, agrupadas por la generación de la levadura. Caja: 50 % central; línea: 80 % de los casos.")}</div>
      <div class="v35-card"><span class="v35-eb">3 · RELACIONADO</span><div class="v38-rel">${rel("Detalle de cosechas","Recorrido por generación y siembras","#/detalle/familia/"+F)}${rel("Comparar con otra familia","Mediana de horas, viabilidad y más","#/comparar/levaduras/"+F+"/")}${s.marcas.map(m=>rel(tit(m),"Marca donde se usó","#/ficha/marca/"+E(m))).join("")}</div>${chips(["ANALIZA FAMILIA "+F,"TRAZA FAMILIA "+F])}</div>`,"v38-lx"); }
  function fGen(n){ n=+n; const rows=An.DS().filter(r=>r.gen===n), all=An.DS(), Dd=D(), act=Dd.P.filter(o=>+o.gen===n), col=Dd.OC.filter(o=>+o.gen===n); if(!rows.length&&!act.length&&!col.length) return pg("Generación "+n,"No hay datos de esta generación.","");
    const mg=med(all.map(r=>r.v.h75)), g=sg(rows.map(r=>r.v.h75),"Gen "+n), byM=An.agrupar(rows,"h75","marca",4), byF=An.agrupar(rows,"h75","fam",4);
    return pg("Generación "+n,`${rows.length} fermentaciones históricas · ${act.length} en proceso · ${col.length} en colectores`,
      `<div class="v35-card"><span class="v35-eb">1 · QUÉ ESTÁ PASANDO</span>${kp([[rows.length,"Fermentaciones históricas"],[g?hh(g.med):"—","Horas al 75 % (mediana)"],[n1(med(rows.map(r=>r.v.viab)),1)+"%","Viabilidad (mediana)"],[act.length+col.length,"Unidades en uso ahora"]])}${g&&mg!=null?`<p class="v35-story">La mediana de la Gen ${n} es ${hh(g.med)} frente a ${hh(mg)} del histórico completo (${g.n>=8?"referencia suficiente":"referencia histórica limitada"}).</p>`:""}</div>
      <div class="v35-card"><span class="v35-eb">2 · CÓMO SE COMPARA</span><h2>Por marca y por familia</h2><div class="v35-grid"><div>${byM.length?An.boxChart(byM,"h",360,240):nodat()}</div><div>${byF.length?An.boxChart(byF,"h",360,240):nodat()}</div></div>${V.fuente("Horas al 75 % de atenuación de las fermentaciones sembradas con esta generación; se separa por marca y por familia para no mezclar efectos.")}</div>
      <div class="v35-card"><span class="v35-eb">3 · AHORA</span><div class="v38-rel">${act.map(o=>rel("FV "+o.tq+" · "+o.lev,tit(o.marca),"#/ficha/fv/"+E(o.lote))).join("")}${col.map(o=>rel(o.id+" · "+o.nombre,"En colector","#/ficha/levadura/"+E(o.nombre))).join("")}${rel("Comparar con Gen "+(n+1),"Horas, viabilidad y más",`#/comparar/generaciones/${n}/${n+1}`)}${n>1?rel("Comparar con Gen "+(n-1),"Horas, viabilidad y más",`#/comparar/generaciones/${n-1}/${n}`):""}</div></div>`,"v38-lx"); }
  function fMarca(id){ id=H2.key(decodeURIComponent(id||"")); const M=Mk.todas().find(m=>m.id===id), s=H2.stats(id), B=H2.banda(id), rows=An.DS().filter(r=>r.marca===id), act=H2.activos().filter(a=>a.marca===id); if(!M&&!rows.length) return pg(esc(id),"No encuentro esa marca.","");
    const fams=An.agrupar(rows,"h75","fam",1).sort((a,b)=>b.n-a.n).slice(0,8), gens=An.agrupar(rows,"h75","gen",4), rec=H2.hist().filter(h=>h.marca===id).sort((a,b)=>(b.finT||0)-(a.finT||0)).slice(0,8);
    return pg(esc(tit(id)),`${M&&!M.activa?"Marca inactiva · ":""}Alta ${s.A!=null?s.A+" °P":"sin definir"} · T0 de referencia ${n1(Mk.dias(id),1)} d`,

  /* ---- comparador: generaciones y periodos ---- */

  const sel=(id,opts,cur)=>An.sel(id,opts,cur);
  function cmpX(tipo,a,b,mk){ mk=mk?decodeURIComponent(mk):""; const all=An.DS().filter(r=>!mk||r.marca===mk), ms=An.marcasH();
    const head=`<div class="page-h"><div><h1>Comparar</h1><p>Pon dos cosas lado a lado: marcas, fermentaciones, familias, generaciones o periodos.</p></div></div><div class="v31-seg">${TABS.map(([k,l])=>`<a href="#/comparar/${k}" class="${k===tipo?"on":""}">${l}</a>`).join("")}</div>`;

  /* ---- Cifra: contexto de entidades ---- */
  const prevBot=App.BotDirecto, m35=B35.m35(), out=B35.out, row=B35.row;
  const CMDW=/^(analiza|analizar|compara|comparar|traza|trazar|trazabilidad|proyecta|proyectar|muestra|muestrame|historico|detecta|explica|resume|potencial|disponibilidad)\b/;
  function cLevCard(name){ const Dd=D(), reg=Dd.REG.find(r=>r.nombre===name), U=usosDe(name), p=parse(name), fam=(reg&&reg.familia)||(p&&p.fam), gen=reg?reg.generacion:(p&&p.gen); if(!reg&&!U.length) return null;

  function bot38(texto){ const q=nrm(texto); if(!q) return null; const cmd=CMDW.test(q), fe=B35.fermsEn(q), mk=B35.marcasEn(q), ctxL=m35.lote?V.buscaFerm(m35.lote):null, nameM=(texto.match(/\b[A-Za-z]{2}\d{1,2}[Ff]\d{1,3}\b/)||[])[0];
    const num=q.match(/\b(?:fv|tanque|fermentador)\s*(\d{3,4})\b|\bf(\d{3,4})\b/); if(num&&!fe.length){ const n=num[1]||num[2], L=H2.hist().map(h=>h.lote).concat(H2.activos().map(a=>a.lote)).filter(l=>l.length===("F"+n).length).sort((x,y)=>Math.abs(+x.slice(1)-+n)-Math.abs(+y.slice(1)-+n)).slice(0,3); return out({h:`No encuentro el lote F${esc(n)}`,s:"No está entre los FV en proceso ni en el histórico del Excel. Puede que aún no se haya cargado.",rows:L.length?[row("Lotes cercanos",L.map(l=>`<a href="#/ficha/fv/${E(l)}">${esc(l)}</a>`).join(" · "))]:[]},["POTENCIAL"]); }

    if(/(que|cual) levadura (utilizo|uso|se uso|sembraron|tiene|lleva|siembra|tuvo)|con que levadura/.test(q)){ const a=fe[0]||ctxL; if(a&&a.lev&&a.lev.n){ m35.lev=a.lev.n; const p=parse(a.lev.n); return out({h:`${a.hist?esc(a.lote):"FV "+a.tq} se sembró con <b>${esc(a.lev.n)}</b>`,s:`Familia ${esc(famDe(a.lev.n)||"—")} · Gen ${a.lev.gen??(p&&p.gen)??"—"}`,ver:[["#/ficha/levadura/"+E(a.lev.n),"Ver la ficha de la levadura"]]},["Cómo se ha comportado esa levadura","TRAZA "+(a.hist?a.lote:"FV "+a.tq)]); } if(a) return out({h:"No hay registro de la levadura sembrada",s:"Esa fermentación no tiene levadura registrada en los datos."},[]); }

    const g=q.match(/^compara\w*\s+(?:la\s+)?gen(?:eracion)?\s*(\d{1,2})\s+(?:con|vs|contra|y|versus)\s+(?:la\s+)?(?:gen(?:eracion)?\s*)?(\d{1,2})$/); if(g){ const a=+g[1], b=+g[2], R=An.DS(), x=sg(R.filter(r=>r.gen===a).map(r=>r.v.h75),"a"), y=sg(R.filter(r=>r.gen===b).map(r=>r.v.h75),"b");
      return out({h:`Gen ${a} frente a Gen ${b}`,rows:[row("Horas al 75 %",x&&y?`${hh(x.med)} · ${hh(y.med)} <small>(n=${x.n} · ${y.n})</small>`:"<small>No hay suficientes datos</small>"),row("Viabilidad",`${n1(med(R.filter(r=>r.gen===a).map(r=>r.v.viab)),1)} % · ${n1(med(R.filter(r=>r.gen===b).map(r=>r.v.viab)),1)} %`)],note:"No separa por marca; ábrelo para filtrar.",ver:[[`#/comparar/generaciones/${a}/${b}`,"Ver comparación completa y exportar"]]},[]); }
    const fm=q.match(/\b(?:gen(?:eracion)?)\s*(\d{1,2})\b/); if(fm&&/^(que pasa con|como (va|esta|se comporta)|analiza|historico de|info(?:rmacion)? de)\s+(la\s+)?gen/.test(q)) return out({h:`Generación ${fm[1]}`,s:"Comportamiento histórico, marcas y familias.",ver:[["#/ficha/generacion/"+fm[1],"Abrir la ficha de la generación"]]},[]);
    return null; }
  App.BotDirecto=function(texto,env){ try{ const r=bot38(texto,env); if(r) return Object.assign(r,{directo:true}); }catch(e){ console.error("v38 bot",e); } return prevBot(texto,env); };

  /* ---- búsqueda: levaduras, familias, generaciones ---- */
  function extra(){ const q=document.getElementById("gq"), res=document.getElementById("gres"); if(!q||!res) return; const t=nrm(q.value); if(t.length<2) return; res.querySelectorAll("[data-v38x]").forEach(n=>n.remove()); const G=[];
    const fm=t.match(/^(?:familia|fam)\s+([a-z])$/), gm=t.match(/^(?:gen|generacion)\s*(\d{1,2})$/);
    if(fm) G.push(["Familia",[{ic:"yeast",t1:"Familia "+fm[1].toUpperCase(),t2:"Comportamiento, generaciones y fermentaciones",go:"ficha/familia/"+fm[1].toUpperCase()}]]);

    else if(t.length>=3){ const L=[...new Set(D().REG.map(r=>r.nombre).filter(Boolean))].filter(n=>nrm(n).includes(t)).slice(0,4); if(L.length) G.push(["Levaduras",L.map(n=>({ic:"yeast",t1:n,t2:"Ficha de la levadura",go:"ficha/levadura/"+n}))]); }

<script>

/* v39 — Agenda de las próximas horas, recomendador de siembra, salud de los
   datos y fiabilidad de proyecciones en Cifra. */
(function(){
  if(!window.App||!App.An||!App.V35||!App.Bot35) return;
  const {esc,fmtS,f}=App.U, H2=App.Hist2, An=App.An, V=App.V35, Mk=App.Marcas, B35=App.Bot35, $=(s,r=document)=>r.querySelector(s), E=encodeURIComponent, HOUR=3600e3;
  const tit=s=>String(s||"").toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());
  const nrm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
  const n1=An.n1, hh=V.hh, med=a=>An.pc(a.filter(x=>x!=null&&isFinite(x)),.5), D=()=>App.Cerebro.datos();
  const whenTxt=ms=>{ const d=ms-Date.now(), a=Math.abs(d)/HOUR, t=a<1?Math.max(1,Math.round(a*60))+" min":a<48?Math.round(a)+" h":Math.round(a/24)+" d"; return d<0?"hace "+t:"en "+t; };
  const dd=ms=>{ const d=new Date(ms), p=n=>String(n).padStart(2,"0"); return p(d.getDate())+"/"+p(d.getMonth()+1)+" "+p(d.getHours())+":"+p(d.getMinutes()); };

  /* intervalo habitual entre muestras (del histórico real) */
  let _gap; function gap(){ if(_gap!==undefined) return _gap; const g=[]; H2.hist().forEach(h=>{ const p=h.pts.filter(x=>x.h>0); for(let i=1;i<p.length;i++){ const d=p[i].h-p[i-1].h; if(d>3&&d<60) g.push(d); } }); return _gap=g.length>=50?med(g):null; }

  /* ---- agenda ---- */
  function eventos(){ const now=Date.now(), L=[], win=36*HOUR; const G=gap();
    H2.activos().forEach(a=>{ const x=a.x, r=x.r, st=x.st&&x.st.k, last=a.pts[a.pts.length-1], A=App.Alta.de(a.marca), go="ficha/fv/"+E(a.lote), tag="FV "+a.tq+" · "+tit(a.marca);
      if(r.venc&&["rojo","naranja","verde"].includes(st)){ const v=+r.venc; if(v<now) L.push({t:v,late:2,k:"Vencido",tone:"late",x:tag,s:"El límite de retiro de levadura pasó "+whenTxt(v)+".",go:"tanque/"+a.lote}); else if(v<now+win) L.push({t:v,late:0,k:"Límite",tone:"warn",x:tag,s:"Último momento recomendado para retirar la levadura.",go:"tanque/"+a.lote}); }
      if(r.t0&&+r.t0>now&&+r.t0<now+win) L.push({t:+r.t0,late:0,k:"T0",tone:"ok",x:tag,s:"Desde aquí se puede retirar la levadura.",go:"tanque/"+a.lote});
      const py=H2.proyHist(a); let ta=null,fb=null,src=""; if(py.ok){ ta=py.t; fb=H2.fiab(a,"h"); src="histórico"; } else if(!py.alcanzada&&A!=null){ const pa=App.Alta.proy(x); if(pa&&pa.estado==="proyectada"){ ta=pa.t; fb=H2.fiab(a,"m"); src="sus muestras"; } }
      if(ta!=null&&ta>now-6*HOUR&&ta<now+win) L.push({t:ta,late:ta<now?1:0,k:"Alta",tone:"",x:tag,s:`Alta probable (${src})${fb&&fb.ok?` · fiabilidad ${fb.pct} %`:""}.`,go});
      if(G&&last&&a.finT&&(r.eLim==null||last.e>(+r.eLim||0)+.4)){ const due=a.finT+(last.h+G)*HOUR, hs=(now-(a.finT+last.h*HOUR))/HOUR; if(hs>G+4) L.push({t:due,late:1,k:"Muestra",tone:"warn",x:tag,s:`Sin muestra desde hace ${hh(hs)} (lo habitual: cada ~${hh(G)}).`,go:"tanque/"+a.lote}); else if(due<now+win&&due>now-HOUR) L.push({t:due,late:0,k:"Muestra",tone:"",x:tag,s:`Toca la próxima muestra (cada ~${hh(G)} en el histórico).`,go:"tanque/"+a.lote}); } });
    D().OC.forEach(o=>{ if(o.mr&&o.mr>now-24*HOUR&&o.mr<now+win) L.push({t:o.mr,late:o.mr<now?2:0,k:o.mr<now?"Fuera de tiempo":"Límite",tone:o.mr<now?"late":"warn",x:o.id+" · "+o.nombre,s:`${o.mr<now?"Pasó":"Llega a"} el límite de la levadura (${o.mr<now?whenTxt(o.mr):dd(o.mr)}).`,go:"ficha/levadura/"+E(o.nombre)}); });
    return L.sort((a,b)=>(b.late-a.late)||(a.t-b.t)); }
  function agenda(max,home){ const L=eventos(), mx=max||8; const body=L.length?`<div class="v39-ag">${L.slice(0,mx).map(e=>`<a class="v39-ev ${e.tone}" href="#/${e.go}"><span class="t">${e.late===2||e.t<Date.now()-HOUR?"":"<b style='font-size:12px'>"}${dd(e.t)}${e.late===2||e.t<Date.now()-HOUR?"":"</b>"}<br>${whenTxt(e.t)}</span><span><b>${esc(e.x)}</b><small>${esc(e.s)}</small></span><span class="k">${esc(e.k)}</span></a>`).join("")}</div>${L.length>mx?`<p class="v39-note">y ${L.length-mx} más en el Monitor.</p>`:""}`:`<p class="v35-ok">No hay eventos pendientes en las próximas 36 horas.</p>`;
    return `<section class="v35-centro ${home?"v35-home":""}"><div class="v35-ch-h"><div><span class="v35-eb">AGENDA</span><h2>Lo que viene en las próximas horas</h2></div>${home?`<a class="more" href="#/analista/monitor">Ver el Monitor →</a>`:""}</div>${body}<p class="v39-note">Vencimientos, T0, altas probables (con su fiabilidad), muestras pendientes y límites de colectores. Se calcula con tus datos actuales.</p></section>`; }

  /* ---- recomendador de siembra ---- */
  function famMarca(marca,fam){ const L=H2.hist().filter(h=>h.marca===marca&&h.lev&&An.famDe(h.lev.n)===fam); return {n:L.length,h75:med(L.map(h=>h.h75))}; }
  function cand(marca){ const now=Date.now(), base=med(H2.hist().filter(h=>h.marca===marca).map(h=>h.h75)), bv=med(H2.hist().filter(h=>h.marca===marca).map(h=>h.lev&&h.lev.viab)), gc=Object.assign({alerta:8,seguimiento:6},App.S.config.generaciones||{});
    return D().OC.filter(o=>o.mk===marca).map(o=>{ const fm=famMarca(marca,o.fam), rest=o.mr?(o.mr-now)/HOUR:null, av=[]; if(rest!=null&&rest<0) av.push({t:"Fuera de tiempo",c:"late"}); else if(rest!=null&&rest<12) av.push({t:"Vence en "+hh(rest),c:"warn"}); if(+o.gen+1>=gc.alerta) av.push({t:"Próxima cosecha: Gen "+(+o.gen+1)+" (alerta desde Gen "+gc.alerta+")",c:"warn"}); if(o.viab!=null&&bv!=null&&fm.n>=0&&o.viab<bv-.02) av.push({t:"Viabilidad bajo la mediana de la marca",c:"warn"});
      return {o,fm,rest,base,av,viab:o.viab}; }); }
  function sembrar(marca,crit){ const ms=An.marcasH().concat(Mk.activas().map(m=>m.id)).filter((v,i,a)=>a.indexOf(v)===i); marca=marca?H2.key(decodeURIComponent(marca)):(D().OC[0]?D().OC[0].mk:ms[0]); crit=crit||"tiempo";
    const C=cand(marca), vivo=C.filter(c=>c.rest==null||c.rest>=0), muerto=C.filter(c=>c.rest!=null&&c.rest<0), srt={tiempo:(a,b)=>(a.rest??1e9)-(b.rest??1e9),gen:(a,b)=>a.o.gen-b.o.gen,viab:(a,b)=>(b.viab??0)-(a.viab??0),comport:(a,b)=>(a.fm.h75??1e9)-(b.fm.h75??1e9)}[crit]||((a,b)=>0);
    const rows=[...vivo.sort(srt),...muerto.sort(srt)];
    const ctl=`<div class="v35-ctl"><span class="v39-note">Para sembrar</span>${An.sel("v39m",ms.map(m=>[m,tit(m)]),marca)}<span class="v39-note">ordenar por</span>${An.sel("v39c",[["tiempo","Tiempo restante (lo que vence primero)"],["gen","Generación (menor primero)"],["viab","Viabilidad (mayor primero)"],["comport","Comportamiento histórico (más rápida primero)"]],crit)}</div>`;
    return ctl+An.card("Levaduras disponibles en colectores — "+esc(tit(marca)),"Solo las de esta marca. El orden depende del criterio elegido; la decisión final es tuya.",rows.length?`<div class="v35-tbw"><table class="v32-tb v39-sem"><thead><tr><th>Posición</th><th>Levadura</th><th>Gen</th><th>Volumen</th><th>Viabilidad</th><th>Tiempo restante</th><th>Su familia en ${esc(tit(marca))}</th><th>Avisos</th></tr></thead><tbody>${rows.map((c,i)=>`<tr><td>${esc(c.o.id)}</td><td><a href="#/ficha/levadura/${E(c.o.nombre)}">${esc(c.o.nombre)}</a>${i===0&&c.rest!=null&&c.rest>=0?` <span class="pl ok">Sugerida</span>`:""}</td><td>${c.o.gen}</td><td>${c.o.vol!=null?f(c.o.vol,0)+" Hl":"—"}</td><td>${c.viab!=null?Math.round(c.viab*1000)/10+" %":"—"}</td><td>${c.rest==null?"—":c.rest<0?"vencida "+hh(-c.rest):hh(c.rest)}</td><td>${c.fm.n>=8?`${hh(c.fm.h75)} al 75 % <small>(n=${c.fm.n}${c.base!=null?"; marca "+hh(c.base):""})</small>`:`<small>Referencia histórica limitada (n=${c.fm.n})</small>`}</td><td>${c.av.length?c.av.map(a=>`<span class="pl ${a.c==="late"?"crit":"warn"}">${esc(a.t)}</span>`).join(" "):"—"}</td></tr>`).join("")}</tbody></table></div>${V.fuente("Posiciones y tiempos salen del inventario de colectores (límite = máximo de levadura abierta). El comportamiento es la mediana de horas al 75 % de las fermentaciones históricas de esa marca sembradas con la misma familia. «Sugerida» = la primera según el criterio, entre las que aún están dentro de tiempo.")}`:`<p class="v35-no">No hay levadura de ${esc(tit(marca))} en colectores en este momento.</p>`)
      +`<p class="v39-note">No se recomienda mezclar marcas: si necesitas levadura de otra marca, cámbialo arriba.</p>`; }

  /* ---- salud de los datos ---- */
  function problemas(){ const R=An.DS(), out=[], F=[["alc","Alcohol final","%"],["e72","Extracto a 72 h","°P"],["ph","pH final",""],["rdf","Atenuación real (RDF)","%"],["eo","E.O del mosto","°P"],["h75","Horas al 75 %","h"],["vol","Volumen","Hl"]];
    const add=(r,campo,val,ref,motivo,u)=>out.push({lote:r.h.lote,marca:r.marca,campo,val,ref,motivo,u,go:"ficha/fv/"+E(r.h.lote)});
    An.marcasH().forEach(m=>{ const rm=R.filter(r=>r.marca===m); F.forEach(([k,l,u])=>{ const v=rm.map(r=>r.v[k]).filter(x=>x!=null); if(v.length<15) return; const md=An.pc(v,.5), mad=An.pc(v.map(x=>Math.abs(x-md)),.5); if(!mad) return; rm.forEach(r=>{ const x=r.v[k]; if(x!=null&&Math.abs(x-md)>Math.max(6*mad*1.4826,.08*Math.abs(md))) add(r,l,x,md,"muy lejos de lo habitual de la marca",u); }); }); });
    R.forEach(r=>{ const v=r.v; if(v.ph!=null&&(v.ph<3||v.ph>7)) add(r,"pH final",v.ph,null,"fuera del rango posible (3–7)",""); if(v.viab!=null&&v.viab>100.5) add(r,"Viabilidad",v.viab,100,"mayor a 100 %","%"); if(v.rdf!=null&&(v.rdf>100||v.rdf<0)) add(r,"RDF",v.rdf,null,"fuera del rango posible (0–100 %)","%"); if(v.alc!=null&&v.alc<0) add(r,"Alcohol final",v.alc,null,"negativo","%");
      const p=r.h.pts.filter(x=>x.h>0); for(let i=1;i<p.length;i++) if(p[i].e>p[i-1].e+.15){ add(r,"Curva de extracto",p[i].e,p[i-1].e,`el extracto sube entre ${hh(p[i-1].h)} y ${hh(p[i].h)}`,"°P"); break; } });
    H2.activos().forEach(a=>{ const base={lote:a.lote,marca:a.marca,go:"tanque/"+a.lote,u:"",val:null,ref:null}; if(!a.lev||!a.lev.n) out.push(Object.assign({},base,{campo:"Levadura sembrada",motivo:"FV en proceso sin levadura registrada"})); if(a.eo==null) out.push(Object.assign({},base,{campo:"E.O del mosto",motivo:"FV en proceso sin extracto original"}));
      const p=a.pts.filter(x=>x.h>0); for(let i=1;i<p.length;i++) if(p[i].e>p[i-1].e+.15){ out.push(Object.assign({},base,{campo:"Muestras",motivo:`el extracto sube entre ${hh(p[i-1].h)} y ${hh(p[i].h)}`,val:p[i].e,ref:p[i-1].e,u:"°P"})); break; } });
    return out; }
  function datos(){ const P=problemas(), por={}; P.forEach(p=>por[p.campo]=(por[p.campo]||0)+1); const tot=An.DS().length;
    App._v39x=()=>V.excel(`revision_de_datos_${App.Excel35.stamp()}.xlsx`,[{nombre:"Posibles errores",titulo:"Posibles errores de captura",sub:"Revisión automática · "+App.Excel35.stamp(),cols:[{h:"Lote"},{h:"Marca"},{h:"Campo"},{h:"Valor",t:"n"},{h:"Referencia",t:"n"},{h:"Motivo"}],rows:P.map(p=>[p.lote,p.marca,p.campo,p.val,p.ref,p.motivo])}]);
    return `<div class="v32-kp"><div><b>${P.length}</b><span>Posibles errores</span></div><div><b>${new Set(P.map(p=>p.lote)).size}</b><span>Lotes con algo por revisar</span></div><div><b>${tot}</b><span>Fermentaciones revisadas</span></div><div><b>${tot?Math.round(100*(1-new Set(P.map(p=>p.lote)).size/tot)):0}%</b><span>Sin observaciones</span></div></div>`
      +An.card("Qué conviene revisar","Valores imposibles o muy alejados de lo habitual de su marca (más de 6 desviaciones robustas). Pueden ser errores de captura o casos reales: tú decides.",P.length?`<div class="v35-tbw"><table class="v32-tb"><thead><tr><th>Lote</th><th>Marca</th><th>Campo</th><th>Valor</th><th>Habitual</th><th>Motivo</th></tr></thead><tbody>${P.slice(0,60).map(p=>`<tr><td><a href="#/${p.go}">${esc(p.lote)}</a></td><td>${esc(tit(p.marca))}</td><td>${esc(p.campo)}</td><td>${p.val!=null?n1(p.val,2)+" "+p.u:"—"}</td><td>${p.ref!=null?n1(p.ref,2)+" "+p.u:"—"}</td><td>${esc(p.motivo)}</td></tr>`).join("")}</tbody></table></div>${P.length>60?`<p class="v39-note">Mostrando 60 de ${P.length}. Exporta para verlos todos.</p>`:""}<button class="btn sm" id="v39x">Exportar la lista a Excel</button>`:`<p class="v35-ok">No encontré valores imposibles ni atípicos extremos.</p>`)
      +`<p class="v39-note">Los análisis del Analista ya ignoran el 1 % más extremo en los histogramas, y usan medianas, que resisten datos erróneos.</p>`; }

  App.AnX={agenda,sembrar,datos,eventos,problemas,
    mount(tab,a,b){ if(tab==="sembrar"){ const m=$("#v39m"), c=$("#v39c"), go=()=>{ location.hash="#/analista/sembrar/"+E(m.value)+"/"+E(c.value); }; m&&(m.onchange=go); c&&(c.onchange=go); } if(tab==="datos"){ const x=$("#v39x"); if(x) x.onclick=()=>App._v39x&&App._v39x(); } } };

  /* ---- Cifra ---- */
  const prev=App.BotDirecto, {out,row}=B35, m35=B35.m35();
  function bot(texto){ const q=nrm(texto); if(!q) return null;
    if(/(que (va a pasar|pasa|tengo|hay|sigue|toca) (hoy|ahora|manana|en las proximas)|^agenda$|proximas (horas|24)|pendientes de hoy|que tengo pendiente|que sigue)/.test(q)){ const L=eventos(); if(!L.length) return out({h:"No hay eventos pendientes",s:"Nada vence, llega a T0 o a la alta en las próximas 36 horas."},["POTENCIAL"]);
      return out({h:`Lo que viene (${L.length} evento${L.length>1?"s":""})`,s:"Ordenado por urgencia y hora.",rows:L.slice(0,7).map(e=>row(e.k+" · "+e.x,`${esc(e.s)} <small>${dd(e.t)} · ${whenTxt(e.t)}</small> <a href="#/${e.go}">ver</a>`)),ver:[["#/analista/monitor","Abrir el Monitor"]]},["Qué levadura siembro","Datos sospechosos"]); }
    if(/(que|cual|cuales) levadura(s)? (siembro|sembrar|puedo sembrar|uso para|usar para|recomiendas|me recomiendas|utilizo para)|recomienda.*levadura|levadura (para|de) sembrar/.test(q)){ const mk=B35.marcasEn(q)[0]||m35.marca; if(!mk) return out({h:"¿Para qué marca?",s:"Dime la marca, por ejemplo: «qué levadura siembro para light»."},["Qué levadura siembro para Light"]);
      const C=cand(mk).filter(c=>c.rest==null||c.rest>=0).sort((a,b)=>(a.rest??1e9)-(b.rest??1e9)); if(!C.length) return out({h:`No hay levadura disponible de ${esc(tit(mk))}`,s:"No hay posiciones dentro de tiempo en colectores para esa marca."},["DISPONIBILIDAD"]);
      m35.marca=mk; return out({h:`Para sembrar ${esc(tit(mk))}`,s:"Ordenadas por lo que vence primero (puedes cambiar el criterio en la pantalla).",rows:C.slice(0,4).map((c,i)=>row((i===0?"Sugerida · ":"")+c.o.id,`<a href="#/ficha/levadura/${E(c.o.nombre)}"><b>${esc(c.o.nombre)}</b></a> · Gen ${c.o.gen} · ${c.o.vol!=null?f(c.o.vol,0)+" Hl · ":""}${c.rest==null?"":"vence en "+hh(c.rest)}${c.av.filter(a=>!/^Vence/.test(a.t)).length?" · <small>"+c.av.filter(a=>!/^Vence/.test(a.t)).map(a=>esc(a.t)).join("; ")+"</small>":""}`)),note:"La decisión final es tuya; aquí solo se ordena con datos del inventario.",ver:[[`#/analista/sembrar/${E(mk)}`,"Ver la comparación completa"]]},["DISPONIBILIDAD"]); }
    if(/(datos sospechosos|errores (en|de) (los )?datos|calidad de (los )?datos|datos raros|datos mal|revisa(r)? (los )?datos|salud de (los )?datos)/.test(q)){ const P=problemas(); return out({h:P.length?`${P.length} posibles errores en los datos`:"No encontré errores evidentes",s:P.length?"Valores imposibles o muy atípicos para su marca. Pueden ser errores de captura o casos reales.":"No hay valores imposibles ni atípicos extremos.",rows:P.slice(0,5).map(p=>row(p.lote+" · "+p.campo,`${p.val!=null?n1(p.val,2)+" "+p.u+" — ":""}${esc(p.motivo)} <a href="#/${p.go}">ver</a>`)),ver:[["#/analista/datos","Ver y exportar la lista completa"]]},["Qué va a pasar hoy"]); }
    if(/(fiabilidad|confiable|que tan (segur|cierta|precis|buena)|que confianza|cuanta confianza).*(alta|proyeccion|estimacion)?/.test(q)&&/(alta|proyeccion|estimacion|fiabilidad|confiable)/.test(q)){ const a=B35.fermsEn(q)[0]||(m35.lote?V.buscaFerm(m35.lote):null); if(a&&!a.hist){ const py=H2.proyHist(a), fb=H2.fiab(a,"h"), pa=App.Alta.proy(a.x), fm=pa&&pa.estado==="proyectada"?H2.fiab(a,"m"):null; m35.lote=a.lote;
        return out({h:`Fiabilidad de la alta de FV ${a.tq}`,s:py.ok?`Lo más probable: ${fmtS(py.t)}`:esc(py.motivo||""),k:fb.ok?[[fb.pct+"%","Fiabilidad histórica"],["±"+hh(fb.mae),"Error típico"],[fb.n,"Pruebas"]]:null,rows:[fb.ok?row("Qué significa",esc(fb.texto)):row("Fiabilidad",`<small>${esc(fb.motivo)}</small>`),fm&&fm.ok?row("Con sus muestras",`${fm.pct} % (${fm.n} pruebas)`):null],note:"Se mide repitiendo el cálculo sobre fermentaciones pasadas cuya alta ya se conoce. No garantiza el resultado de este FV.",ver:[["#/tanque/"+a.lote,"Abrir el tanque"]]},["PROYECTA FV "+a.tq,"EXPLICA"]); } }
    return null; }
  App.BotDirecto=function(texto,env){ try{ const r=bot(texto); if(r) return Object.assign(r,{directo:true}); }catch(e){ console.error("v39 bot",e); } return prev(texto,env); };
  setTimeout(()=>{ try{ App.render&&App.render(true); }catch(e){} },0);
})();

</script>
